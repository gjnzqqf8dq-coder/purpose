/* ============================================================ タスク詳細（完了の基準・ステップ・ログ） */
function openTaskSheet(tid){
  const t=taskOf(tid);if(!t)return;
  openSheet(body=>{
    const g=goalOf(t.goalId), m=g&&(g.miles||[]).find(x=>x.id===t.mileId);
    const sd=t.steps.filter(s=>s.done).length;
    body.innerHTML=`
      <div class="sh-kicker">${g?esc(g.title):'ゴールなし'}${m?' › '+esc(m.title):''}${t.rid?'　<span class="pill">ルーティン</span>':''}</div>
      <div class="sh-title" id="tsTitle" contenteditable="true" spellcheck="false">${esc(t.title)}</div>
      <div class="sh-sec">いつ</div>
      <div class="opts" id="tsWhen">${[['今日',TODAY],['明日',addDays(1)],['来週',addDays(7)],['未定',null]].map(([l,v])=>`<button class="opt${t.date===v?' on':''}" data-w="${v||''}">${l}</button>`).join('')}<label class="opt${t.date&&![TODAY,addDays(1),addDays(7)].includes(t.date)?' on':''}"><input type="date" id="tsDate" value="${t.date||''}"></label></div>
      <div class="sh-sec">ゴール</div>
      <div class="opts" id="tsGoal"><button class="opt${t.goalId?'':' on'}" data-g="">なし</button>${sortedGoals().map(x=>`<button class="opt${t.goalId===x.id?' on':''}" data-g="${x.id}">${esc(x.title)}</button>`).join('')}</div>
      ${g&&(g.miles||[]).length?`<div class="sh-sec">中の目標</div><div class="opts" id="tsMile"><button class="opt${t.mileId?'':' on'}" data-m="">なし</button>${g.miles.map(x=>`<button class="opt${t.mileId===x.id?' on':''}" data-m="${x.id}">${esc(x.title)}</button>`).join('')}</div>`:''}
      <div class="sh-sec">担当</div>
      <div class="opts" id="tsWho">${S.members.map(x=>`<button class="opt${t.assignee===x.id?' on':''}" data-u="${x.id}">${esc(x.name)}</button>`).join('')}</div>
      <div class="sh-sec">状態</div>
      <div class="opts" id="tsSt">${Object.entries(STATUS).map(([k,l])=>`<button class="opt${t.status===k?' on':''}" data-s="${k}">${l}</button>`).join('')}</div>
      <div class="sh-sec">完了の基準</div>
      <div class="frow"><textarea class="field" id="tsCrit" placeholder="何ができたら完了か。空ならAIが対話で決めて書く">${esc(t.criteria)}</textarea><button class="ib" id="tsCritMic"></button></div>
      <div class="sh-sec">ステップ <span style="float:right;font-variant-numeric:tabular-nums">${sd}/${t.steps.length}</span></div>
      <div class="steps" id="tsSteps">${t.steps.map(s=>`<div class="row${s.done?' done':''}" data-sid="${s.id}"><div class="c">${CK(10)}</div><span>${esc(s.title)}</span></div>`).join('')||'<div class="pl-empty">まだ無い。AIに3〜5個に分けてもらう。</div>'}</div>
      <div class="frow"><input class="field" id="tsStepIn" placeholder="ステップを足す"><button class="ib" id="tsStepAdd">＋</button></div>
      <div class="sh-sec">ログ（何が起きたか）</div>
      <div class="tl" id="tsLog">${t.log.slice().reverse().map(l=>`<div class="${l.who==='ai'?'ai':''}"><small>${fmtT(l.t)} · ${esc(memName(l.who)||l.who)}</small>${esc(l.text)}</div>`).join('')||'<div class="pl-empty">まだ無い</div>'}</div>
      <div class="frow"><input class="field" id="tsLogIn" placeholder="いま何が起きたか"><button class="ib" id="tsLogMic"></button><button class="ib" id="tsLogAdd">＋</button></div>
      <div class="sh-actions col">
        <button class="btn primary" id="tsAI">AIに依頼する</button>
        <div style="display:flex;gap:8px"><button class="btn ${t.done?'plain':'plain'}" id="tsDone">${t.done?'未完了に戻す':'完了にする'}</button><button class="btn dangerous" id="tsDel">削除</button></div>
      </div>`;
    const touch=()=>{t.u=Date.now();saveQuiet()};
    const title=body.querySelector('#tsTitle');
    title.onblur=()=>{const v=title.textContent.trim();if(v&&v!==t.title){t.title=v;touch();render()}};
    title.onkeydown=e=>{if(e.key==='Enter'){e.preventDefault();title.blur()}};
    body.querySelectorAll('#tsWhen .opt[data-w]').forEach(b=>onTap(b,()=>{t.date=b.dataset.w||null;touch();render();
      body.querySelectorAll('#tsWhen .opt').forEach(x=>x.classList.toggle('on',x===b))}));
    body.querySelector('#tsDate').onchange=e=>{if(e.target.value){t.date=e.target.value;touch();render();
      body.querySelectorAll('#tsWhen .opt').forEach(x=>x.classList.toggle('on',x.tagName==='LABEL'))}};
    body.querySelectorAll('#tsGoal .opt').forEach(b=>onTap(b,()=>{t.goalId=b.dataset.g||null;t.mileId=null;touch();render();openTaskSheet(tid)}));
    body.querySelectorAll('#tsMile .opt').forEach(b=>onTap(b,()=>{t.mileId=b.dataset.m||null;touch();render();
      body.querySelectorAll('#tsMile .opt').forEach(x=>x.classList.toggle('on',x===b))}));
    body.querySelectorAll('#tsWho .opt').forEach(b=>onTap(b,()=>{const prev=t.assignee;t.assignee=t.assignee===b.dataset.u?null:b.dataset.u;
      if(t.assignee&&t.assignee!==prev&&t.assignee!==ME())notify(`${memName(t.assignee)}に「${t.title}」を任せた`,{type:'task',id:t.id});
      touch();render();body.querySelectorAll('#tsWho .opt').forEach(x=>x.classList.toggle('on',x.dataset.u===t.assignee))}));
    body.querySelectorAll('#tsSt .opt').forEach(b=>onTap(b,()=>{t.status=b.dataset.s;t.done=t.status==='done';
      if(t.done)notify(`「${t.title}」を完了`,{type:'task',id:t.id});touch();render();
      body.querySelectorAll('#tsSt .opt').forEach(x=>x.classList.toggle('on',x===b))}));
    const crit=body.querySelector('#tsCrit');attachMic(body.querySelector('#tsCritMic'),crit);
    crit.onblur=()=>{if(crit.value!==t.criteria){t.criteria=crit.value;touch()}};
    body.querySelectorAll('#tsSteps .row').forEach(r=>onTap(r,()=>{const s=t.steps.find(x=>x.id===r.dataset.sid);if(!s)return;s.done=!s.done;r.classList.toggle('done',s.done);
      if(s.done&&t.status==='todo')t.status='doing';touch();render()}));
    const si=body.querySelector('#tsStepIn');
    const addStep=()=>{const v=si.value.trim();if(!v)return;t.steps.push({id:uid('s_'),title:v,done:false});touch();openTaskSheet(tid)};
    body.querySelector('#tsStepAdd').onclick=addStep;si.onkeydown=e=>{if(e.key==='Enter')addStep()};
    const li=body.querySelector('#tsLogIn');attachMic(body.querySelector('#tsLogMic'),li);
    const addLog=()=>{const v=li.value.trim();if(!v)return;t.log.push({t:Date.now(),who:ME(),text:v});if(t.status==='todo')t.status='doing';
      notify(`「${t.title}」：${v}`,{type:'task',id:t.id});touch();render();openTaskSheet(tid)};
    body.querySelector('#tsLogAdd').onclick=addLog;li.onkeydown=e=>{if(e.key==='Enter')addLog()};
    body.querySelector('#tsAI').onclick=()=>openAISheet(t.title,promptForTask(t));
    body.querySelector('#tsDone').onclick=()=>{toggleTask(t);render();closeSheet();if(t.done)toast('完了')};
    const del=body.querySelector('#tsDel');
    del.onclick=()=>{
      if(!del.classList.contains('arm')){del.classList.add('arm');del.textContent='本当に削除する';
        setTimeout(()=>{del.classList.remove('arm');del.textContent='削除'},2600);return}
      S.del[t.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==t.id);closeSheet();save();toast('削除した');
    };
  });
}

/* ============================================================ AIに依頼（ゴール＋現在地を丸ごと渡す） */
const WORKSPACE_DOC="# Purpose — AIの作業場（ゴール × 現在地）\n\nこのリポジトリは桑田航希の「AIの作業場」。あなた（Claude Code / Codex / ChatGPT / Claude）が起きた瞬間に、\n**どこへ行くのか（ゴール）** と **いまどこにいるのか（現在地＝コンテキスト）** をここから読み取る。\n言葉で毎回説明しなくても、ここを読めば分かる状態を保つのがあなたの仕事。\n\n- 正データ：`data.json`（このファイルだけが真実。アプリ https://gjnzqqf8dq-coder.github.io/purpose/ はこれを表示する）\n- アプリは読むための道具。書くのは主にあなた。編集したら必ず `git add data.json && git commit -m \"…\" && git push`\n- 反映はアプリを開いた時と復帰時（60秒以上経過で自動）\n\n## 最初の言葉が「セットアップを始めてください」だったら\n\nヒアリングして data.json を整える。質問は一度に2つまで。答えを聞いたら即書く。順番：\n1. 名前と役割（members[0] を直す）\n2. いま追いかけているゴール（3〜7個。期限・カテゴリ・完了の基準を聞く → goals）\n3. それぞれのゴールの中の目標（3〜5個 → goals[].miles）\n4. 今日やること（→ tasks、date は今日）\n5. 毎日／毎週やること（→ routines）\n6. 追っている数字があれば（→ metrics、取り方が分からなければ src:\"pending\"）\n最後に「セットアップ完了」と notifs に1行入れ、push する。\n\n## 「AIに依頼する」で来たプロンプトの扱い\n\nアプリの「AIに依頼」は、ゴール・タスク・完了の基準・ステップ・ログ・チャット・受信箱・数値を丸ごと貼ってくる。\n1. **着手前**：完了の基準（criteria）が空なら、私に質問して決めてから書く。曖昧なまま走らない\n2. **分解**：steps が無ければ3〜5個に分けて書く\n3. **進行中**：やったことを `tasks[].log` に `{\"t\":<epoch_ms>,\"who\":\"ai\",\"text\":\"…\"}` で追記。steps の done を更新。status を doing → review → done\n4. **終了**：done:true、notifs に1行、commit & push。私への報告は3行以内（何をした／何が残った／確認が要ること）\n5. 分からない時は data.json 全体を読んでから聞く。既に作ってあるものを二度作らない\n\n## data.json の構造\n\n```\ncats        {id,name,hue,u}                                   カテゴリ（色相 hue 0-360）\ngoals       {id,title,deadline,cat,note,criteria,owner,miles:[{id,title,done}],plan:{route,cargo,alt},u}\ntasks       {id,title,date|null,done,goalId,mileId,assignee,status,criteria,steps:[{id,title,done}],log:[{t,who,text}],rid,u}\nmembers     {id,name,role,hue,u}                              who に使う id。\"ai\" はあなた\nroutines    {id,title,freq:\"daily\"|\"weekdays\"|\"weekly\",dow:[0-6],goalId,steps:[…],assignee,u}   毎日タスクを自動生成\nmanuals     {id,title,steps:[…],note,u}                       この仕事はこの手順で\ncrm         {id,name,person,stage,owner,next,nextDate,log:[{t,who,text,src}],u}\n              stage は リスト入り→アプローチ中→商談日程調整→初回商談→2次商談→提案中→成約／失注\nmetrics     {id,name,unit,parentId,goalId,owner,src:\"manual\"|\"pending\"|\"connected\",series:[{d,v}],target,pin,note,u}\nmindmaps    {id,title,root:{id,t,c:[…]},u}\ndrive       {id,name,kind:\"note\"|\"link\"|\"file\",tag,goalId,body,url,u}   ナレッジ・スキル・素材\ntransfers   {id,name,size,url,to,note,t,expires,path,u}       ファイル便（7日で消す）\nrecordings  {id,kind:\"screen\"|\"minutes\",title,t,dur,transcript,summary,goalId,attendees,scope,url,u}\nchat        {id,t,who,text,goalId,u}                          ここで話した内容はあなたが読む。返信は who:\"ai\"\nnotifs      {id,t,who,text,ref:{type,id},u}                   誰がどこで何をしたか\ninbox       {id,t,src,text,handled,u}                         LINE・メールの貼り付け。対応したら handled:true\ndel         {\"<id>\": epoch_ms}                                削除は消さずにここへ\n```\n\n- `date` / `deadline` / `d` は `YYYY-MM-DD`、`t` は epoch ms\n- `id` は一意。新規は接頭辞 `g_ m_ t_ s_ c_ u_ r_ mn_ cr_ k_ mm_ n_ d_ f_ rec_ ch_ n_ ib_`\n- **`u` は必ず編集時点の epoch ms**（新しい方が同期で勝つ）。既存を消さない。消す時は del\n- tasks.date が null ＝「ふわついている」（期日未定）。今日やるなら今日の日付\n- 進捗の状態は tasks.status（todo / doing / review / done）と steps の done で表す\n\n## フライトプラン（goals[].plan）\n\nゴールに向かう前に「着くまでに何が起きるか」を一周見ておく層。書くのはあなただけ。\n- route：必ず通る工程を順に `{id,title,when,m:false}`（m:true は中の目標に昇格済み）\n- cargo：要る人・モノ・お金と期限 `{id,title,due,t:false}`（t:true はタスク化済み）\n- alt：分岐 `{id,cond,risk,hedge}`（もし〜なら／何が起きる／どちらに転んでも損しない一手）\n\n## 現在地を守るために、あなたがやること\n\n- タスクを進めたら log に残す。やらないと「今どこか」が消える\n- 相手とのやり取り（メール・カレンダー）が読めるなら crm[].log に足す。4日以上動きが無い相手はリマインドのタスクを作る\n- metrics の src:\"pending\" は「取りに行ってほしい数字」。何を指すか確かめ、取得元と接続方法を調べて取ってきて series に入れ、src:\"connected\" にする\n- 議事録（recordings[].transcript）から決まったこと・やることを拾って tasks に入れ、summary に要約を書く\n- inbox の未対応は、返信の下書きを chat に who:\"ai\" で置き、handled:true にする\n- ルーティンの登録・マニュアルの追加も頼まれたらここに書く\n- 迷ったら現在地（tasks / chat / inbox / metrics / crm / recordings）を全部読んでから、質問は2つまで\n\n## 文体\n\n日本語。名詞句の見出し、事実文、数字先行。コピー調・詩的表現・二人称の呼びかけは使わない。返答は短く。\n";
function ctxHeader(){return `# 作業場：Purpose
今日：${TODAY}／私：${memName(ME())}
リポジトリ：${repoPath()}（正データ data.json／公開 ${APPURL}）
まずリポジトリの CLAUDE.md（＝AGENTS.md）を読む。そこに作業場のルールと data.json の構造がある。`}
function goalBlock(g){if(!g)return'';const ms=g.miles||[];
  return `## ゴール（id ${g.id}）
- ${g.title}／期限 ${g.deadline||'なし'}／担当 ${memName(g.owner)||'未定'}
- 完了の基準：${g.criteria||'（未定）'}
- 中の目標：${ms.length?ms.map((m,i)=>`${i+1}.${m.done?'✓':'○'}${m.title}`).join(' ／ '):'なし'}${g.note?'\n- メモ：'+g.note:''}`}
function taskBlock(t){
  return `## タスク（id ${t.id}）
- ${t.title}／期日 ${t.date||'未定'}／状態 ${STATUS[t.status]}／担当 ${memName(t.assignee)||'未定'}
- 完了の基準：${t.criteria||'（未定 → まず私に質問して決め、data.json に書いてから着手）'}
- ステップ：${t.steps.length?t.steps.map((s,i)=>`${i+1}.${s.done?'✓':'○'}${s.title}`).join(' ／ '):'なし（3〜5個に分けて書く）'}
- ログ（新しい順）：${t.log.length?'\n  '+t.log.slice(-8).reverse().map(l=>`[${fmtT(l.t)} ${memName(l.who)||l.who}] ${l.text}`).join('\n  '):'なし'}`}
function ctxBlock(goalId){
  const out=[];
  const ch=S.chat.filter(c=>!goalId||c.goalId===goalId||!c.goalId).slice(-8);
  if(ch.length)out.push('- 最近のチャット：\n  '+ch.map(c=>`[${fmtT(c.t)} ${memName(c.who)||c.who}] ${c.text}`).join('\n  '));
  const ib=S.inbox.filter(i=>!i.handled).slice(-3);
  if(ib.length)out.push('- 未対応の受信箱：\n  '+ib.map(i=>`[${i.src}] ${i.text.slice(0,140).replace(/\n/g,' ')}`).join('\n  '));
  const ms=S.metrics.filter(m=>!goalId||m.goalId===goalId);
  if(ms.length)out.push('- 数値：'+ms.map(m=>`${m.name} ${latestV(m)===null?'—':latestV(m)+(m.unit||'')}${m.src==='pending'?'（接続待ち）':''}`).join('／'));
  const dr=S.drive.filter(d=>!goalId||d.goalId===goalId);
  if(dr.length)out.push('- ドライブ：'+dr.slice(0,8).map(d=>`${d.name}${d.url?'（'+d.url+'）':''}`).join('／'));
  const rec=S.recordings.filter(r=>r.transcript&&(!goalId||r.goalId===goalId)).slice(-2);
  if(rec.length)out.push('- 最近の議事録／録画：'+rec.map(r=>`${r.title}（${fmtT(r.t)}）`).join('／')+'（全文は data.json の recordings）');
  const stale=S.crm.filter(c=>crmStale(c)>=4&&!['成約','失注'].includes(c.stage));
  if(stale.length)out.push('- 顧客で止まっている：'+stale.map(c=>`${c.name}（${crmStale(c)}日）`).join('／'));
  return out.length?'## 現在地（コンテキスト）\n'+out.join('\n'):'';
}
function rulesBlock(){return `## 作業場の約束
1. 着手前：完了の基準が空なら私に質問して決め（一度に2つまで）、data.json に書いてから始める
2. 進行中：tasks[].steps の done を更新し、tasks[].log に {"t":epoch_ms,"who":"ai","text":"何をしたか"} を追記。status を doing／review／done に
3. 既存を消さない。u は必ず現在時刻の epoch ms。削除は del に {"id":epoch_ms}
4. 終わったら notifs に1行（who:"ai"）を足し、git add data.json && git commit -m "…" && git push で反映
5. 今どこか分からない時は data.json 全体（tasks／chat／inbox／metrics／crm／recordings）を読んでから聞く`}
function promptForTask(t){const g=goalOf(t.goalId);
  return [ctxHeader(),goalBlock(g),taskBlock(t),ctxBlock(t.goalId),rulesBlock(),'## 依頼\nこのタスクをゴール達成の方向で進めて。完了の基準を満たしたら done にして、何をしたか log に残して報告。'].filter(Boolean).join('\n\n')}
function promptForGoal(g,ask){const ts=goalTasks(g).filter(t=>!t.done);
  return [ctxHeader(),goalBlock(g),ts.length?'## 未完了のタスク\n'+ts.map(t=>`- ${t.title}（${t.date||'未定'}／${STATUS[t.status]}${t.criteria?'／基準:'+t.criteria:''}）`).join('\n'):'',ctxBlock(g.id),rulesBlock(),
    '## 依頼\n'+(ask||'このゴールの現在地を読み、次に進める一手を決めて実行して。中の目標やタスクが足りなければ data.json に足す（miles は3〜5個、tasks は日付つき）。')].filter(Boolean).join('\n\n')}
function promptAll(ask){
  const due=S.tasks.filter(t=>!t.done&&t.date&&t.date<=TODAY), fl=S.tasks.filter(t=>!t.done&&!t.date);
  return [ctxHeader(),
    '## ゴール一覧\n'+(sortedGoals().map(g=>{const ms=g.miles||[];return `- ${g.title}（${g.deadline||'期限なし'}／${ms.filter(m=>m.done).length}/${ms.length}／id ${g.id}）${ms.find(m=>!m.done)?' いま：'+ms.find(m=>!m.done).title:''}`}).join('\n')||'なし'),
    '## 今日やる\n'+(due.map(t=>`- ${t.title}（${t.date}／${STATUS[t.status]}）`).join('\n')||'なし'),
    fl.length?'## ふわついている\n'+fl.map(t=>`- ${t.title}`).join('\n'):'',
    ctxBlock(null),rulesBlock(),'## 依頼\n'+(ask||'現在地を読んで、今日いちばん効く一手を決めて実行して。ふわついているタスクは期日を提案して。')].filter(Boolean).join('\n\n')}
const cliCmd=(bin,p)=>`cd "${repoPath()}" && ${bin} "$(cat <<'PURPOSE_EOF'\n${p}\nPURPOSE_EOF\n)"`;

    ${card(`<div class="msgs" id="msgs">${list.length?list.map(c=>`<div class="msg${c.who===ME()?' me':''}${c.who==='ai'?' ai':''}">${esc(c.text)}<small>${c.who!==ME()?esc(memName(c.who)||c.who)+' · ':''}${fmtT(c.t)}${c.goalId&&chatFilter==='all'&&goalOf(c.goalId)?' · '+esc(goalOf(c.goalId).title):''}</small></div>`).join(''):'<div class="hint">ここで話した内容はAIが読む。変な場所で話すより、ここで。</div>'}</div>

  const inp=el.querySelector('#chatIn');attachMic(el.querySelector('#chatMic'),inp);
  const send=()=>{const v=inp.value.trim();if(!v)return;
    S.chat.push({id:uid('ch_'),t:Date.now(),who:ME(),text:v,goalId:chatFilter==='all'?null:chatFilter,u:Date.now()});
    if(S.chat.length>1000)S.chat=S.chat.slice(-1000);
    notify(`チャット：${v.slice(0,40)}`,{type:'chat',id:chatFilter});inp.value='';save();
    const m=el.querySelector('#msgs');if(m)m.scrollTop=m.scrollHeight};
  el.querySelector('#chatSend').onclick=send;inp.onkeydown=e=>{if(e.key==='Enter'&&!e.isComposing)send()};
  addBtn(act,'AIに要約',()=>openAISheet('チャット',[ctxHeader(),'## チャット全文（'+(chatFilter==='all'?'すべて':goalOf(chatFilter)?.title)+'）\n'+list.map(c=>`[${fmtT(c.t)} ${memName(c.who)||c.who}] ${c.text}`).join('\n'),rulesBlock(),'## 依頼\nこのチャットから決まったこと・やること・未決を抜き出し、やることは tasks に日付つきで入れて。'].join('\n\n')));
  const m=el.querySelector('#msgs');if(m)m.scrollTop=m.scrollHeight;
}

  el.innerHTML=card(list.length?list.map(n=>`<div class="li" data-id="${n.id}"><div class="av" style="--h:${memOf(n.who)?memOf(n.who).hue:222}">${n.who==='ai'?'AI':esc((memName(n.who)||'?').slice(0,1))}</div><div class="t"><b style="font-weight:${n.t>seen&&n.who!==ME()?'650':'450'}">${esc(n.text)}</b><small>${esc(memName(n.who)||n.who)} · ${fmtT(n.t)}</small></div>${n.t>seen&&n.who!==ME()?'<i style="width:6px;height:6px;border-radius:50%;background:var(--red);box-shadow:0 0 6px rgba(255,59,48,.8)"></i>':''}</div>`).join(''):'<div class="hint">まだ動きが無い。タスクを完了したり、チャットしたりすると、ここに残る。</div>');
  el.querySelectorAll('.li').forEach(r=>onTap(r,()=>{const n=S.notifs.find(x=>x.id===r.dataset.id);if(!n||!n.ref)return;openRef(n.ref)}));
  addBtn(act,'既読',()=>{localStorage.setItem('purpose.seen',String(Date.now()));renderMore();renderBadge()});
  setTimeout(()=>{localStorage.setItem('purpose.seen',String(Date.now()));renderBadge()},1500);
}
function openRef(ref){
  if(!ref)return;
  if(ref.type==='task'&&taskOf(ref.id))openTaskSheet(ref.id);
  else if(ref.type==='goal'&&goalOf(ref.id))openGoalSheet(ref.id);
  else if(ref.type==='chat'){chatFilter=ref.id||'all';openPanel('chat')}
  else if(ref.type==='crm')openCRMSheet(ref.id);
  else if(ref.type==='metric')openMetricSheet(ref.id);
  else if(ref.type==='rec')openRecSheet(ref.id);
  else if(ref.type==='transfer')openPanel('transfers');
  else if(ref.type==='inbox')openPanel('inbox');
}

/* ============================================================ メンバー */
function lastActive(id){let t=0;S.notifs.forEach(n=>{if(n.who===id&&n.t>t)t=n.t});S.chat.forEach(c=>{if(c.who===id&&c.t>t)t=c.t});
  S.tasks.forEach(x=>x.log.forEach(l=>{if(l.who===id&&l.t>t)t=l.t}));return t}
function renderMembers(el,act){
  el.innerHTML=card(S.members.map(m=>{
    const doing=S.tasks.filter(t=>!t.done&&t.assignee===m.id&&t.status==='doing'), open=S.tasks.filter(t=>!t.done&&t.assignee===m.id), la=lastActive(m.id);
    return `<div class="li" data-id="${m.id}"><div class="av" style="--h:${m.hue}">${esc(m.name.slice(0,1))}</div><div class="t"><b>${esc(m.name)}${m.id===ME()?' <span class="pill">自分</span>':''}${m.role?` <small style="display:inline">${esc(m.role)}</small>`:''}</b><small>${doing.length?'いま：'+esc(doing[0].title)+(doing.length>1?' ほか'+(doing.length-1):''):'進行中なし'}</small></div><div class="r">${open.length} 件<br>${la?ago(la):'—'}</div></div>`}).join(''))

  addBtn(act,'＋ メンバー',()=>openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">メンバーを追加</div><input class="field" id="mN" placeholder="名前" style="margin-top:10px"><input class="field" id="mR" placeholder="役割（任意）"><div class="sh-actions"><button class="btn primary" id="mAdd">追加</button></div>`;
    body.querySelector('#mAdd').onclick=()=>{const n=body.querySelector('#mN').value.trim();if(!n)return;
      S.members.push({id:uid('u_'),name:n,role:body.querySelector('#mR').value.trim(),hue:Math.floor(Math.random()*360),u:Date.now()});closeSheet();save();toast('追加した')};
  }));

function openMemberSheet(id){const m=memOf(id);if(!m)return;
  openSheet(body=>{
    const ts=S.tasks.filter(t=>t.assignee===id&&!t.done).sort((a,b)=>(a.date||'9999')<(b.date||'9999')?-1:1);

    body.innerHTML=`<div class="sh-kicker">メンバー</div><div class="sh-title">${esc(m.name)}</div><div class="sh-date">${esc(m.role||'')}${lastActive(id)?'　最後の動き '+ago(lastActive(id)):''}</div>
      <div class="sh-sec">やっていること</div><div class="m-inner" style="margin:0">${ts.length?ts.map(taskChip).join(''):'<div class="m-none">なし</div>'}</div>
      <div class="sh-sec">最近の動き</div><div class="tl">${acts.length?acts.map(n=>`<div><small>${fmtT(n.t)}</small>${esc(n.text)}</div>`).join(''):'<div class="pl-empty">なし</div>'}</div>
      <div class="sh-actions col"><button class="btn primary" id="mbMe">この人として使う</button><button class="btn plain" id="mbTask">タスクを振る</button>${S.members.length>1?'<button class="btn dangerous" id="mbDel">外す</button>':''}</div>`;
    bindTasks(body);

    body.querySelector('#mbTask').onclick=()=>openSheet(b2=>{
      b2.innerHTML=`<div class="sh-kicker">${esc(m.name)}に任せる</div><div class="frow" style="margin-top:10px"><input class="field" id="atT" placeholder="やること"><button class="ib" id="atMic"></button></div><div class="sh-actions"><button class="btn primary" id="atAdd">振る</button></div>`;
      const i=b2.querySelector('#atT');attachMic(b2.querySelector('#atMic'),i);

}
function openRoutineSheet(id){
  const r=id?S.routines.find(x=>x.id===id):{id:uid('r_'),title:'',freq:'daily',dow:[1,2,3,4,5],goalId:null,steps:[],u:0};

  openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">ルーティン</div>

      <div class="opts" id="rD" style="margin-top:8px;${r.freq==='weekly'?'':'display:none'}">${WDJ.map((w,i)=>`<button class="opt${(r.dow||[]).includes(i)?' on':''}" data-d="${i}">${w}</button>`).join('')}</div>

      <div class="sh-sec">ステップ（1行1つ・任意）</div><textarea class="field" id="rS" placeholder="例：\n受信箱を見る\n数値を入れる">${esc((r.steps||[]).join('\n'))}</textarea>
      <div class="sh-actions"><button class="btn primary" id="rSave">${id?'保存':'登録'}</button>${id?'<button class="btn dangerous" id="rDel">削除</button>':''}</div>`;
    attachMic(body.querySelector('#rMic'),body.querySelector('#rT'));
    body.querySelectorAll('#rF .opt').forEach(b=>onTap(b,()=>{r.freq=b.dataset.f;body.querySelectorAll('#rF .opt').forEach(x=>x.classList.toggle('on',x===b));body.querySelector('#rD').style.display=r.freq==='weekly'?'':'none'}));
    body.querySelectorAll('#rD .opt').forEach(b=>onTap(b,()=>{const d=+b.dataset.d;r.dow=r.dow||[];if(r.dow.includes(d))r.dow=r.dow.filter(x=>x!==d);else r.dow.push(d);b.classList.toggle('on')}));
    body.querySelectorAll('#rG .opt').forEach(b=>onTap(b,()=>{r.goalId=b.dataset.g||null;body.querySelectorAll('#rG .opt').forEach(x=>x.classList.toggle('on',x===b))}));
    body.querySelector('#rSave').onclick=()=>{r.title=body.querySelector('#rT').value.trim();if(!r.title){toast('内容を入れて');return}
      r.steps=body.querySelector('#rS').value.split('\n').map(s=>s.trim()).filter(Boolean);r.u=Date.now();

    const del=body.querySelector('#rDel');if(del)del.onclick=()=>{S.del[r.id]=Date.now();S.routines=S.routines.filter(x=>x.id!==r.id);closeSheet();save()};
  });
}

      S.tasks.push(t);closeSheet();save();toast('今日のタスクにした');openTaskSheet(t.id)}));

/* ============================================================ 顧客（CRM） */
const crmLast=c=>c.log.length?Math.max(...c.log.map(l=>l.t)):(c.u||0);
const crmStale=c=>Math.floor((Date.now()-crmLast(c))/864e5);
function renderCRM(el,act){
  const list=S.crm.filter(c=>crmFilter==='all'||c.stage===crmFilter).sort((a,b)=>crmStale(b)-crmStale(a));
  el.innerHTML=`<div class="chips" style="padding-bottom:12px"><button class="chip${crmFilter==='all'?' on':''}" data-s="all">すべて<small>${S.crm.length}</small></button>${STAGES.map(s=>{const n=S.crm.filter(c=>c.stage===s).length;return n?`<button class="chip${crmFilter===s?' on':''}" data-s="${s}">${s}<small>${n}</small></button>`:''}).join('')}</div>`
  +card(list.length?list.map(c=>{const st=crmStale(c),stop=st>=4&&!['成約','失注'].includes(c.stage);
    return `<div class="li" data-id="${c.id}"><div class="t"><b>${esc(c.name)}${c.person?' <small style="display:inline">'+esc(c.person)+'</small>':''}</b><small><span class="pill${c.stage==='成約'?' on':''}${c.stage==='失注'?' red':''}">${esc(c.stage)}</span>　${c.next?'次：'+esc(c.next)+(c.nextDate?'（'+c.nextDate.slice(5).replace('-','/')+'）':''):'次の一手なし'}</small></div><div class="r${stop?' bad':''}">${stop?st+'日止まり':(c.log.length?ago(crmLast(c)):'')}</div></div>`}).join('')
    :'<div class="hint">相手ごとに「いまどの段階か」「次に何をするか」「何を話したか」を残す。4日動きが無いと赤くなる。AIに「どこにアプローチすべき？」と聞ける。</div>');
  el.querySelectorAll('.chip').forEach(b=>onTap(b,()=>{crmFilter=b.dataset.s;renderMore()}));
  el.querySelectorAll('.li').forEach(x=>onTap(x,()=>openCRMSheet(x.dataset.id)));
  act.innerHTML=`<button class="add" id="crmAI" style="background:var(--fill);color:var(--ink);margin-right:6px">AI</button><button class="add" id="crmAdd">＋</button>`;
  act.querySelector('#crmAdd').onclick=()=>openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">顧客を追加</div><input class="field" id="cN" placeholder="会社・相手の名前" style="margin-top:10px"><input class="field" id="cP" placeholder="担当者（任意）"><div class="sh-actions"><button class="btn primary" id="cAdd">追加</button></div>`;
    body.querySelector('#cAdd').onclick=()=>{const n=body.querySelector('#cN').value.trim();if(!n)return;
      S.crm.push({id:uid('cr_'),name:n,person:body.querySelector('#cP').value.trim(),stage:STAGES[0],owner:ME(),next:'',nextDate:null,log:[{t:Date.now(),who:ME(),text:'リスト入り'}],u:Date.now()});closeSheet();save()};
  });
  act.querySelector('#crmAI').onclick=()=>openAISheet('顧客',[ctxHeader(),'## 顧客一覧\n'+S.crm.map(c=>`- ${c.name}${c.person?'（'+c.person+'）':''}／${c.stage}／次：${c.next||'なし'}${c.nextDate?' '+c.nextDate:''}／最後の動き ${crmStale(c)}日前／担当 ${memName(c.owner)||'未定'}\n  ${c.log.slice(-3).map(l=>`[${fmtT(l.t)}] ${l.text}`).join(' ／ ')}`).join('\n'),rulesBlock(),'## 依頼\nどの相手に今日アプローチすべきか決めて、理由と一言目を書いて。4日以上止まっている相手にはリマインドのタスクを tasks に入れて（担当者つき）。カレンダーやメールが読めるなら、やり取りを crm[].log に足して。'].join('\n\n'));
}
function openCRMSheet(id){const c=S.crm.find(x=>x.id===id);if(!c)return;
  openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">顧客</div><div class="sh-title" id="cTitle" contenteditable="true">${esc(c.name)}</div><div class="sh-date">${esc(c.person||'')}${c.owner?'　担当 '+esc(memName(c.owner)):''}</div>
      <div class="sh-sec">段階</div><div class="opts" id="cS">${STAGES.map(s=>`<button class="opt${c.stage===s?' on':''}" data-s="${s}">${s}</button>`).join('')}</div>
      <div class="sh-sec">次の一手</div><div class="frow"><input class="field" id="cNext" placeholder="次に何をするか" value="${esc(c.next||'')}"><label class="opt"><input type="date" id="cND" value="${c.nextDate||''}"></label></div>
      <div class="sh-sec">担当</div><div class="opts" id="cO">${S.members.map(m=>`<button class="opt${c.owner===m.id?' on':''}" data-u="${m.id}">${esc(m.name)}</button>`).join('')}</div>
      <div class="sh-sec">やり取り</div><div class="tl">${c.log.slice().reverse().map(l=>`<div class="${l.who==='ai'?'ai':''}"><small>${fmtT(l.t)} · ${esc(memName(l.who)||l.who)}${l.src?' · '+esc(l.src):''}</small>${esc(l.text)}</div>`).join('')||'<div class="pl-empty">なし</div>'}</div>
      <div class="frow"><input class="field" id="cL" placeholder="何を話したか"><button class="ib" id="cLMic"></button><button class="ib" id="cLAdd">＋</button></div>
      <div class="sh-actions col"><button class="btn primary" id="cAI">AIに依頼する</button><div style="display:flex;gap:8px"><button class="btn plain" id="cTask">タスクにする</button><button class="btn dangerous" id="cDel">削除</button></div></div>`;
    const touch=()=>{c.u=Date.now();saveQuiet()};
    const ti=body.querySelector('#cTitle');ti.onblur=()=>{const v=ti.textContent.trim();if(v&&v!==c.name){c.name=v;touch();renderMore()}};
    body.querySelectorAll('#cS .opt').forEach(b=>onTap(b,()=>{if(c.stage===b.dataset.s)return;c.stage=b.dataset.s;c.log.push({t:Date.now(),who:ME(),text:'段階 → '+c.stage});
      notify(`${c.name}が「${c.stage}」に`,{type:'crm',id:c.id});touch();render();openCRMSheet(id)}));
    const nx=body.querySelector('#cNext');nx.onblur=()=>{c.next=nx.value.trim();touch()};
    body.querySelector('#cND').onchange=e=>{c.nextDate=e.target.value||null;touch()};
    body.querySelectorAll('#cO .opt').forEach(b=>onTap(b,()=>{c.owner=b.dataset.u;touch();body.querySelectorAll('#cO .opt').forEach(x=>x.classList.toggle('on',x===b))}));
    const li=body.querySelector('#cL');attachMic(body.querySelector('#cLMic'),li);
    const add=()=>{const v=li.value.trim();if(!v)return;c.log.push({t:Date.now(),who:ME(),text:v});touch();render();openCRMSheet(id)};
    body.querySelector('#cLAdd').onclick=add;li.onkeydown=e=>{if(e.key==='Enter')add()};
    body.querySelector('#cAI').onclick=()=>openAISheet(c.name,[ctxHeader(),`## 顧客：${c.name}${c.person?'（'+c.person+'）':''}\n- 段階：${c.stage}／担当 ${memName(c.owner)||'未定'}\n- 次の一手：${c.next||'なし'}${c.nextDate?'（'+c.nextDate+'）':''}\n- やり取り：\n  ${c.log.slice(-10).map(l=>`[${fmtT(l.t)} ${memName(l.who)||l.who}] ${l.text}`).join('\n  ')}`,ctxBlock(null),rulesBlock(),'## 依頼\nこの相手を次の段階へ進める一手を決めて実行して（連絡文の下書き、日程候補、資料）。やったことは crm[].log に、必要なら tasks に入れて。'].join('\n\n'));
    body.querySelector('#cTask').onclick=()=>{const t=newTask({title:`${c.name}：${c.next||'対応'}`,date:c.nextDate||TODAY,assignee:c.owner||ME()});S.tasks.push(t);closeSheet();save();openTaskSheet(t.id)};
    body.querySelector('#cDel').onclick=()=>{S.del[c.id]=Date.now();S.crm=S.crm.filter(x=>x.id!==c.id);closeSheet();save()};
  });
}

/* ============================================================ 数値（アナリティクス・KPIツリー） */
const latestV=m=>m.series.length?m.series[m.series.length-1].v:null;
const prevV=m=>m.series.length>1?m.series[m.series.length-2].v:null;
const fmtV=v=>v===null||v===undefined?'—':(Math.abs(v)>=1e4?Math.round(v).toLocaleString('ja-JP'):+v.toFixed(2)+'');
function spark(vals,w=64,h=22){if(vals.length<2)return`<svg width="${w}" height="${h}"></svg>`;const mn=Math.min(...vals),mx=Math.max(...vals);
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-2-(mx===mn?h/2-2:(v-mn)/(mx-mn)*(h-4))).toFixed(1)}`).join(' ');
  return`<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}"><polyline points="${pts}" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/></svg>`}
function lineChart(series,target){
  const W=320,H=150,px=8,py=16;if(!series.length)return'<div class="hint">まだ数値が無い</div>';
  const vals=series.map(s=>s.v);let mn=Math.min(...vals,target??Infinity),mx=Math.max(...vals,target??-Infinity);if(mn===mx){mn-=1;mx+=1}
  const X=i=>px+(series.length===1?W/2-px:i/(series.length-1)*(W-2*px)),Y=v=>H-py-(v-mn)/(mx-mn)*(H-2*py);
  const d=series.map((s,i)=>`${i?'L':'M'}${X(i).toFixed(1)},${Y(s.v).toFixed(1)}`).join('');
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none"><path d="${d}" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/>
    ${target!=null?`<line x1="${px}" x2="${W-px}" y1="${Y(target)}" y2="${Y(target)}" stroke="var(--red)" stroke-dasharray="3 4" stroke-width="1"/>`:''}
    ${series.map((s,i)=>`<circle cx="${X(i)}" cy="${Y(s.v)}" r="2.5" fill="#fff" stroke="currentColor" stroke-width="1.5"/>`).join('')}
    <text x="${px}" y="${H-2}" font-size="9" fill="rgba(60,60,67,.5)">${series[0].d.slice(5)}</text><text x="${W-px}" y="${H-2}" font-size="9" text-anchor="end" fill="rgba(60,60,67,.5)">${series[series.length-1].d.slice(5)}</text>
    <text x="${px}" y="10" font-size="9" fill="rgba(60,60,67,.5)">${fmtV(mx)}</text></svg>`}
function renderMetrics(el,act){
  const pinned=S.metrics.filter(m=>m.pin);
  let h='';
  if(pinned.length)h+=`<div class="dash">${pinned.map(m=>{const v=latestV(m),p=prevV(m);return`<div class="card" data-id="${m.id}"><small>${esc(m.name)}</small><b class="big">${fmtV(v)}<span style="font-size:13px;font-weight:400;color:var(--gray)"> ${esc(m.unit||'')}</span></b>${spark(m.series.map(s=>s.v),120,26)}${p!==null&&v!==null?`<small class="${v>=p?'':''}" style="color:${v>=p?'#34c759':'var(--red)'}">${v>=p?'▲':'▼'} ${fmtV(Math.abs(v-p))}</small>`:''}</div>`}).join('')}</div>`;
  const roots=S.metrics.filter(m=>!m.parentId||!S.metrics.some(x=>x.id===m.parentId));
  const row=(m,d)=>{const v=latestV(m),p=prevV(m);
    return`<div class="kpi" data-id="${m.id}" style="padding-left:${2+d*18}px"><div class="t"><b>${d?'└ ':''}${esc(m.name)}</b><small>${m.owner?esc(memName(m.owner))+' · ':''}${m.src==='pending'?'<span class="pill red">接続待ち</span>':m.src==='connected'?'<span class="pill">接続済み</span>':'手入力'}${m.goalId&&goalOf(m.goalId)?' · '+esc(goalOf(m.goalId).title):''}</small></div>${spark(m.series.map(s=>s.v))}<div class="v"><b>${fmtV(v)}<span style="font-size:11px;font-weight:400;color:var(--gray)"> ${esc(m.unit||'')}</span></b>${p!==null&&v!==null?`<small class="${v>=p?'up':'dn'}">${v>=p?'▲':'▼'}${fmtV(Math.abs(v-p))}</small>`:(m.target!=null?`<small>目標 ${fmtV(m.target)}</small>`:'')}</div></div>`
    +S.metrics.filter(x=>x.parentId===m.id).map(x=>row(x,d+1)).join('')};
  h+=card(`<div class="sec-h">KPIツリー<span>誰がどの数字を追うか</span></div>`+(roots.length?roots.map(m=>row(m,0)).join(''):'<div class="hint">売上から逆算した数値を置く。親子で結ぶとツリーになる。「接続待ち」にしておくと、AIが取りに行く。</div>'));
  el.innerHTML=h;
  el.querySelectorAll('[data-id]').forEach(x=>onTap(x,()=>openMetricSheet(x.dataset.id)));
  act.innerHTML=`<button class="add" id="mtAI" style="background:var(--fill);color:var(--ink);margin-right:6px">AI</button><button class="add" id="mtAdd">＋</button>`;

  act.querySelector('#mtAI').onclick=()=>openAISheet('数値',[ctxHeader(),'## 数値一覧\n'+(S.metrics.map(m=>`- ${m.name}（${m.unit||''}／id ${m.id}／親 ${m.parentId||'なし'}／${m.src}／担当 ${memName(m.owner)||'未定'}）最新 ${fmtV(latestV(m))}${m.target!=null?' 目標 '+fmtV(m.target):''}${m.note?' メモ:'+m.note:''}`).join('\n')||'なし'),'## ゴール\n'+sortedGoals().map(g=>`- ${g.title}（id ${g.id}）`).join('\n'),rulesBlock(),'## 依頼\n（1）数値が無ければ、ゴールから逆算した KPIツリーを metrics に作って（親子は parentId、担当は owner）。（2）src が pending のものは、何を指す数字か確かめ、取得元と接続方法を調べて実際に取ってきて series に {"d":"YYYY-MM-DD","v":数値} を入れ、src を connected に。（3）伸ばすためのゴール／タスクを提案して tasks に入れて。'].join('\n\n'));
}

      if(!id)S.metrics.push(m);closeSheet();save();if(!id)openMetricSheet(m.id)};

    body.querySelector('#kDel').onclick=()=>{S.del[m.id]=Date.now();S.metrics=S.metrics.filter(x=>x.id!==m.id);closeSheet();save()};
  });

/* ============================================================ マインドマップ */
function mmWalk(n,fn,p){fn(n,p);(n.c||[]).forEach(c=>mmWalk(c,fn,n))}
function renderMindmaps(el,act){
  el.innerHTML=card(S.mindmaps.length?S.mindmaps.map(m=>{let n=0;mmWalk(m.root,()=>n++);return`<div class="li" data-id="${m.id}"><div class="ic" style="width:30px;height:30px;border-radius:9px;background:var(--fill);display:grid;place-items:center;color:var(--ink2);flex:none">${ICON.map}</div><div class="t"><b>${esc(m.title)}</b><small>${n}ノード · ${fmtT(m.u)}</small></div>${CH2}</div>`}).join(''):'<div class="hint">考えを広げる場所。ノードをタップして足す。中身はAIも読めるので、「これを広げて」と頼める。</div>');
  el.querySelectorAll('.li').forEach(x=>onTap(x,()=>openMindmap(x.dataset.id)));
  addBtn(act,'＋ マップ',()=>openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">マインドマップ</div><input class="field" id="mmT" placeholder="真ん中に置く言葉" style="margin-top:10px"><div class="sh-actions"><button class="btn primary" id="mmAdd">作る</button></div>`;
    body.querySelector('#mmAdd').onclick=()=>{const t=body.querySelector('#mmT').value.trim();if(!t)return;const m={id:uid('mm_'),title:t,root:{id:uid('n_'),t,c:[]},u:Date.now()};S.mindmaps.push(m);closeSheet();save();openMindmap(m.id)};
  }));
}
const tw=s=>[...String(s)].reduce((a,c)=>a+(c.charCodeAt(0)>255?13:7.5),0)+22;
function mmSVG(root){
  const nodes=[],links=[];let y=0,maxD=0;const colW=180,rowH=36;
  const walk=(n,d,parent)=>{const node={n,d,parent,x:d*colW,w:Math.max(56,tw(n.t))};nodes.push(node);maxD=Math.max(maxD,d);
    if(n.c&&n.c.length){const ys=n.c.map(c=>walk(c,d+1,node));node.y=(ys[0]+ys[ys.length-1])/2}else{node.y=y;y+=rowH}
    if(parent)links.push([parent,node]);return node.y};
  walk(root,0,null);
  const W=Math.max(...nodes.map(n=>n.x+n.w))+10,H=Math.max(y,rowH)+4;
  return`<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}">${links.map(([a,b])=>`<path d="M${a.x+a.w},${a.y+14}C${a.x+a.w+40},${a.y+14} ${b.x-40},${b.y+14} ${b.x},${b.y+14}"/>`).join('')}
    ${nodes.map(n=>`<g class="nd${n.d?'':' root'}" data-nid="${n.n.id}"><rect x="${n.x}" y="${n.y+1}" width="${n.w}" height="26" rx="13"/><text x="${n.x+n.w/2}" y="${n.y+18}" text-anchor="middle">${esc(n.n.t)}</text></g>`).join('')}</svg>`;
}
function openMindmap(id){const m=S.mindmaps.find(x=>x.id===id);if(!m)return;
  openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">マインドマップ</div><div class="sh-title">${esc(m.title)}</div><div class="hint" style="padding:4px 0 0">ノードをタップ → 足す・直す・消す</div><div class="mm">${mmSVG(m.root)}</div>
      <div class="sh-actions col"><button class="btn primary" id="mmAI">AIに広げてもらう</button><div style="display:flex;gap:8px"><button class="btn plain" id="mmCopy">テキストでコピー</button><button class="btn dangerous" id="mmDel">削除</button></div></div>`;
    body.querySelectorAll('.nd').forEach(g=>g.onclick=()=>openNodeSheet(m,g.dataset.nid));
    const txt=()=>{let o=[];mmWalk(m.root,(n,p)=>{let d=0,q=n;const find=(x,dd)=>{if(x===n){d=dd;return true}return(x.c||[]).some(c=>find(c,dd+1))};find(m.root,0);o.push('  '.repeat(d)+'- '+n.t)});return o.join('\n')};
    body.querySelector('#mmCopy').onclick=async()=>{if(await copyText(txt()))toast('コピーした')};
    body.querySelector('#mmAI').onclick=()=>openAISheet(m.title,[ctxHeader(),'## マインドマップ（id '+m.id+'）\n'+txt(),ctxBlock(null),rulesBlock(),'## 依頼\nこのマップを広げて。各枝に具体案を2〜3個ずつ足し、mindmaps[].root の c に {"id":"n_…","t":"…","c":[]} で入れて。実行できるものは tasks にも。'].join('\n\n'));
    body.querySelector('#mmDel').onclick=()=>{S.del[m.id]=Date.now();S.mindmaps=S.mindmaps.filter(x=>x.id!==m.id);closeSheet();save()};
  });
}
function openNodeSheet(m,nid){let node=null,parent=null;mmWalk(m.root,(n,p)=>{if(n.id===nid){node=n;parent=p}});if(!node)return;
  openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">${parent?esc(parent.t)+' › ':''}ノード</div><input class="field" id="nT" value="${esc(node.t)}" style="margin-top:10px"><div class="frow"><input class="field" id="nC" placeholder="子を足す"><button class="ib" id="nCMic"></button><button class="ib pri" id="nCAdd">＋</button></div>
      <div class="sh-actions"><button class="btn primary" id="nSave">保存</button>${parent?'<button class="btn dangerous" id="nDel">消す</button>':''}<button class="btn plain" id="nBack">マップへ</button></div>`;
    const ci=body.querySelector('#nC');attachMic(body.querySelector('#nCMic'),ci);
    const addC=()=>{const v=ci.value.trim();if(!v)return;node.c.push({id:uid('n_'),t:v,c:[]});m.u=Date.now();saveQuiet();ci.value='';toast('足した')};
    body.querySelector('#nCAdd').onclick=addC;ci.onkeydown=e=>{if(e.key==='Enter')addC()};
    body.querySelector('#nSave').onclick=()=>{node.t=body.querySelector('#nT').value.trim()||node.t;m.u=Date.now();save();openMindmap(m.id)};
    body.querySelector('#nBack').onclick=()=>openMindmap(m.id);
    const del=body.querySelector('#nDel');if(del)del.onclick=()=>{parent.c=parent.c.filter(x=>x.id!==nid);m.u=Date.now();save();openMindmap(m.id)};
  });
}

/* ============================================================ IndexedDB（録画・ローカルファイル） */
const idb={
  open(){return new Promise((res,rej)=>{const r=indexedDB.open('purpose-media',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').put(v,k);t.oncomplete=res;t.onerror=()=>rej(t.error)})},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const r=d.transaction('m').objectStore('m').get(k);r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
  async del(k){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction('m','readwrite');t.objectStore('m').delete(k);t.oncomplete=res;t.onerror=()=>rej(t.error)})}
};
function pickFile(accept){return new Promise(res=>{const i=document.getElementById('fileIn');i.accept=accept||'';i.value='';i.onchange=()=>res(i.files[0]||null);i.click()})}

  r.onend=()=>{if(live)try{r.start()}catch(e){}};r.onerror=()=>{};

async function startScreenRec(o){

  const W=vs.videoWidth||1280,H=vs.videoHeight||720,cv=document.createElement('canvas');cv.width=W;cv.height=H;const ctx=cv.getContext('2d');
  drawC.width=innerWidth*devicePixelRatio;drawC.height=innerHeight*devicePixelRatio;drawC.getContext('2d').clearRect(0,0,drawC.width,drawC.height);
  const ac=new(window.AudioContext||window.webkitAudioContext)(),dest=ac.createMediaStreamDestination();
  if(scr.getAudioTracks().length)ac.createMediaStreamSource(new MediaStream(scr.getAudioTracks())).connect(dest);

  const loop=()=>{if(!REC)return;ctx.drawImage(vs,0,0,W,H);
    if(REC.cam&&camV.readyState>=2){const r=Math.min(W,H)*.14,x=W-r-24,y=H-r-24;ctx.save();ctx.beginPath();ctx.arc(x+r/2,y+r/2,r/2,0,Math.PI*2);ctx.clip();ctx.translate(x+r,y);ctx.scale(-1,1);ctx.drawImage(camV,0,0,r,r);ctx.restore();
      ctx.beginPath();ctx.arc(x+r/2,y+r/2,r/2,0,Math.PI*2);ctx.lineWidth=4;ctx.strokeStyle='#fff';ctx.stroke()}

    else med.innerHTML='<div class="hint">この端末に動画が無い（別の端末で録った）。</div>';
    body.querySelectorAll('#rcS .opt').forEach(b=>onTap(b,()=>{r.scope=b.dataset.s;r.u=Date.now();saveQuiet();body.querySelectorAll('#rcS .opt').forEach(x=>x.classList.toggle('on',x===b))}));
    const up=body.querySelector('#rcUp');if(up)up.onclick=async()=>{if(!tok()){toast('設定でトークンを保存してから');return}if(!blob){toast('この端末に動画が無い');return}toast('上げている…（大きいと時間がかかる）');
      try{const ext=(r.mime||'').includes('mp4')?'mp4':(r.kind==='minutes'?'weba':'webm');r.url=await ghUpload(`media/${r.id}.${ext}`,blob,'録画: '+r.title);r.local=false;if(r.scope==='private')r.scope='org';r.u=Date.now();save();openRecSheet(id);toast('リンクができた')}catch(e){toast(e.message==='big'?'95MBを超えている':'上げられない')}};
    const cp=body.querySelector('#rcCopy');if(cp)cp.onclick=async()=>{if(await copyText(r.url))toast('コピーした')};
    body.querySelector('#rcAI').onclick=()=>openAISheet(r.title,[ctxHeader(),`## ${r.kind==='minutes'?'議事録':'録画'}：${r.title}（${fmtT(r.t)}／${mmss(r.dur||0)}／id ${r.id}）${r.url?'\n'+r.url:''}\n### 文字起こし\n${r.transcript||'（なし）'}`,goalBlock(goalOf(r.goalId)),rulesBlock(),'## 依頼\n決まったこと・やること（担当と期日）・未決・フィードバックを整理して、やることは tasks に入れて。要約は recordings[].summary に書いて。'].join('\n\n'));
    body.querySelector('#rcDel').onclick=()=>{S.del[r.id]=Date.now();S.recordings=S.recordings.filter(x=>x.id!==r.id);idb.del(r.id).catch(()=>{});closeSheet();save()};
  });
}

/* ============================================================ 受信箱（LINE・メール貼り付け） */
function renderInbox(el,act){
  const list=S.inbox.slice().sort((a,b)=>(a.handled-b.handled)||(b.t-a.t));
  el.innerHTML=card(`<div class="sec-h">貼る</div><div class="opts" id="ibS">${['LINE','メール','Slack','その他'].map((s,i)=>`<button class="opt${i?'':' on'}" data-s="${s}">${s}</button>`).join('')}</div>
    <textarea class="field" id="ibT" placeholder="LINEやメールの文をそのまま貼る。AIがこれを読んで動く。"></textarea><div class="frow"><button class="ib" id="ibMic"></button><div style="flex:1"></div><button class="btn primary" id="ibAdd" style="flex:none;padding:10px 22px">受信箱へ</button></div>`)
  +card(list.length?list.map(i=>`<div class="li" data-id="${i.id}" style="${i.handled?'opacity:.5':''}"><div class="t"><b>${esc(i.text.split('\n')[0].slice(0,50))}</b><small><span class="pill">${esc(i.src)}</span> ${fmtT(i.t)}${i.handled?' · 済':''}</small></div>${CH2}</div>`).join(''):'<div class="hint">まだ無い</div>');
  let src='LINE';
  el.querySelectorAll('#ibS .opt').forEach(b=>onTap(b,()=>{src=b.dataset.s;el.querySelectorAll('#ibS .opt').forEach(x=>x.classList.toggle('on',x===b))}));
  const ta=el.querySelector('#ibT');attachMic(el.querySelector('#ibMic'),ta);
  el.querySelector('#ibAdd').onclick=()=>{const v=ta.value.trim();if(!v)return;const it={id:uid('ib_'),t:Date.now(),src,text:v,handled:false,u:Date.now()};S.inbox.push(it);notify(`${src}を受信箱に入れた`,{type:'inbox',id:it.id});ta.value='';save();toast('入れた')};
  el.querySelectorAll('.li').forEach(x=>onTap(x,()=>openInboxSheet(x.dataset.id)));
  addBtn(act,'AIに対応させる',()=>{const un=S.inbox.filter(i=>!i.handled);if(!un.length){toast('未対応は無い');return}
    openAISheet('受信箱',[ctxHeader(),'## 受信箱（未対応）\n'+un.map(i=>`### [${i.src}] ${fmtT(i.t)}（id ${i.id}）\n${i.text}`).join('\n\n'),ctxBlock(null),rulesBlock(),'## 依頼\nそれぞれ何をすべきか判断して対応して（返信の下書き、日程、タスク化）。返信文は chat に who:"ai" で置き、対応したら inbox[].handled を true に。人に確認が要るものだけ私に聞いて。'].join('\n\n'))});
}
function openInboxSheet(id){const i=S.inbox.find(x=>x.id===id);if(!i)return;
  openSheet(body=>{
    body.innerHTML=`<div class="sh-kicker">${esc(i.src)} · ${fmtT(i.t)}</div><div class="sh-note" style="margin-top:10px">${esc(i.text)}</div>
      <div class="sh-actions col"><button class="btn primary" id="ibAI">AIに対応させる</button><div style="display:flex;gap:8px"><button class="btn plain" id="ibTask">タスクにする</button><button class="btn plain" id="ibDone">${i.handled?'未対応に戻す':'済みにする'}</button></div><button class="btn dangerous" id="ibDel">削除</button></div>`;
    body.querySelector('#ibAI').onclick=()=>openAISheet(i.src,[ctxHeader(),`## ${i.src}（id ${i.id}）\n${i.text}`,ctxBlock(null),rulesBlock(),'## 依頼\nこの内容に対応して（返信の下書き、日程調整、必要なタスク化）。返信文は chat に who:"ai" で置き、終わったら inbox[].handled を true に。'].join('\n\n'));
    body.querySelector('#ibTask').onclick=()=>openQuickAdd({title:i.text.split('\n')[0].slice(0,60)});
    body.querySelector('#ibDone').onclick=()=>{i.handled=!i.handled;i.u=Date.now();closeSheet();save()};
    body.querySelector('#ibDel').onclick=()=>{S.del[i.id]=Date.now();S.inbox=S.inbox.filter(x=>x.id!==i.id);closeSheet();save()};
  });
}

/* ============================================================ 設定 */
function renderSettings(el){
  const n=document.getElementById('setNode');n.style.display='block';el.appendChild(n);
  document.getElementById('repoInput').value=localStorage.getItem('purpose.repo')||'';
  const mo=document.getElementById('meOpts');mo.innerHTML=S.members.map(m=>`<button class="opt${ME()===m.id?' on':''}" data-u="${m.id}">${esc(m.name)}</button>`).join('');
  mo.querySelectorAll('.opt').forEach(b=>onTap(b,()=>{localStorage.setItem('purpose.me',b.dataset.u);render();toast(memName(b.dataset.u)+'として使う')}));
  document.getElementById('repoInput').onblur=e=>{const v=e.target.value.trim();if(v)localStorage.setItem('purpose.repo',v)};
}

/* ============================================================ boot */
render();
pull().then(ok=>{if(tok())setStat(ok?'同期済み（読み書き）':'リモート未作成');expireTransfers()}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&Date.now()-lastPull>60000)pull().catch(()=>{});
});
setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-lastPull>90000)pull().catch(()=>{})},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.addEventListener('beforeunload',e=>{if(REC){e.preventDefault();e.returnValue=''}});

/* テスト用（Browserペインの合成タップ） */
window.__tap=sel=>{const el=document.querySelector(sel);if(!el)return'no:'+sel;
  const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  ['pointerdown','pointerup'].forEach(t=>el.dispatchEvent(new PointerEvent(t,{bubbles:true,clientX:x,clientY:y,pointerId:1})));
  el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:x,clientY:y}));return'ok'};
</script>
</body>
