<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Purpose">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Purpose</title>
<style>
  :root{
    --bg:#ffffff; --ink:#000000; --gray:#8e8e93; --gray2:#c7c7cc;
    --sep:rgba(60,60,67,.18); --fill:#f2f2f7; --press:rgba(120,120,128,.12); --red:#eb4d3d;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif;
    --ease-out:cubic-bezier(.22,.9,.28,1);
    --spring:cubic-bezier(.32,1.5,.45,1);
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"palt";user-select:none;-webkit-user-select:none}
  input,textarea{user-select:text;-webkit-user-select:text}
  button,.gb-head,.cal-d,.mini-t,.tdot,.sub,.gb-open{touch-action:manipulation}

  #app{position:relative;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
  main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 130px;-webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain}
  main::-webkit-scrollbar{display:none}
  .screen{display:none}
  .screen.active{display:block;animation:in .34s var(--ease-out) both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

  .caption{font-size:13px;color:var(--gray);font-weight:400;letter-spacing:.01em}
  .large-title{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2;margin:2px 0 4px}
  .navrow{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:20px}
  .navbtn{border:none;background:none;font-family:inherit;font-size:26px;color:var(--ink);cursor:pointer;padding:2px 2px 2px 18px;font-weight:300;transition:opacity .3s}
  .navbtn:active{opacity:.35;transition:opacity .05s}
  .empty{color:var(--gray);font-size:15px;padding:28px 0;text-align:center;line-height:2}
  .sec-sub{font-size:13px;color:var(--gray);margin:18px 0 2px;font-weight:400}

  /* ============ goal block ============ */
  .gb{position:relative;padding:4px 0}
  .gb+.gb{border-top:.5px solid var(--sep)}
  .gb-head{padding:16px 12px 4px;margin:0 -12px;border-radius:16px;cursor:pointer;transition:background .45s var(--ease-out)}
  .gb-head:active{background:var(--press);transition:background .06s}
  .gb-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin-bottom:16px}
  .gb-title{font-size:17px;font-weight:600;line-height:1.4;word-break:break-word}
  .gb-d{flex:none;font-size:13px;color:var(--gray);font-variant-numeric:tabular-nums;white-space:nowrap}
  .gb-d b{font-size:15px;font-weight:600;color:var(--ink)}
  .gb-d.over,.gb-d.over b{color:var(--red)}
  .gb-route{position:relative;height:26px;margin:0 4px}
  .gb-track{position:absolute;left:0;right:0;top:12px;height:2px;background:var(--fill);border-radius:2px}
  .gb-fill{position:absolute;left:0;top:12px;height:2px;background:var(--ink);border-radius:2px;transition:width .8s var(--ease-out)}
  .mile-dot{position:absolute;top:0;width:26px;height:26px;transform:translateX(-50%);display:grid;place-items:center}
  .mile-dot i{width:12px;height:12px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gray2);transition:.3s var(--spring)}
  .mile-dot.done i{background:var(--ink);border-color:var(--ink)}
  .mile-dot.next i{border-color:var(--ink);border-width:2px;width:14px;height:14px}
  .gb-next{font-size:13px;color:var(--gray);margin-top:10px;padding:0 4px 12px;display:flex;justify-content:space-between;gap:10px}
  .gb-next em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .gb-next span{flex:none;font-variant-numeric:tabular-nums}
  .gb-empty{font-size:13px;color:var(--gray2);margin-top:10px;padding:0 4px 12px}
  /* --- expansion (matryoshka layer 2+3) --- */
  .gb-exp{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease-out)}
  .gb.open .gb-exp{grid-template-rows:1fr}
  .gb-exp>div{min-height:0;overflow:hidden}
  .gb-exp .inner{padding:2px 4px 14px}
  .sub{padding:10px 0 2px;cursor:pointer}
  .sub-head{display:flex;align-items:center;gap:10px}
  .sub-head .sdot{flex:none;width:9px;height:9px;border-radius:50%;border:1.5px solid var(--gray2);background:var(--bg)}
  .sub-head.done .sdot{background:var(--ink);border-color:var(--ink)}
  .sub-head span{font-size:14.5px;font-weight:500;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sub-head.done span{color:var(--gray)}
  .sub-head small{margin-left:auto;flex:none;font-size:12px;color:var(--gray);font-variant-numeric:tabular-nums}
  .sub-route{position:relative;height:22px;margin:2px 0 0 19px}
  .sub-track{position:absolute;left:0;right:0;top:10px;height:1.5px;background:var(--fill);border-radius:2px}
  .sub-fill{position:absolute;left:0;top:10px;height:1.5px;background:var(--ink);border-radius:2px;transition:width .6s var(--ease-out)}
  .tdot{position:absolute;top:0;width:22px;height:22px;transform:translateX(-50%);display:grid;place-items:center;cursor:pointer}
  .tdot i{width:8px;height:8px;border-radius:50%;background:var(--bg);border:1.5px solid var(--gray2);transition:.3s var(--spring)}
  .tdot.done i{background:var(--ink);border-color:var(--ink)}
  .tdot:active i{transform:scale(1.6)}
  .sub-none{font-size:12px;color:var(--gray2);margin:2px 0 4px 19px}
  .gb-open{display:block;border:none;background:none;font-family:inherit;font-size:13px;color:var(--gray);cursor:pointer;padding:10px 0 4px;transition:opacity .3s}
  .gb-open:active{opacity:.4;transition:opacity .05s}

  /* ============ task rows (swipe) ============ */
  .t-row{position:relative;overflow:hidden;margin:0 -20px;touch-action:pan-y}
  .t-row::after{content:"";position:absolute;left:20px;right:20px;bottom:0;height:.5px;background:var(--sep)}
  .t-del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--red);color:#fff;font-size:15px;font-weight:600;font-family:inherit;border:none;display:grid;place-items:center;cursor:pointer}
  .t-slide{position:relative;display:flex;align-items:center;gap:14px;padding:13px 20px;background:var(--bg);will-change:transform;transition:background .45s var(--ease-out)}
  .t-row.pressed .t-slide{background:#ebebf0;transition:background .06s}
  .t-check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gray2);display:grid;place-items:center;transition:background .35s var(--ease-out),border-color .35s var(--ease-out)}
  .t-check svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.3s var(--spring)}
  .t-row.done .t-check{background:var(--ink);border-color:var(--ink)}
  .t-row.done .t-check svg{opacity:1;transform:scale(1)}
  .t-main{flex:1;min-width:0}
  .t-name{font-size:16px;font-weight:400;line-height:1.4;word-break:break-word;position:relative;display:inline-block;transition:color .45s var(--ease-out)}
  .t-name::after{content:"";position:absolute;left:0;top:56%;height:1.5px;width:100%;background:var(--gray);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease-out)}
  .t-row.done .t-name{color:var(--gray)}
  .t-row.done .t-name::after{transform:scaleX(1)}
  .t-sub{font-size:12.5px;color:var(--gray);margin-top:2px;transition:opacity .45s}
  .t-row.done .t-sub{opacity:.55}
  .t-date{flex:none;font-size:12px;color:var(--gray);font-variant-numeric:tabular-nums}
  .t-date.over{color:var(--red)}

  /* ============ calendar ============ */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
  .cal-title{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{width:38px;height:38px;border:none;background:none;color:var(--ink);cursor:pointer;font-size:20px;border-radius:50%;transition:background .4s}
  .cal-nav button:active{background:var(--press);transition:background .05s}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
  .cal-wd{font-size:12px;color:var(--gray);font-weight:500;padding:6px 0 10px}
  .cal-d{position:relative;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;cursor:pointer}
  .cal-d span{width:34px;height:34px;display:grid;place-items:center;font-size:19px;font-weight:300;border-radius:50%;font-variant-numeric:tabular-nums;transition:background .35s var(--ease-out),color .35s var(--ease-out)}
  .cal-d:active span{background:var(--press);transition:background .05s}
  .cal-d.dim span{color:var(--gray2)}
  .cal-d.today span{font-weight:600}
  .cal-d.sel span{background:var(--ink);color:#fff;font-weight:500}
  .cal-d .dot{width:4.5px;height:4.5px;border-radius:50%;background:var(--gray2);margin-top:1px}
  .cal-d .dot.on{background:var(--ink)}
  .cal-d .flag{position:absolute;top:2px;right:6px;width:5px;height:5px;border-radius:50%;background:var(--red)}
  .cal-detail{margin-top:18px;border-top:.5px solid var(--sep)}
  .cal-dl{padding:13px 0;border-bottom:.5px solid var(--sep);display:flex;align-items:center;gap:12px}
  .cal-dl .f{flex:none;width:6px;height:6px;border-radius:50%;background:var(--red)}
  .cal-dl span{font-size:15px}
  .cal-dl small{color:var(--gray);font-size:13px;margin-left:auto;flex:none}

  /* ============ sheet ============ */
  #dim{position:fixed;inset:0;background:rgba(0,0,0,.22);z-index:11;opacity:0;pointer-events:none;transition:opacity .3s var(--ease-out)}
  #dim.show{opacity:1;pointer-events:auto}
  #sheet{position:fixed;left:0;right:0;bottom:0;max-width:520px;margin:0 auto;z-index:12;background:var(--bg);
    border-radius:24px 24px 0 0;transform:translateY(105%);will-change:transform;
    box-shadow:0 -8px 44px rgba(0,0,0,.16);display:none}
  .sh-grab{padding:9px 0 5px;touch-action:none;cursor:grab}
  .sh-handle{width:40px;height:5px;border-radius:3px;background:var(--gray2);margin:0 auto}
  #sheetBody{max-height:76dvh;overflow-y:auto;padding:10px 24px calc(env(safe-area-inset-bottom) + 26px);-webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
  #sheetBody::-webkit-scrollbar{display:none}
  #sheetBody .t-row{margin:0 -24px}
  #sheetBody .t-slide{padding:13px 24px}
  #sheetBody .t-row::after{left:24px;right:24px}
  .sh-kicker{font-size:12px;color:var(--gray);letter-spacing:.06em;margin-top:10px}
  .sh-title{font-size:22px;font-weight:600;margin-top:10px;line-height:1.5;word-break:break-word}
  .sh-date{font-size:14px;color:var(--gray);margin-top:3px;font-variant-numeric:tabular-nums}
  .sh-note{font-size:15px;color:var(--gray);line-height:1.85;white-space:pre-wrap;word-break:break-word;margin-top:12px}
  .sh-sec{font-size:13px;color:var(--gray);margin:22px 0 4px}
  .mini-t{display:flex;align-items:center;gap:12px;padding:11px 0;font-size:16px;cursor:pointer;border-bottom:.5px solid var(--sep)}
  .mini-t .c{flex:none;width:20px;height:20px;border-radius:50%;border:1.5px solid var(--gray2);display:grid;place-items:center;transition:background .3s,border-color .3s}
  .mini-t .c svg{opacity:0;transform:scale(.4);transition:.3s var(--spring)}
  .mini-t.done .c{background:var(--ink);border-color:var(--ink)}
  .mini-t.done .c svg{opacity:1;transform:scale(1)}
  .mini-t span{transition:color .4s;min-width:0;overflow:hidden;text-overflow:ellipsis}
  .mini-t.done span{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--gray2)}
  .mini-t i{font-style:normal;font-size:13px;color:var(--gray);margin-left:auto;font-variant-numeric:tabular-nums;flex:none}
  .mini-t small{font-size:11.5px;color:var(--gray);flex:none}
  .addrow{display:flex;gap:8px;margin-top:12px}
  .addrow input{flex:1;border:none;background:var(--fill);border-radius:12px;font-family:inherit;font-size:16px;padding:12px 14px;outline:none;color:var(--ink);min-width:0}
  .addrow button{flex:none;padding:0 18px;border-radius:12px;border:none;background:var(--ink);color:#fff;font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;transition:transform .3s var(--spring),opacity .3s}
  .addrow button:active{transform:scale(.94);opacity:.7;transition:transform .06s,opacity .06s}
  .sh-actions{display:flex;gap:8px;margin-top:24px}
  .btn{flex:1;padding:14px;border-radius:999px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:transform .3s var(--spring),opacity .3s,background .3s,color .3s}
  .btn:active{transform:scale(.96);opacity:.85;transition:transform .06s,opacity .06s}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.plain{background:var(--fill);color:var(--ink)}
  .btn.dangerous{background:var(--fill);color:var(--red)}
  .btn.dangerous.arm{background:var(--red);color:#fff}
  .fform input,.fform textarea{width:100%;border:none;background:var(--fill);border-radius:12px;font-family:inherit;font-size:17px;padding:13px 14px;outline:none;color:var(--ink);margin-bottom:10px}
  .fform textarea{font-size:16px;line-height:1.7;resize:none;min-height:64px}
  .setwrap p{font-size:13px;color:var(--gray);line-height:1.8;margin:8px 0 12px}
  .setwrap input,.setwrap textarea{width:100%;border:none;background:var(--fill);border-radius:12px;font-family:ui-monospace,monospace;font-size:16px;padding:12px;outline:none;margin-bottom:8px;color:var(--ink)}
  .setwrap textarea{min-height:80px;resize:vertical}
  .setwrap .btn{width:100%;margin-bottom:8px;padding:12px;font-size:14px}
  .stat{font-size:12px;color:var(--gray);margin-top:6px;line-height:1.7}

  /* ============ liquid glass tab bar ============ */
  nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:7;display:flex;justify-content:center;pointer-events:none}
  .tabbar{pointer-events:auto;position:relative;display:flex;padding:5px;border-radius:999px;touch-action:none;
    background:rgba(250,250,250,.62);
    backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 10px 34px rgba(0,0,0,.14), inset 0 0 0 .5px rgba(0,0,0,.055), inset 0 1.5px 1px rgba(255,255,255,.85)}
  .tab{width:86px;padding:9px 0 8px;border-radius:999px;border:none;background:none;color:var(--gray);
    font-size:10px;font-weight:500;font-family:inherit;letter-spacing:.02em;cursor:pointer;
    display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:2;
    transition:color .3s var(--ease-out)}
  .tab svg{width:23px;height:23px}
  .tab.active{color:var(--ink)}
  #lens{position:absolute;z-index:1;top:5px;left:5px;width:86px;height:calc(100% - 10px);border-radius:999px;
    background:rgba(255,255,255,.42);
    backdrop-filter:blur(3px) saturate(190%) brightness(1.06);-webkit-backdrop-filter:blur(3px) saturate(190%) brightness(1.06);
    box-shadow:
      0 4px 14px rgba(0,0,0,.12),
      inset 0 0 0 .5px rgba(255,255,255,.65),
      inset 0 1.5px 1.5px rgba(255,255,255,.95),
      inset 0 -1.5px 2px rgba(0,0,0,.07),
      inset 2px 0 3px -1px rgba(255,255,255,.5),
      inset -2px 0 3px -1px rgba(255,255,255,.5);
    transition:transform .55s var(--spring),scale .35s var(--spring);
    will-change:transform}
  #lens::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:.5;
    background:conic-gradient(from 210deg,rgba(255,180,120,.25),rgba(140,180,255,.22) 30%,transparent 45%,rgba(140,220,255,.18) 62%,rgba(255,170,140,.2) 82%,rgba(255,180,120,.25));
    -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000);mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000)}
  #lens::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;
    background:
      linear-gradient(115deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 30%),
      linear-gradient(295deg,rgba(255,255,255,.4) 0%,transparent 24%),
      radial-gradient(120% 90% at 50% -30%,rgba(255,255,255,.5),transparent 55%);
    background-size:220% 100%,220% 100%,100% 100%;
    background-position:calc(var(--lx,0px) + 0px) 0,calc(var(--lx,0px)*.6) 0,0 0;
    opacity:.85}
  .refract #lens{backdrop-filter:blur(1.5px) saturate(190%) brightness(1.05) url(#lensFilter);-webkit-backdrop-filter:blur(3px) saturate(190%) brightness(1.06)}

  #topbar{position:fixed;top:0;left:0;right:0;z-index:8;max-width:520px;margin:0 auto;
    height:calc(env(safe-area-inset-top) + 46px);padding-top:env(safe-area-inset-top);
    display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600;
    background:rgba(252,252,252,.75);backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
    border-bottom:.5px solid var(--sep);opacity:0;pointer-events:none;transition:opacity .28s var(--ease-out)}
  #topbar.show{opacity:1}

  #toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%) translateY(-80px);z-index:20;padding:12px 22px;font-size:14px;font-weight:500;transition:.5s var(--spring);white-space:nowrap;color:var(--ink);border-radius:999px;
    background:rgba(255,255,255,.6);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 8px 28px rgba(0,0,0,.16), inset 0 0 0 .5px rgba(0,0,0,.05), inset 0 1.5px 1px rgba(255,255,255,.9)}
  #toast.show{transform:translateX(-50%) translateY(0)}

  /* ============ desktop (MacBook) ============ */
  #sidebar{display:none}
  #content{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
  @media (min-width:900px){
    #app{max-width:none;flex-direction:row}
    nav{display:none}
    #topbar{display:none}
    #sidebar{display:flex;flex-direction:column;width:264px;flex:none;padding:28px 14px 20px;
      background:#fafafa;border-right:.5px solid var(--sep);overflow-y:auto}
    .sb-logo{font-size:15px;font-weight:700;letter-spacing:.02em;padding:0 12px 22px}
    .sb-sec{font-size:11px;color:var(--gray);letter-spacing:.08em;font-weight:500;padding:0 12px 6px}
    .sb-item{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;font-family:inherit;
      font-size:13.5px;font-weight:500;color:var(--ink);padding:9px 12px;border-radius:10px;cursor:pointer;text-align:left;
      transition:background .3s var(--ease-out)}
    .sb-item:hover{background:rgba(0,0,0,.05)}
    .sb-item.on{background:rgba(0,0,0,.08)}
    .sb-item svg{width:16px;height:16px;flex:none;color:var(--gray)}
    .sb-item .sb-plus{font-size:16px;font-weight:300;width:16px;text-align:center;color:var(--gray)}
    .sb-goal{display:block;width:100%;border:none;background:none;font-family:inherit;text-align:left;cursor:pointer;
      padding:9px 12px 10px;border-radius:10px;transition:background .3s var(--ease-out)}
    .sb-goal:hover{background:rgba(0,0,0,.05)}
    .sb-goal.on{background:rgba(0,0,0,.08)}
    .sb-goal .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
    .sb-goal .t b{font-size:13.5px;font-weight:500;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
    .sb-goal .t small{flex:none;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
    .sb-goal .t small.over{color:var(--red)}
    .sb-goal .bar{height:2px;background:rgba(0,0,0,.08);border-radius:2px;margin-top:7px;overflow:hidden}
    .sb-goal .bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .6s var(--ease-out)}
    main{padding:44px 56px 80px}
    .screen.active{max-width:760px}
    .large-title{font-size:30px}
    .gb-head{padding:20px 16px 6px;margin:0 -16px;border-radius:18px}
    .gb-head:hover{background:rgba(0,0,0,.03)}
    .gb-next{padding-bottom:14px}
    .sub:hover .sub-head span{color:var(--ink)}
    .sub{border-radius:10px}
    .t-row{margin:0 -16px}
    .t-slide{padding:13px 16px}
    .t-row::after{left:16px;right:16px}
    .cal-grid{max-width:560px}
    /* sheet → centered dialog */
    #sheet.desk{top:50%;left:50%;right:auto;bottom:auto;width:500px;margin:0;border-radius:20px;
      transform:translate(-50%,-50%);box-shadow:0 30px 80px rgba(0,0,0,.22), 0 0 0 .5px rgba(0,0,0,.06)}
    #sheet.desk .sh-grab{display:none}
    #sheet.desk #sheetBody{max-height:70vh;padding:24px 28px 28px}
  }

  @media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<script>
/* ================= state ================= */
const KEY='purpose.v2';
const REPO='gjnzqqf8dq-coder/purpose', PATH='data.json', BRANCH='main';
const emptyState=()=>({goals:[],tasks:[],del:{}});
let S=load(), sha=null, pushT=null, lastPull=0;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.goals)return norm(Object.assign(emptyState(),d))}catch(e){}return emptyState()}
function norm(s){s.goals.forEach(g=>{if(!Array.isArray(g.miles))g.miles=[]});return s}
function persist(){localStorage.setItem(KEY,JSON.stringify(S))}
function save(){persist();schedulePush();render()}
function saveQuiet(){persist();schedulePush()}
const uid=p=>(p||'x')+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);

/* ================= dates ================= */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(), TODAY=fmt(now);
const WDJ=['日','月','火','水','木','金','土'];
function dleft(dl){const a=new Date(TODAY+'T00:00:00'),b=new Date(dl+'T00:00:00');return Math.round((b-a)/864e5)}
let calY=now.getFullYear(), calM=now.getMonth(), calSel=TODAY;

/* ================= physics ================= */
function springLinear(stiff,damp,dur){
  const w0=Math.sqrt(stiff), z=damp/(2*Math.sqrt(stiff)), N=80, out=[];
  for(let i=0;i<=N;i++){const t=dur/1000*i/N;let x;
    if(z<1){const wd=w0*Math.sqrt(1-z*z);x=1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+z*w0/wd*Math.sin(wd*t))}
    else{x=1-Math.exp(-w0*t)*(1+w0*t)}
    out.push(x.toFixed(4))}
  return `linear(${out.join(',')})`;
}
const SPR_POP=springLinear(320,22,620);
const SPR_SOFT=springLinear(300,32,440);
const rubber=(x,c=120)=>x*c/(x+c);

/* ================= util ================= */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CHECK='<svg viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
function onTap(el,fn){
  let p=null;
  el.addEventListener('pointerdown',e=>{p={x:e.clientX,y:e.clientY}});
  el.addEventListener('pointermove',e=>{if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>10)p=null});
  el.addEventListener('pointerup',e=>{if(p){p=null;fn(e)}});
  el.addEventListener('pointercancel',()=>{p=null});
}
function onLongPress(el,fn,ms){
  let t=null;
  el.addEventListener('pointerdown',()=>{t=setTimeout(fn,ms||600)});
  ['pointerup','pointermove','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(t)));
}

/* ================= sheet ================= */
const sheet=document.getElementById('sheet'), sheetBody=document.getElementById('sheetBody'), dim=document.getElementById('dim');
let sheetOpen=false, sheetAnim=null;
const isDesk=()=>matchMedia('(min-width:900px)').matches;
function openSheet(build){
  sheetBody.scrollTop=0;
  sheetBody.replaceChildren();
  build(sheetBody);
  const desk=isDesk();
  sheet.classList.toggle('desk',desk);
  sheet.style.display='block';sheet.style.transform='';
  dim.classList.add('show');
  if(sheetAnim)sheetAnim.cancel();
  sheetAnim=desk
    ?sheet.animate([{opacity:0,transform:'translate(-50%,-50%) scale(.96)'},{opacity:1,transform:'translate(-50%,-50%) scale(1)'}],{duration:380,easing:SPR_SOFT,fill:'both'})
    :sheet.animate([{transform:'translateY(105%)'},{transform:'translateY(0)'}],{duration:420,easing:SPR_SOFT,fill:'both'});
  sheetOpen=true;
}
function closeSheet(fromY){
  if(!sheetOpen)return;
  if(sheetAnim)sheetAnim.cancel();
  dim.classList.remove('show');
  sheetAnim=sheet.classList.contains('desk')
    ?sheet.animate([{opacity:1,transform:'translate(-50%,-50%) scale(1)'},{opacity:0,transform:'translate(-50%,-50%) scale(.97)'}],{duration:200,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'})
    :sheet.animate([{transform:`translateY(${fromY||0}px)`},{transform:'translateY(105%)'}],{duration:280,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'});
  sheetAnim.onfinish=()=>{sheet.style.display='none';returnSettingsNode()};
  sheetOpen=false;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
onTap(dim,()=>closeSheet());
function returnSettingsNode(){const n=document.getElementById('setNode');if(n&&n.parentElement===sheetBody){n.style.display='none';document.body.appendChild(n)}}
let shDrag=null;
sheet.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.sh-grab'))return;
  shDrag={y0:e.clientY,t0:performance.now(),y:0,moved:false};
  if(sheetAnim)sheetAnim.cancel();
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener('pointermove',e=>{
  if(!shDrag)return;
  let dy=e.clientY-shDrag.y0;
  if(Math.abs(dy)>4)shDrag.moved=true;
  shDrag.y=dy;shDrag.t1=performance.now();
  const y=dy>0?dy:-rubber(-dy,60);
  sheet.style.transform=`translateY(${y}px)`;
});
function shEnd(){
  if(!shDrag)return;
  const dy=shDrag.y||0, dt=Math.max(1,(shDrag.t1||performance.now())-shDrag.t0);
  const v=dy/dt;
  const moved=shDrag.moved;shDrag=null;
  if(moved&&(dy>150||v>.45)){closeSheet(dy)}
  else{
    const from=sheet.style.transform;
    sheet.style.transform='';
    if(sheetAnim)sheetAnim.cancel();
    sheetAnim=sheet.animate([{transform:from||'translateY(0)'},{transform:'translateY(0)'}],{duration:540,easing:SPR_POP,fill:'both'});
  }
}
sheet.addEventListener('pointerup',shEnd);
sheet.addEventListener('pointercancel',shEnd);

/* ================= lens tab bar ================= */
const TABS=['home','cal'];
const TABTITLE={home:'ゴール',cal:'カレンダー'};
let curTab='home';
const lens=document.getElementById('lens'), tabbar=document.getElementById('tabbar');
const TABW=86;
function lensX(x){lens.style.transform=`translateX(${x}px)`;lens.style.setProperty('--lx',(-x*.38)+'px')}
function lensTo(idx){lensX(idx*TABW)}
function setTab(name){
  curTab=name;
  document.querySelectorAll('.tab').forEach(x=>{
    const on=x.dataset.scr===name;
    if(on&&!x.classList.contains('active')){
      const ic=x.querySelector('svg');
      if(ic)ic.animate([{transform:'scale(1)'},{transform:'scale(1.18)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.32,1.6,.45,1)'});
    }
    x.classList.toggle('active',on);
  });
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-'+name).classList.add('active');
  document.getElementById('topTitle').textContent=TABTITLE[name];
  lensTo(TABS.indexOf(name));
  render();document.getElementById('main').scrollTo({top:0});
  syncTopbar();
}
function goTab(name){
  if(sheetOpen)closeSheet();
  if(name!==curTab)setTab(name);
  else document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
}
let drag=null;
tabbar.addEventListener('pointerdown',e=>{
  drag={x0:e.clientX,idx:TABS.indexOf(curTab),moved:false,tab:e.target.closest('.tab')};
  tabbar.setPointerCapture(e.pointerId);
  lens.style.scale='1.12 1.16';
});
tabbar.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0;
  if(Math.abs(dx)>12)drag.moved=true;
  if(!drag.moved)return;
  let x=drag.idx*TABW+dx;
  const max=(TABS.length-1)*TABW;
  if(x<0)x=-rubber(-x,40);if(x>max)x=max+rubber(x-max,40);
  lens.style.transition='scale .35s var(--spring)';
  lensX(x);
});
function endDrag(e){
  if(!drag)return;
  lens.style.transition='';
  lens.style.scale='1 1';
  const st=drag;drag=null;
  if(st.moved){
    const dx=e.clientX-st.x0;
    const idx=Math.max(0,Math.min(TABS.length-1,Math.round((st.idx*TABW+dx)/TABW)));
    if(TABS[idx]!==curTab)setTab(TABS[idx]);else lensTo(idx);
  }else{
    let name=st.tab&&st.tab.dataset.scr;
    if(!name){
      const rc=tabbar.getBoundingClientRect();
      const idx=Math.max(0,Math.min(TABS.length-1,Math.floor((e.clientX-rc.left-5)/TABW)));
      name=TABS[idx];
    }
    goTab(name);
  }
}
tabbar.addEventListener('pointerup',endDrag);
tabbar.addEventListener('pointercancel',()=>{lens.style.transition='';lens.style.scale='1 1';drag=null;lensTo(TABS.indexOf(curTab))});

/* refraction (Chromium only) */
(function(){
  try{
    if(!CSS.supports('backdrop-filter','url(#lensFilter)'))return;
    const W=172,H=84,c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d'),img=g.createImageData(W,H);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const nx=(x-W/2)/(W/2),ny=(y-H/2)/(H/2);
      const r=Math.min(1,Math.hypot(nx,ny)),k=Math.pow(r,3);
      const i=(y*W+x)*4;
      img.data[i]=128-nx*k*127;img.data[i+1]=128-ny*k*127;img.data[i+2]=128;img.data[i+3]=255;
    }
    g.putImageData(img,0,0);
    document.getElementById('lensMap').setAttribute('href',c.toDataURL());
    document.documentElement.classList.add('refract');
  }catch(e){}
})();

const mainEl=document.getElementById('main');
function syncTopbar(){document.getElementById('topbar').classList.toggle('show',mainEl.scrollTop>52)}
mainEl.addEventListener('scroll',syncTopbar,{passive:true});

/* ================= render ================= */
let expandedGoal=null;
function render(){renderSidebar();renderHome();renderCal()}
function sortedGoals(){return [...S.goals].sort((a,b)=>(a.deadline||'9999')<(b.deadline||'9999')?-1:1)}
function goalTasks(g){return S.tasks.filter(t=>t.goalId===g.id)}
function mileTasks(m){return S.tasks.filter(t=>t.mileId===m.id).sort((a,b)=>a.date<b.date?-1:1)}
function dLabel(g){
  if(!g.deadline)return'';
  const d=dleft(g.deadline);
  if(d===0)return'<b>今日</b>が期限';
  if(d<0)return`<b>${-d}日</b>超過`;
  return`あと<b>${d}日</b>`;
}

/* ---- TODAY (execution view) ---- */
function taskRow(t,showDate){
  const g=S.goals.find(x=>x.id===t.goalId);
  const m=g&&t.mileId?(g.miles||[]).find(x=>x.id===t.mileId):null;
  const sub=[g&&g.title,m&&m.title].filter(Boolean).join(' ・ ');
  const over=t.date<TODAY&&!t.done;
  return `<div class="t-row${t.done?' done':''}" data-tid="${t.id}">
    <button class="t-del">削除</button>
    <div class="t-slide">
      <div class="t-check">${CHECK}</div>
      <div class="t-main"><div class="t-name">${esc(t.title)}</div>${sub?`<div class="t-sub">${esc(sub)}</div>`:''}</div>
      ${showDate?`<div class="t-date${over?' over':''}">${t.date.slice(5).replace('-','/')}</div>`:''}
    </div>
  </div>`;
}
function renderSidebar(){
  const sb=document.getElementById('sbGoals');if(!sb)return;
  const gs=sortedGoals();
  sb.innerHTML=gs.map(g=>{
    const ms=g.miles||[], dn=ms.filter(m=>m.done).length;
    const dl=g.deadline?dleft(g.deadline):null;
    return `<button class="sb-goal${curTab==='home'&&expandedGoal===g.id?' on':''}" data-gid="${g.id}">
      <div class="t"><b>${esc(g.title)}</b><small${dl!==null&&dl<0?' class="over"':''}>${dl===null?'':(dl<0?`+${-dl}日`:`${dl}日`)}</small></div>
      <div class="bar"><i style="width:${ms.length?dn/ms.length*100:0}%"></i></div>
    </button>`;
  }).join('');
  sb.querySelectorAll('.sb-goal').forEach(b=>b.onclick=()=>{
    expandedGoal=b.dataset.gid;
    if(curTab!=='home')setTab('home');else{renderHome();renderSidebar()}
    const el=document.querySelector(`.gb[data-gid="${b.dataset.gid}"]`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  });
  const cal=document.getElementById('sbCal');
  if(cal)cal.classList.toggle('on',curTab==='cal');
}

/* ---- GOALS (3-layer matryoshka routes) ---- */
function renderHome(){
  document.getElementById('homeCap').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${WDJ[now.getDay()]}曜日`;
  const wrap=document.getElementById('goalBlocks');
  const gs=sortedGoals();
  if(!gs.length){wrap.innerHTML='<div class="empty">＋ からゴールを追加。<br>ChatGPTに「purposeのdata.jsonにゴール入れて」でもOK。</div>';return}
  if(expandedGoal===null&&gs.length)expandedGoal=gs[0].id; // 直近期限のゴールをひらいておく
  wrap.innerHTML=gs.map(g=>{
    const ms=g.miles||[];
    const doneN=ms.filter(m=>m.done).length;
    const next=ms.find(m=>!m.done);
    let route='';
    if(ms.length){
      const n=ms.length;
      const pos=i=>n===1?50:(i/(n-1))*100;
      let lastDone=-1;for(let i=0;i<n;i++){if(ms[i].done)lastDone=i;else break}
      route=`<div class="gb-route">
        <div class="gb-track"></div>
        <div class="gb-fill" style="width:${lastDone<0?0:pos(lastDone)}%"></div>
        ${ms.map((m,i)=>`<div class="mile-dot${m.done?' done':(m===next?' next':'')}" style="left:${pos(i)}%"><i></i></div>`).join('')}
      </div>
      <div class="gb-next">${next?`<em>次：${esc(next.title)}</em>`:'<em>全マトリョーシカ達成 🎉</em>'}<span>${doneN}/${ms.length}</span></div>`;
    }else{
      route=`<div class="gb-route"><div class="gb-track"></div></div>
      <div class="gb-empty">ひらいてマトリョーシカを置く</div>`;
    }
    // layer 2+3: each milestone as its own sub-route with task dots
    const subs=ms.map(m=>{
      const ts=mileTasks(m);
      const dn=ts.filter(t=>t.done).length;
      let sub='';
      if(ts.length){
        const n2=ts.length, pos2=i=>n2===1?50:(i/(n2-1))*100;
        sub=`<div class="sub-route">
          <div class="sub-track"></div>
          <div class="sub-fill" style="width:${n2?dn/n2*100:0}%"></div>
          ${ts.map((t,i)=>`<div class="tdot${t.done?' done':''}" style="left:${pos2(i)}%" data-tid="${t.id}"><i></i></div>`).join('')}
        </div>`;
      }else{
        sub='<div class="sub-none">タスク未登録 — タップして追加</div>';
      }
      return `<div class="sub" data-mid="${m.id}" data-gid="${g.id}">
        <div class="sub-head${m.done?' done':''}"><i class="sdot"></i><span>${esc(m.title)}</span><small>${ts.length?`${dn}/${ts.length}`:''}</small></div>
        ${sub}
      </div>`;
    }).join('');
    return `<div class="gb${expandedGoal===g.id?' open':''}" data-gid="${g.id}">
      <div class="gb-head">
        <div class="gb-top"><span class="gb-title">${esc(g.title)}</span><span class="gb-d${g.deadline&&dleft(g.deadline)<0?' over':''}">${dLabel(g)}</span></div>
        ${route}
      </div>
      <div class="gb-exp"><div><div class="inner">
        ${subs}
        <button class="gb-open">ゴールをひらく（編集・マトリョーシカ追加） ›</button>
      </div></div></div>
    </div>`;
  }).join('');
  // bind
  wrap.querySelectorAll('.gb').forEach(el=>{
    const gid=el.dataset.gid;
    onTap(el.querySelector('.gb-head'),()=>{
      expandedGoal=expandedGoal===gid?null:gid;
      wrap.querySelectorAll('.gb').forEach(x=>x.classList.toggle('open',x.dataset.gid===expandedGoal));
    });
    el.querySelectorAll('.sub').forEach(sb=>{
      onTap(sb,e=>{
        const dot=e.target.closest('.tdot');
        if(dot){toggleTaskDot(dot);return}
        openMileSheet(sb.dataset.gid,sb.dataset.mid);
      });
    });
    const ob=el.querySelector('.gb-open');
    if(ob)onTap(ob,()=>openGoalSheet(gid));
  });
}
function toggleTaskDot(dot){
  const t=S.tasks.find(x=>x.id===dot.dataset.tid);if(!t)return;
  t.done=!t.done;t.u=Date.now();
  dot.classList.toggle('done',t.done);
  dot.querySelector('i').animate([{transform:'scale(1)'},{transform:'scale(1.7)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.32,1.6,.45,1)'});
  // update fill + count surgically
  const sub=dot.closest('.sub');
  const ts=S.tasks.filter(x=>x.mileId===sub.dataset.mid);
  const dn=ts.filter(x=>x.done).length;
  const fill=sub.querySelector('.sub-fill');
  if(fill)fill.style.width=(ts.length?dn/ts.length*100:0)+'%';
  const cnt=sub.querySelector('.sub-head small');
  if(cnt)cnt.textContent=ts.length?`${dn}/${ts.length}`:'';
  saveQuiet();
}

/* ================= swipe task rows ================= */
let openRow=null;
function bindTasks(root){
  root.querySelectorAll('.t-row').forEach(el=>{
    const t=S.tasks.find(x=>x.id===el.dataset.tid);if(!t)return;
    const slide=el.querySelector('.t-slide');
    const delBtn=el.querySelector('.t-del');
    let p=null;
    el.addEventListener('pointerdown',e=>{
      if(e.target===delBtn)return;
      p={x0:e.clientX,y0:e.clientY,mode:null,base:openRow===el?-88:0,t0:performance.now()};
      el.classList.add('pressed');
    });
    el.addEventListener('pointermove',e=>{
      if(!p)return;
      const dx=e.clientX-p.x0, dy=e.clientY-p.y0;
      if(!p.mode){
        if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){p.mode='x';el.setPointerCapture(e.pointerId);el.classList.remove('pressed')}
        else if(Math.abs(dy)>8){p=null;el.classList.remove('pressed');return}
      }
      if(p.mode==='x'){
        let x=p.base+dx;
        if(x>0)x=rubber(x,30);
        if(x<-110)x=-110-rubber(-x-110,40);
        slide.style.transform=`translateX(${x}px)`;
        p.x=x;p.t1=performance.now();
      }
    });
    el.addEventListener('pointerup',()=>{
      if(!p)return;
      el.classList.remove('pressed');
      const st=p;p=null;
      if(st.mode==='x'){
        const x=st.x??st.base;
        const v=(x-st.base)/Math.max(1,(st.t1||performance.now())-st.t0);
        if(x<-96||v<-.5){doDelete(el,t);openRow=null;return}
        if(x<-44){
          if(openRow&&openRow!==el){const s2=openRow.querySelector('.t-slide');s2.style.transform='';openRow=null}
          openRow=el;
          slide.animate([{transform:`translateX(${x}px)`},{transform:'translateX(-88px)'}],{duration:460,easing:SPR_POP,fill:'both'});
          slide.style.transform='translateX(-88px)';
        }else{
          slide.animate([{transform:`translateX(${x}px)`},{transform:'translateX(0)'}],{duration:460,easing:SPR_POP,fill:'both'});
          slide.style.transform='';
          if(openRow===el)openRow=null;
        }
        return;
      }
      if(openRow){const s2=openRow.querySelector('.t-slide');s2.style.transform='';openRow=null;return}
      t.done=!t.done;t.u=Date.now();
      el.classList.toggle('done',t.done);
      if(t.done){const c=el.querySelector('.t-check');
        c.animate([{transform:'scale(1)'},{transform:'scale(1.28)'},{transform:'scale(1)'}],{duration:420,easing:'cubic-bezier(.32,1.6,.45,1)'})}
      saveQuiet();renderHome();
    });
    el.addEventListener('pointercancel',()=>{p=null;el.classList.remove('pressed')});
    delBtn.addEventListener('click',()=>{doDelete(el,t);openRow=null});
  });
}
function doDelete(el,t){
  const slide=el.querySelector('.t-slide');
  const h=el.offsetHeight;
  slide.animate([{transform:slide.style.transform||'translateX(0)'},{transform:'translateX(-105%)'}],{duration:260,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'});
  el.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],{duration:340,delay:120,easing:'cubic-bezier(.22,.9,.28,1)',fill:'both'}).onfinish=()=>{
    S.del[t.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==t.id);
    persist();schedulePush();render();
  };
}

function renderCal(slideDir){
  document.getElementById('calTitle').textContent=`${calY}年${calM+1}月`;
  const grid=document.getElementById('calGrid');
  let html=WDJ.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  const start=new Date(calY,calM,1).getDay(), days=new Date(calY,calM+1,0).getDate();
  const prevDays=new Date(calY,calM,0).getDate();
  const cells=[];
  for(let i=start-1;i>=0;i--)cells.push({d:prevDays-i,dim:true,date:fmt(new Date(calY,calM-1,prevDays-i))});
  for(let d=1;d<=days;d++)cells.push({d,dim:false,date:fmt(new Date(calY,calM,d))});
  let nd=1;while(cells.length%7)cells.push({d:nd,dim:true,date:fmt(new Date(calY,calM+1,nd++))});
  const taskDates=new Set(S.tasks.map(t=>t.date));
  const openDates=new Set(S.tasks.filter(t=>!t.done).map(t=>t.date));
  const dlDates=new Set(S.goals.filter(g=>g.deadline).map(g=>g.deadline));
  html+=cells.map(c=>`<div class="cal-d${c.dim?' dim':''}${c.date===TODAY?' today':''}${c.date===calSel?' sel':''}" data-d="${c.date}">
    <span>${c.d}</span>${taskDates.has(c.date)?`<div class="dot${openDates.has(c.date)?' on':''}"></div>`:''}${dlDates.has(c.date)?'<div class="flag"></div>':''}
  </div>`).join('');
  grid.innerHTML=html;
  if(slideDir)grid.animate([{opacity:0,transform:`translateX(${slideDir*26}px)`},{opacity:1,transform:'none'}],{duration:420,easing:SPR_SOFT});
  grid.querySelectorAll('.cal-d').forEach(el=>onTap(el,()=>{
    calSel=el.dataset.d;renderCal();

    if(sp)sp.animate([{transform:'scale(.7)'},{transform:'scale(1.06)'},{transform:'scale(1)'}],{duration:380,easing:'cubic-bezier(.32,1.5,.45,1)'});
  }));
  const det=document.getElementById('calDetail');
  const d=new Date(calSel+'T00:00:00');
  const dls=S.goals.filter(g=>g.deadline===calSel);
  const ts=S.tasks.filter(t=>t.date===calSel);
  det.innerHTML=`<div class="sec-sub">${d.getMonth()+1}月${d.getDate()}日 ${WDJ[d.getDay()]}曜日</div>`
    +dls.map(g=>`<div class="cal-dl"><div class="f"></div><span>${esc(g.title)}</span><small>期限</small></div>`).join('')
    +(ts.length?ts.map(t=>taskRow(t)).join(''):(dls.length?'':'<div class="empty">予定はない</div>'));
  bindTasks(det);
}

/* ================= merge ================= */
function mergeState(a,b){
  const out=emptyState();
  out.del={...a.del,...b.del};
  for(const k of Object.keys(out.del))for(const src of[a.del,b.del])if(src[k]&&src[k]>out.del[k])out.del[k]=src[k];
  const pick=(la,lb)=>{
    const m=new Map();
    [...la,...lb].forEach(e=>{if(!e||!e.id)return;const ex=m.get(e.id);if(!ex||(e.u||0)>(ex.u||0))m.set(e.id,e)});
    return[...m.values()].filter(e=>!(out.del[e.id]&&out.del[e.id]>(e.u||0)));
  };
  out.goals=pick(a.goals||[],b.goals||[]);
  out.tasks=pick(a.tasks||[],b.tasks||[]);
  return norm(out);
}

/* ================= github sync ================= */
const tok=()=>localStorage.getItem('purpose.token')||'';
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){
  const h={'Accept':'application/vnd.github+json',...(opt.headers||{})};
  if(tok())h['Authorization']='Bearer '+tok();
  const r=await fetch(`https://api.github.com/repos/${REPO}/${path}`,{...opt,headers:h});
  if(!r.ok&&r.status!==404)throw new Error('GitHub '+r.status);
  return r.status===404?null:r.json();
}
async function pull(){
  const j=await gh(`contents/${PATH}?ref=${BRANCH}&t=${Date.now()}`);
  if(!j)return false;
  sha=j.sha;
  let remote;try{remote=JSON.parse(b64d(j.content))}catch(e){return false}
  const before=JSON.stringify(S);
  S=mergeState(S,Object.assign(emptyState(),remote));persist();
  if(JSON.stringify(S)!==before)render();
  lastPull=Date.now();
  return true;
}
async function push(){
  const body={message:'update from Purpose app',content:b64e(JSON.stringify(S,null,2)),branch:BRANCH};
  if(sha)body.sha=sha;
  try{
    const j=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});
    if(j&&j.content){sha=j.content.sha;setStat('同期済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}))}
  }catch(e){
    try{await pull();body.sha=sha;body.content=b64e(JSON.stringify(S,null,2));
      const j2=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});
      if(j2&&j2.content){sha=j2.content.sha;setStat('同期済み（マージ）')}
    }catch(e2){setStat('同期エラー — 後で再試行')}
  }
}
function schedulePush(){if(!tok())return;clearTimeout(pushT);pushT=setTimeout(push,3500)}
function setStat(m){const el=document.getElementById('syncStat');if(el)el.textContent=m||''}
document.getElementById('btnSyncNow').onclick=async()=>{
  const v=document.getElementById('tokenInput').value.trim();
  if(v)localStorage.setItem('purpose.token',v);
  if(!tok()){toast('トークンを入れて');return}
  document.getElementById('tokenInput').value='';
  setStat('同期中…');
  try{await pull();await push();toast('同期した')}
  catch(e){setStat('接続できない — トークンを確認');toast('同期に失敗')}
};
