<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#eef0f4">
<meta name="apple-mobile-web-app-title" content="Purpose">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Purpose</title>
<style>
/* ============================================================
   Purpose v9 — Liquid Glass
   ・入力は「声」だけ（キーボードは隠しフォールバック）
   ・ゴールはカテゴリで分ける
   ・マトリョーシカ＝入れ子（同心角丸・凹凸で階層を見せる）
   ============================================================ */
:root{
  color-scheme:light dark;

  /* --- 同心角丸（Liquid Glass の concentricity）--- */
  --r1:30px; --p1:9px;      /* ゴール器 */
  --r2:21px; --p2:7px;      /* 中の目標 = 30-9 */
  --r3:14px;                /* タスク    = 21-7 */

  /* --- 地の色（ガラスは背後に何か無いと見えない）--- */
  --amb-h:222;
  --bg:#eceef2;
  --surface:#ffffff;
  --ink:#0b0b0e;
  --ink-2:#3c3c43;
  --gray:#84848d;
  --gray2:#b8b8c2;
  --sep:rgba(60,60,67,.13);
  --fill:rgba(120,120,128,.10);
  --press:rgba(120,120,128,.18);
  --red:#e0402c;
  --amber:#f09000;

  /* --- ガラス --- */
  --glass:rgba(255,255,255,.55);
  --glass-hi:rgba(255,255,255,.72);
  --rim:rgba(255,255,255,.85);
  --rim-lo:rgba(255,255,255,.45);
  --edge:rgba(0,0,0,.055);
  --sh-1:0 1px 1px rgba(0,0,0,.035);
  --sh-2:0 8px 22px -8px rgba(0,0,0,.16);
  --sh-3:0 28px 64px -26px rgba(0,0,0,.28);

  /* --- 入れ子の凹凸 --- */
  --nest-in:rgba(120,120,128,.085);        /* 掘った面 */
  --nest-in-edge:rgba(0,0,0,.055);
  --nest-up:rgba(255,255,255,.92);         /* 中に置いた板 */
  --chip:#ffffff;                          /* 芯（不透明・スワイプの下地）*/

  --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif;
  --ease:cubic-bezier(.22,.9,.28,1);
  --spring:cubic-bezier(.32,1.5,.45,1);
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#0d0e11; --surface:#17181c; --ink:#f6f6f8; --ink-2:#c8c8d0;
    --gray:#8b8b95; --gray2:#4e4e57; --sep:rgba(255,255,255,.11);
    --fill:rgba(255,255,255,.09); --press:rgba(255,255,255,.16);
    --glass:rgba(38,39,45,.55); --glass-hi:rgba(52,53,60,.7);
    --rim:rgba(255,255,255,.24); --rim-lo:rgba(255,255,255,.1);
    --edge:rgba(255,255,255,.06);
    --sh-2:0 8px 22px -8px rgba(0,0,0,.6);
    --sh-3:0 28px 64px -26px rgba(0,0,0,.8);
    --nest-in:rgba(0,0,0,.28); --nest-in-edge:rgba(0,0,0,.5);
    --nest-up:rgba(255,255,255,.07); --chip:#212227;
  }
}

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;
  -webkit-font-smoothing:antialiased;font-feature-settings:"palt";user-select:none;-webkit-user-select:none}
input,textarea{user-select:text;-webkit-user-select:text}
button{font-family:inherit;color:inherit}

/* ============ ambient ground（ガラスが屈折する相手）============ */
#amb{position:fixed;inset:-20% -10%;z-index:0;pointer-events:none;filter:blur(0px);
  transition:opacity .9s var(--ease)}
#amb i{position:absolute;display:block;border-radius:50%;filter:blur(60px);opacity:.55;
  transition:background 1.2s var(--ease)}
#amb i:nth-child(1){width:62vmax;height:62vmax;left:-14%;top:-16%;
  background:radial-gradient(circle,hsl(var(--amb-h) 70% 74%/.5),transparent 66%);animation:d1 34s var(--ease) infinite alternate}
#amb i:nth-child(2){width:54vmax;height:54vmax;right:-16%;top:12%;
  background:radial-gradient(circle,hsl(calc(var(--amb-h) + 48) 72% 76%/.42),transparent 66%);animation:d2 41s var(--ease) infinite alternate}
#amb i:nth-child(3){width:66vmax;height:66vmax;left:8%;bottom:-30%;
  background:radial-gradient(circle,hsl(calc(var(--amb-h) - 42) 68% 78%/.38),transparent 66%);animation:d3 47s var(--ease) infinite alternate}
@keyframes d1{to{transform:translate3d(9vmax,7vmax,0) scale(1.14)}}
@keyframes d2{to{transform:translate3d(-11vmax,9vmax,0) scale(1.1)}}
@keyframes d3{to{transform:translate3d(7vmax,-8vmax,0) scale(1.16)}}
@media (prefers-color-scheme:dark){#amb i{opacity:.34;filter:blur(80px)}}

/* ============ shell ============ */
#app{position:relative;z-index:1;height:100dvh;display:flex;flex-direction:column;max-width:540px;margin:0 auto}
main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 22px) 16px 168px;
  -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain}
main::-webkit-scrollbar{display:none}
.screen{display:none}
.screen.active{display:block;animation:in .38s var(--ease) both}
@keyframes in{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}

.caption{font-size:12.5px;color:var(--gray);letter-spacing:.02em}
.large-title{font-size:33px;font-weight:700;letter-spacing:.005em;line-height:1.2;margin:3px 0 2px}
.navrow{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:0 4px 16px}
.empty{color:var(--gray);font-size:14.5px;padding:34px 6px;text-align:center;line-height:2.1}

/* ============ liquid glass primitives ============ */
.glass{position:relative;isolation:isolate;
  background:var(--glass);
  backdrop-filter:blur(22px) saturate(190%) brightness(1.03);
  -webkit-backdrop-filter:blur(22px) saturate(190%) brightness(1.03);
  box-shadow:var(--sh-1),var(--sh-2),
    inset 0 0 0 .5px var(--edge),
    inset 0 1px .5px var(--rim),
    inset 0 -1px 1.5px rgba(0,0,0,.045)}
/* 反射（specular）— 上辺に光が乗り、角で回り込む */
.glass::before{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;z-index:2;
  background:
    linear-gradient(150deg,var(--rim) 0%,transparent 26%),
    linear-gradient(330deg,var(--rim-lo) 0%,transparent 20%);
  mix-blend-mode:screen;opacity:.9}
/* 縁の色収差 */
.glass::after{content:"";position:absolute;inset:-.5px;border-radius:inherit;pointer-events:none;z-index:3;opacity:.42;
  background:conic-gradient(from 205deg,rgba(255,176,116,.34),rgba(126,176,255,.3) 28%,transparent 44%,rgba(140,224,255,.26) 62%,rgba(255,166,132,.3) 84%,rgba(255,176,116,.34));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000);
  mask:radial-gradient(farthest-side,transparent calc(100% - 2px),#000)}
.glass.flat::after{opacity:0}

.gbtn{border:none;background:var(--glass-hi);cursor:pointer;position:relative;
  backdrop-filter:blur(18px) saturate(180%);-webkit-backdrop-filter:blur(18px) saturate(180%);
  box-shadow:var(--sh-1),var(--sh-2),inset 0 0 0 .5px var(--edge),inset 0 1px .5px var(--rim);
  transition:transform .42s var(--spring),opacity .3s,background .3s}
.gbtn:active{transform:scale(.93);opacity:.82;transition:transform .07s}
.round{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;flex:none}

/* ============ scroll edge effect ============ */
#edgeTop{position:fixed;top:0;left:0;right:0;height:calc(env(safe-area-inset-top) + 8px);z-index:8;pointer-events:none;
  backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);
  -webkit-mask:linear-gradient(#000 40%,transparent);mask:linear-gradient(#000 40%,transparent);
  opacity:0;transition:opacity .3s var(--ease)}
#edgeTop.on{opacity:1}
#edgeBot{position:fixed;bottom:0;left:0;right:0;height:150px;z-index:6;pointer-events:none;
  backdrop-filter:blur(11px);-webkit-backdrop-filter:blur(11px);
  -webkit-mask:linear-gradient(transparent,#000 78%);mask:linear-gradient(transparent,#000 78%)}

#topbar{position:fixed;top:0;left:0;right:0;z-index:9;max-width:540px;margin:0 auto;
  height:calc(env(safe-area-inset-top) + 48px);padding-top:env(safe-area-inset-top);
  display:flex;align-items:center;justify-content:center;font-size:16.5px;font-weight:600;
  background:color-mix(in srgb,var(--bg) 62%,transparent);
  backdrop-filter:blur(22px) saturate(180%);-webkit-backdrop-filter:blur(22px) saturate(180%);
  box-shadow:0 .5px 0 var(--sep);opacity:0;pointer-events:none;transition:opacity .3s var(--ease)}
#topbar.show{opacity:1}

/* ============ category chips ============ */
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:2px 4px 14px;margin:0 -16px;
  padding-left:16px;padding-right:16px;scroll-padding:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:flex;align-items:center;gap:6px;border:none;cursor:pointer;
  padding:8px 14px;border-radius:999px;font-size:13px;font-weight:600;letter-spacing:.01em;
  color:var(--ink-2);background:var(--glass-hi);
  backdrop-filter:blur(16px) saturate(180%);-webkit-backdrop-filter:blur(16px) saturate(180%);
  box-shadow:inset 0 0 0 .5px var(--edge),inset 0 1px .5px var(--rim),var(--sh-1);
  transition:transform .4s var(--spring),background .35s var(--ease),color .35s var(--ease)}
.chip:active{transform:scale(.94);transition:transform .07s}
.chip i{width:7px;height:7px;border-radius:50%;flex:none;background:hsl(var(--h,220) 66% 55%)}
.chip small{font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.chip.on{background:var(--ink);color:var(--bg);box-shadow:var(--sh-2),inset 0 1px .5px rgba(255,255,255,.28)}
.chip.on small{color:color-mix(in srgb,var(--bg) 62%,transparent)}
.chip.on i{box-shadow:0 0 0 1.5px color-mix(in srgb,var(--bg) 45%,transparent)}

/* ============ category section ============ */
.catsec{display:flex;align-items:center;gap:8px;margin:26px 6px 9px}
.catsec:first-child{margin-top:4px}
.catsec i{width:8px;height:8px;border-radius:50%;flex:none;background:hsl(var(--h,220) 66% 55%);
  box-shadow:0 0 0 3px hsl(var(--h,220) 66% 55%/.16)}
.catsec b{font-size:13px;font-weight:700;letter-spacing:.02em}
.catsec span{font-size:11.5px;color:var(--gray);font-variant-numeric:tabular-nums;margin-left:auto}

/* ============================================================
   MATRYOSHKA — 入れ子（外＝ゴール／中＝中の目標／芯＝タスク）
   ============================================================ */
.goal{border-radius:var(--r1);padding:var(--p1);margin-bottom:13px;
  --h:220;
  background:linear-gradient(180deg,color-mix(in srgb,hsl(var(--h) 60% 92%) 26%,var(--glass)),var(--glass));
  transition:box-shadow .5s var(--ease)}
.goal.open{box-shadow:var(--sh-1),var(--sh-3),inset 0 0 0 .5px var(--edge),inset 0 1px .5px var(--rim)}

.g-head{padding:13px 13px 4px;cursor:pointer;border-radius:calc(var(--r1) - var(--p1));
  transition:background .45s var(--ease)}
.g-head:active{background:var(--press);transition:background .07s}
.g-kick{display:flex;align-items:center;gap:6px;font-size:10.5px;font-weight:700;letter-spacing:.13em;
  color:var(--gray);margin-bottom:7px}
.g-kick i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h) 66% 55%)}
.g-kick em{font-style:normal;margin-left:auto;letter-spacing:.02em;font-weight:600;font-size:11.5px;
  font-variant-numeric:tabular-nums;color:var(--gray)}
.g-kick em.over{color:var(--red)}
.g-kick em b{font-size:14px;color:var(--ink);font-weight:700}
.g-kick em.over b{color:var(--red)}
.g-title{font-size:19px;font-weight:650;line-height:1.38;letter-spacing:.005em;word-break:break-word}

/* 外殻の進捗＝マトリョーシカが何個開いたか */
.g-route{position:relative;height:24px;margin:13px 2px 2px}
.g-track{position:absolute;left:0;right:0;top:11px;height:2.5px;border-radius:3px;
  background:var(--nest-in);box-shadow:inset 0 .5px 1px var(--nest-in-edge)}
.g-fill{position:absolute;left:0;top:11px;height:2.5px;border-radius:3px;background:var(--ink);
  transition:width .9s var(--ease)}
.mdot{position:absolute;top:0;width:24px;height:24px;transform:translateX(-50%);display:grid;place-items:center}
.mdot i{width:11px;height:11px;border-radius:50%;background:var(--surface);
  box-shadow:inset 0 0 0 1.5px var(--gray2);transition:.35s var(--spring)}
.mdot.done i{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.mdot.next i{width:14px;height:14px;background:var(--surface);
  box-shadow:inset 0 0 0 2.5px var(--ink),0 0 0 4px color-mix(in srgb,var(--ink) 10%,transparent)}
.g-sum{display:flex;gap:10px;align-items:baseline;font-size:12.5px;color:var(--gray);padding:2px 3px 11px}
.g-sum em{font-style:normal;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.g-sum span{margin-left:auto;flex:none;font-variant-numeric:tabular-nums}

/* --- 入れ子の器（掘った面）--- */
.g-nest{display:grid;grid-template-rows:0fr;transition:grid-template-rows .55s var(--ease)}
.goal.open .g-nest{grid-template-rows:1fr}
.g-nest>div{min-height:0;overflow:hidden}
.nest-in{border-radius:var(--r2);background:var(--nest-in);padding:var(--p2);margin-top:2px;
  box-shadow:inset 0 1px 2px var(--nest-in-edge),inset 0 0 0 .5px rgba(0,0,0,.03)}
.nest-lbl{display:flex;align-items:center;gap:7px;font-size:10px;font-weight:700;letter-spacing:.12em;
  color:var(--gray);padding:5px 8px 8px}
.nest-lbl:after{content:"";flex:1;height:.5px;background:var(--sep)}

/* --- 中の目標（掘った面に置かれた板）--- */
.mile{border-radius:var(--r2);background:var(--nest-up);margin-bottom:6px;overflow:hidden;
  box-shadow:0 1px 2px rgba(0,0,0,.05),inset 0 0 0 .5px rgba(255,255,255,.5);
  transition:box-shadow .4s var(--ease)}
.mile:last-child{margin-bottom:0}
.mile.on{box-shadow:0 4px 14px -4px rgba(0,0,0,.16),inset 0 0 0 .5px rgba(255,255,255,.6)}
.m-head{display:flex;align-items:center;gap:10px;padding:11px 12px;cursor:pointer;
  transition:background .4s var(--ease)}
.m-head:active{background:var(--press);transition:background .07s}
.m-num{flex:none;width:19px;height:19px;border-radius:7px;display:grid;place-items:center;
  font-size:10.5px;font-weight:700;font-variant-numeric:tabular-nums;
  background:var(--fill);color:var(--gray);transition:.4s var(--ease)}
.m-head.done .m-num{background:var(--ink);color:var(--bg)}
.m-title{flex:1;min-width:0;font-size:14.5px;font-weight:600;line-height:1.4;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .4s}
.m-head.done .m-title{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--gray2)}
.m-cnt{flex:none;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums;
  background:var(--fill);border-radius:6px;padding:2.5px 6px}
.m-chev{flex:none;width:13px;color:var(--gray2);transition:transform .45s var(--spring)}
.mile.on .m-chev{transform:rotate(90deg)}

/* --- 芯：タスク（板の中にさらに掘った面）--- */
.m-nest{display:grid;grid-template-rows:0fr;transition:grid-template-rows .5s var(--ease)}
.mile.on .m-nest{grid-template-rows:1fr}
.m-nest>div{min-height:0;overflow:hidden}
.m-inner{margin:0 7px 7px;padding:5px;border-radius:var(--r3);background:var(--nest-in);
  box-shadow:inset 0 1px 2px var(--nest-in-edge)}
.tk{position:relative;overflow:hidden;border-radius:calc(var(--r3) - 4px);touch-action:pan-y;margin-bottom:3px}
.tk:last-child{margin-bottom:0}
.tk-del{position:absolute;top:0;right:0;bottom:0;width:88px;background:var(--red);color:#fff;
  font-size:14px;font-weight:600;border:none;display:grid;place-items:center;cursor:pointer}
.tk-slide{position:relative;display:flex;align-items:center;gap:10px;padding:9px 10px;
  background:var(--chip);border-radius:inherit;will-change:transform;
  box-shadow:inset 0 0 0 .5px rgba(255,255,255,.4);transition:background .45s var(--ease)}
.tk.pressed .tk-slide{background:var(--press);transition:background .07s}
.tk-c{flex:none;width:19px;height:19px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--gray2);transition:.35s var(--ease)}
.tk-c svg{opacity:0;transform:scale(.4);transition:.3s var(--spring)}
.tk.done .tk-c{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.tk.done .tk-c svg{opacity:1;transform:scale(1)}
.tk-t{flex:1;min-width:0;font-size:13.5px;line-height:1.4;position:relative;transition:color .45s}
.tk.done .tk-t{color:var(--gray)}
.tk.done .tk-t::after{content:"";position:absolute;left:0;top:54%;height:1.2px;width:100%;background:var(--gray2)}
.tk-d{flex:none;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.tk-d.over{color:var(--red)}
.m-none{font-size:12px;color:var(--gray);padding:9px 8px;text-align:center}

/* --- 器の足元 --- */
.g-foot{display:flex;gap:6px;padding:9px 4px 3px}
.g-foot button{flex:1;border:none;background:none;cursor:pointer;font-size:12.5px;font-weight:600;
  color:var(--gray);padding:8px;border-radius:12px;transition:background .4s,color .3s}
.g-foot button:active{background:var(--press);color:var(--ink);transition:background .07s}
.g-foot button.mic{color:var(--ink)}
.g-foot .plan.todo{color:var(--amber)}

/* ============ floating bar (tabs + mic) ============ */
nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:11;
  display:flex;justify-content:center;align-items:center;gap:10px;pointer-events:none;
  transition:transform .5s var(--ease)}
.tabbar{pointer-events:auto;position:relative;display:flex;padding:5px;border-radius:999px;touch-action:none;
  transition:padding .45s var(--spring)}
.tab{width:84px;padding:8px 0 7px;border-radius:999px;border:none;background:none;color:var(--gray);
  font-size:9.5px;font-weight:600;letter-spacing:.02em;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;gap:3px;position:relative;z-index:4;
  transition:color .3s var(--ease),width .45s var(--spring)}
.tab svg{width:22px;height:22px}
.tab b{font-weight:600;max-height:14px;overflow:hidden;transition:max-height .4s var(--ease),opacity .3s}
.tab.active{color:var(--ink)}
nav.mini .tab{width:56px}
nav.mini .tab b{max-height:0;opacity:0}
#lens{position:absolute;z-index:1;top:5px;left:5px;width:84px;height:calc(100% - 10px);border-radius:999px;
  background:rgba(255,255,255,.4);
  backdrop-filter:blur(3px) saturate(200%) brightness(1.07);-webkit-backdrop-filter:blur(3px) saturate(200%) brightness(1.07);
  box-shadow:0 4px 14px rgba(0,0,0,.12),
    inset 0 0 0 .5px rgba(255,255,255,.7),inset 0 1.5px 1.5px rgba(255,255,255,.95),
    inset 0 -1.5px 2px rgba(0,0,0,.07),inset 2px 0 3px -1px rgba(255,255,255,.5),inset -2px 0 3px -1px rgba(255,255,255,.5);
  transition:transform .55s var(--spring),scale .35s var(--spring),width .45s var(--spring);will-change:transform}
@media (prefers-color-scheme:dark){#lens{background:rgba(255,255,255,.11);
  box-shadow:0 4px 14px rgba(0,0,0,.4),inset 0 0 0 .5px rgba(255,255,255,.2),inset 0 1.5px 1.5px rgba(255,255,255,.22)}}
nav.mini #lens{width:56px}
#lens::before{content:"";position:absolute;inset:-1px;border-radius:inherit;pointer-events:none;opacity:.5;
  background:conic-gradient(from 210deg,rgba(255,180,120,.25),rgba(140,180,255,.22) 30%,transparent 45%,rgba(140,220,255,.18) 62%,rgba(255,170,140,.2) 82%,rgba(255,180,120,.25));
  -webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000);mask:radial-gradient(farthest-side,transparent calc(100% - 2.5px),#000)}
#lens::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;mix-blend-mode:screen;
  background:linear-gradient(115deg,rgba(255,255,255,.85) 0%,rgba(255,255,255,0) 30%),
    linear-gradient(295deg,rgba(255,255,255,.4) 0%,transparent 24%),
    radial-gradient(120% 90% at 50% -30%,rgba(255,255,255,.5),transparent 55%);
  background-size:220% 100%,220% 100%,100% 100%;
  background-position:calc(var(--lx,0px)) 0,calc(var(--lx,0px)*.6) 0,0 0;opacity:.85}
.refract #lens{backdrop-filter:blur(1.5px) saturate(200%) brightness(1.06) url(#lensFilter)}

#micBtn{pointer-events:auto;width:56px;height:56px;border-radius:50%;flex:none;display:grid;place-items:center;
  border:none;cursor:pointer;background:var(--ink);color:var(--bg);
  box-shadow:0 10px 30px -8px rgba(0,0,0,.45),inset 0 1px 1px rgba(255,255,255,.28);

#micBtn:active{transform:scale(.9);transition:transform .07s}

/* ============ voice ============ */
#vdim{position:fixed;inset:0;z-index:20;opacity:0;pointer-events:none;transition:opacity .35s var(--ease);
  background:color-mix(in srgb,var(--bg) 90%,transparent);

body.listening nav{opacity:0;pointer-events:none;transform:translateY(30px)}
nav{transition:transform .5s var(--ease),opacity .3s var(--ease)}

#voice{position:fixed;inset:auto 0 0 0;z-index:21;max-width:540px;margin:0 auto;
  padding:0 18px calc(env(safe-area-inset-bottom) + 22px);display:none;flex-direction:column;justify-content:flex-end;
  min-height:100dvh;pointer-events:none}
#voice.on{display:flex}
#voice>*{pointer-events:auto}
.v-live{flex:1;display:flex;flex-direction:column;justify-content:flex-end;padding:0 6px 26px;min-height:0}
.v-hint{font-size:12.5px;color:var(--gray);letter-spacing:.04em;margin-bottom:12px}
.v-text{font-size:27px;font-weight:650;line-height:1.55;letter-spacing:.005em;word-break:break-word;
  max-height:44vh;overflow-y:auto;scrollbar-width:none}
.v-text::-webkit-scrollbar{display:none}
.v-text .im{color:var(--gray2)}
.v-orb{width:88px;height:88px;border-radius:50%;margin:0 auto 18px;position:relative;flex:none;
  background:var(--ink);display:grid;place-items:center;color:var(--bg);
  box-shadow:0 14px 40px -10px rgba(0,0,0,.5)}
.v-orb svg{width:34px;height:34px}
.v-orb::before,.v-orb::after{content:"";position:absolute;inset:0;border-radius:50%;
  box-shadow:0 0 0 1.5px color-mix(in srgb,var(--ink) 30%,transparent);animation:pulse 2.4s var(--ease) infinite}
.v-orb::after{animation-delay:1.2s}
@keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(2.1);opacity:0}}
.v-orb.idle::before,.v-orb.idle::after{animation:none;opacity:0}
.v-card{border-radius:26px;padding:16px 18px 18px;margin-bottom:12px}
.v-row{display:flex;align-items:center;gap:9px;font-size:12.5px;color:var(--gray);margin-bottom:9px}
.v-row b{color:var(--ink);font-size:13px;font-weight:650}
.v-what{font-size:18px;font-weight:650;line-height:1.5;margin-bottom:13px;word-break:break-word}
.v-opts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:5px}
.v-opt{border:none;cursor:pointer;padding:7px 12px;border-radius:999px;font-size:12px;font-weight:600;
  background:var(--fill);color:var(--ink-2);transition:transform .4s var(--spring),background .3s,color .3s}
.v-opt:active{transform:scale(.93);transition:transform .07s}
.v-opt.on{background:var(--ink);color:var(--bg)}
.v-sec{font-size:10px;font-weight:700;letter-spacing:.12em;color:var(--gray);margin:13px 0 7px}
.v-acts{display:flex;gap:8px;margin-top:16px}
.v-kb{display:block;width:100%;border:none;background:none;cursor:pointer;color:var(--gray);
  font-size:12px;padding:12px;text-align:center}
.v-kbfield{display:none;margin-bottom:12px}
.v-kbfield.on{display:block}
.v-kbfield input{width:100%;border:none;background:var(--fill);border-radius:16px;font-family:inherit;
  font-size:17px;padding:14px 16px;outline:none;color:var(--ink)}
.v-dest{max-height:38vh;overflow-y:auto;scrollbar-width:none}
.v-dest::-webkit-scrollbar{display:none}
.v-d{display:flex;align-items:center;gap:10px;width:100%;border:none;background:none;cursor:pointer;
  padding:11px 10px;border-radius:14px;text-align:left;font-size:14px;transition:background .35s}
.v-d:active{background:var(--press);transition:background .07s}
.v-d.on{background:var(--fill)}
.v-d i{width:7px;height:7px;border-radius:50%;flex:none;background:hsl(var(--h,220) 66% 55%)}
.v-d span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.v-d small{flex:none;font-size:11px;color:var(--gray)}
.v-d.sub{padding-left:26px;font-size:13.5px;color:var(--ink-2)}

/* ============ sheet ============ */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.26);z-index:14;opacity:0;pointer-events:none;
  transition:opacity .32s var(--ease);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}
#dim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:540px;margin:0 auto;z-index:15;
  background:color-mix(in srgb,var(--surface) 82%,transparent);
  backdrop-filter:blur(40px) saturate(190%);-webkit-backdrop-filter:blur(40px) saturate(190%);
  border-radius:32px 32px 0 0;transform:translateY(105%);will-change:transform;
  box-shadow:0 -10px 50px rgba(0,0,0,.2),inset 0 1px .5px var(--rim);display:none}
.sh-grab{padding:10px 0 5px;touch-action:none;cursor:grab}
.sh-handle{width:38px;height:5px;border-radius:3px;background:var(--gray2);margin:0 auto;opacity:.7}
#sheetBody{max-height:78dvh;overflow-y:auto;padding:8px 22px calc(env(safe-area-inset-bottom) + 26px);
  -webkit-overflow-scrolling:touch;overscroll-behavior-y:contain;scrollbar-width:none}
#sheetBody::-webkit-scrollbar{display:none}
.sh-kicker{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--gray);margin-top:8px}
.sh-title{font-size:22px;font-weight:650;margin-top:9px;line-height:1.45;word-break:break-word}
.sh-date{font-size:13.5px;color:var(--gray);margin-top:4px;font-variant-numeric:tabular-nums}
.sh-note{font-size:14.5px;color:var(--ink-2);line-height:1.85;white-space:pre-wrap;word-break:break-word;margin-top:12px}
.sh-sec{font-size:10.5px;font-weight:700;letter-spacing:.12em;color:var(--gray);margin:24px 0 7px}
.row{display:flex;align-items:center;gap:11px;padding:11px 10px;margin:0 -10px;border-radius:14px;
  font-size:15px;cursor:pointer;transition:background .35s}
.row:active{background:var(--press);transition:background .07s}
.row .c{flex:none;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;
  box-shadow:inset 0 0 0 1.5px var(--gray2);transition:.3s}
.row .c svg{opacity:0;transform:scale(.4);transition:.3s var(--spring)}
.row.done .c{background:var(--ink);box-shadow:inset 0 0 0 1.5px var(--ink)}
.row.done .c svg{opacity:1;transform:scale(1)}
.row span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;transition:color .4s}
.row.done span{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--gray2)}
.row small,.row i{flex:none;font-size:11.5px;color:var(--gray);font-style:normal;font-variant-numeric:tabular-nums}
.sh-actions{display:flex;gap:8px;margin-top:24px}
.btn{flex:1;padding:14px;border-radius:999px;border:none;font-size:15px;font-weight:650;cursor:pointer;
  transition:transform .4s var(--spring),opacity .3s,background .3s,color .3s}
.btn:active{transform:scale(.96);opacity:.85;transition:transform .07s}
.btn.primary{background:var(--ink);color:var(--bg)}
.btn.plain{background:var(--fill);color:var(--ink)}
.btn.dangerous{background:var(--fill);color:var(--red)}
.btn.dangerous.arm{background:var(--red);color:#fff}
.micline{display:flex;align-items:center;gap:10px;width:100%;border:none;cursor:pointer;margin-top:12px;
  padding:13px 15px;border-radius:16px;background:var(--fill);color:var(--ink);font-size:14.5px;font-weight:600;
  transition:transform .4s var(--spring),background .3s}
.micline:active{transform:scale(.975);transition:transform .07s}
.micline svg{width:17px;height:17px;flex:none}
.field{display:block;width:100%;text-align:left;border:none;background:var(--fill);border-radius:16px;
  font-family:inherit;font-size:16.5px;padding:14px 15px;outline:none;color:var(--ink);margin-bottom:9px}
.field.ph{color:var(--gray2)}
textarea.field{line-height:1.7;resize:none;min-height:70px}
.pl-lead{font-size:13px;color:var(--gray);line-height:1.6;margin:4px 0 2px}
.pl-row{display:flex;align-items:center;gap:11px;padding:11px 0;font-size:14.5px;border-bottom:.5px solid var(--sep)}
.pl-row .n{flex:none;width:20px;height:20px;border-radius:7px;background:var(--fill);display:grid;place-items:center;
  font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.pl-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-row .w{flex:none;font-size:11.5px;color:var(--gray);font-variant-numeric:tabular-nums}
.pl-row .go{flex:none;border:none;background:var(--ink);color:var(--bg);font-size:11px;font-weight:650;
  border-radius:9px;padding:6px 10px;cursor:pointer;transition:transform .4s var(--spring),opacity .3s}
.pl-row .go:active{transform:scale(.92);transition:transform .07s}
.pl-row .go.off{background:var(--fill);color:var(--gray2)}
.pl-alt{padding:12px 0;border-bottom:.5px solid var(--sep);font-size:14px;line-height:1.6}
.pl-alt em{font-style:normal;color:var(--gray)}
.pl-alt .h{margin-top:6px;color:var(--ink-2);font-size:13.5px}
.pl-empty{font-size:12.5px;color:var(--gray2);padding:11px 0}
.setwrap p{font-size:12.5px;color:var(--gray);line-height:1.8;margin:8px 0 12px}
.setwrap input,.setwrap textarea{width:100%;border:none;background:var(--fill);border-radius:14px;
  font-family:ui-monospace,monospace;font-size:16px;padding:12px;outline:none;margin-bottom:8px;color:var(--ink)}
.setwrap textarea{min-height:80px;resize:vertical}
.setwrap .btn{width:100%;margin-bottom:8px;padding:12px;font-size:14px}
.stat{font-size:11.5px;color:var(--gray);margin-top:6px;line-height:1.7}

/* ============ calendar ============ */
.cal-wrap{border-radius:var(--r1);padding:14px 12px 10px}
.cal-head{display:flex;align-items:center;justify-content:space-between;margin:0 4px 10px}
.cal-title{font-size:18px;font-weight:650;font-variant-numeric:tabular-nums}
.cal-nav{display:flex;gap:3px}
.cal-nav button{width:36px;height:36px;border:none;background:none;cursor:pointer;font-size:19px;
  border-radius:50%;transition:background .4s}
.cal-nav button:active{background:var(--press);transition:background .05s}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:3px;text-align:center}
.cal-wd{font-size:11px;color:var(--gray);font-weight:600;padding:4px 0 8px}
.cal-d{position:relative;height:46px;display:flex;flex-direction:column;align-items:center;padding-top:4px;cursor:pointer}
.cal-d span{width:33px;height:33px;display:grid;place-items:center;font-size:17.5px;font-weight:400;
  border-radius:50%;font-variant-numeric:tabular-nums;transition:background .35s var(--ease),color .35s var(--ease)}
.cal-d:active span{background:var(--press);transition:background .05s}
.cal-d.dim span{color:var(--gray2)}
.cal-d.today span{font-weight:700}
.cal-d.sel span{background:var(--ink);color:var(--bg);font-weight:600}
.cal-d .dot{width:4.5px;height:4.5px;border-radius:50%;background:var(--gray2);margin-top:1px}
.cal-d .dot.on{background:var(--ink)}
.cal-d .flag{position:absolute;top:1px;right:5px;width:5px;height:5px;border-radius:50%;background:var(--red)}
.cal-detail{margin-top:14px;border-radius:var(--r1);padding:14px 16px}
.sec-sub{font-size:12.5px;color:var(--gray);margin-bottom:4px}
.cal-dl{padding:11px 0;border-bottom:.5px solid var(--sep);display:flex;align-items:center;gap:11px;font-size:14.5px}
.cal-dl .f{flex:none;width:6px;height:6px;border-radius:50%;background:var(--red)}
.cal-dl small{color:var(--gray);font-size:12px;margin-left:auto;flex:none}

#toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;
  transform:translateX(-50%) translateY(-90px);z-index:30;padding:12px 22px;font-size:13.5px;font-weight:600;
  transition:.55s var(--spring);white-space:nowrap;border-radius:999px}
#toast.show{transform:translateX(-50%) translateY(0)}

/* ============ desktop ============ */
#sidebar,#inspector{display:none}
#content{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
@media (min-width:960px){
  #app{max-width:none;flex-direction:row}
  nav,#topbar,#edgeBot{display:none}
  #sidebar{display:flex;flex-direction:column;width:262px;flex:none;padding:26px 12px 18px;overflow-y:auto;
    scrollbar-width:none;background:color-mix(in srgb,var(--surface) 42%,transparent);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    box-shadow:inset -.5px 0 0 var(--sep)}
  #sidebar::-webkit-scrollbar{display:none}
  .sb-logo{font-size:14.5px;font-weight:700;letter-spacing:.02em;padding:0 12px 20px}
  .sb-sec{font-size:10px;color:var(--gray);letter-spacing:.11em;font-weight:700;padding:14px 12px 6px;
    display:flex;align-items:center;gap:6px}
  .sb-sec i{width:6px;height:6px;border-radius:50%;background:hsl(var(--h,220) 66% 55%)}
  .sb-item{display:flex;align-items:center;gap:9px;width:100%;border:none;background:none;
    font-size:13px;font-weight:600;color:var(--ink);padding:9px 12px;border-radius:11px;cursor:pointer;text-align:left;
    transition:background .3s var(--ease)}
  .sb-item:hover{background:var(--fill)}
  .sb-item.on{background:var(--press)}
  .sb-item svg{width:16px;height:16px;flex:none;color:var(--gray)}
  .sb-goal{display:block;width:100%;border:none;background:none;text-align:left;cursor:pointer;
    padding:9px 12px 10px;border-radius:11px;transition:background .3s var(--ease)}
  .sb-goal:hover{background:var(--fill)}
  .sb-goal.on{background:var(--press)}
  .sb-goal .t{display:flex;justify-content:space-between;gap:8px;align-items:baseline}
  .sb-goal .t b{font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .sb-goal .t small{flex:none;font-size:10.5px;color:var(--gray);font-variant-numeric:tabular-nums}
  .sb-goal .t small.over{color:var(--red)}
  .sb-goal .bar{height:2.5px;background:var(--nest-in);border-radius:2px;margin-top:7px;overflow:hidden}
  .sb-goal .bar i{display:block;height:100%;background:var(--ink);border-radius:2px;transition:width .7s var(--ease)}
  .sb-mic{margin:14px 6px 0;width:calc(100% - 12px);display:flex;align-items:center;gap:9px;justify-content:center;
    border:none;cursor:pointer;padding:12px;border-radius:14px;background:var(--ink);color:var(--bg);
    font-size:13px;font-weight:650;transition:transform .4s var(--spring)}
  .sb-mic:active{transform:scale(.97);transition:transform .07s}
  .sb-mic svg{width:16px;height:16px}
  #content{flex-direction:row}
  main{flex:1;min-width:0;padding:40px 40px 70px}
  .screen.active{max-width:720px;margin:0 auto;width:100%}
  .large-title{font-size:29px}
  #inspector{display:block;width:352px;flex:none;overflow-y:auto;padding:44px 26px 56px;scrollbar-width:none;
    background:color-mix(in srgb,var(--surface) 34%,transparent);
    backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);
    box-shadow:inset .5px 0 0 var(--sep)}
  #inspector::-webkit-scrollbar{display:none}
  .ins-empty{color:var(--gray2);font-size:13px;text-align:center;margin-top:36vh;line-height:2}
  .cal-detail{display:none}
  .g-head:hover{background:var(--fill)}
  .m-head:hover{background:var(--fill)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

<script>

const KEY='purpose.v2';

function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.goals)return norm(Object.assign(emptyState(),d))}catch(e){}

function norm(s){
  if(!Array.isArray(s.cats))s.cats=[];
  DEFCATS.forEach(c=>{if(!s.cats.some(x=>x.id===c.id))s.cats.push({...c})});
  s.cats.forEach(c=>{if(typeof c.hue!=='number')c.hue=220});
  s.goals.forEach(g=>{if(!Array.isArray(g.miles))g.miles=[];if(!('cat'in g))g.cat=null;planOf(g)});
  return s;
}

/* ============================================================ physics */
function springLinear(stiff,damp,dur){
  const w0=Math.sqrt(stiff), z=damp/(2*Math.sqrt(stiff)), N=80, out=[];
  for(let i=0;i<=N;i++){const t=dur/1000*i/N;let x;
    if(z<1){const wd=w0*Math.sqrt(1-z*z);x=1-Math.exp(-z*w0*t)*(Math.cos(wd*t)+z*w0/wd*Math.sin(wd*t))}
    else x=1-Math.exp(-w0*t)*(1+w0*t);
    out.push(x.toFixed(4))}
  return `linear(${out.join(',')})`;
}
const SPR_POP=springLinear(320,22,620), SPR_SOFT=springLinear(300,32,440);
const rubber=(x,c=120)=>x*c/(x+c);

/* ============================================================ util */

function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');
  clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CK=s=>`<svg viewBox="0 0 24 24" width="${s||11}" height="${s||11}" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" style="color:var(--bg)"><path d="M4 12.5l5 5L20 6.5"/></svg>`;

const MICSVG='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><rect x="9" y="2.5" width="6" height="11.5" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3.5"/></svg>';
function onTap(el,fn){
  let p=null;
  el.addEventListener('pointerdown',e=>{p={x:e.clientX,y:e.clientY}});
  el.addEventListener('pointermove',e=>{if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>10)p=null});
  el.addEventListener('pointerup',e=>{if(p){p=null;fn(e)}});
  el.addEventListener('pointercancel',()=>{p=null});
}
function onLongPress(el,fn,ms){
  let t=null;
  el.addEventListener('pointerdown',()=>{t=setTimeout(fn,ms||600)});
  ['pointerup','pointermove','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(t)));
}
const catOf=g=>S.cats.find(c=>c.id===g.cat)||null;

/* ============================================================ sheet */
const sheet=document.getElementById('sheet'), sheetBody=document.getElementById('sheetBody'), dim=document.getElementById('dim');
let sheetOpen=false, sheetAnim=null;
const isDesk=()=>matchMedia('(min-width:960px)').matches;
function openSheet(build){
  sheetBody.scrollTop=0;sheetBody.replaceChildren();build(sheetBody);
  sheet.style.display='block';sheet.style.transform='';
  dim.classList.add('show');
  if(sheetAnim)sheetAnim.cancel();
  sheetAnim=sheet.animate([{transform:'translateY(105%)'},{transform:'translateY(0)'}],
    {duration:420,easing:SPR_SOFT,fill:'both'});
  sheetOpen=true;
}
function closeSheet(fromY){
  if(!sheetOpen)return;
  if(sheetAnim)sheetAnim.cancel();
  dim.classList.remove('show');
  sheetAnim=sheet.animate([{transform:`translateY(${fromY||0}px)`},{transform:'translateY(105%)'}],
    {duration:280,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'});
  sheetAnim.onfinish=()=>{sheet.style.display='none';returnSettingsNode()};
  sheetOpen=false;
}
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(vOpen)closeVoice();else closeSheet()}});
onTap(dim,()=>closeSheet());
function returnSettingsNode(){const n=document.getElementById('setNode');
  if(n&&n.parentElement===sheetBody){n.style.display='none';document.body.appendChild(n)}}
let shDrag=null;
sheet.addEventListener('pointerdown',e=>{
  if(!e.target.closest('.sh-grab'))return;
  shDrag={y0:e.clientY,t0:performance.now(),y:0,moved:false};
  if(sheetAnim)sheetAnim.cancel();
  sheet.setPointerCapture(e.pointerId);
});
sheet.addEventListener('pointermove',e=>{
  if(!shDrag)return;
  let dy=e.clientY-shDrag.y0;
  if(Math.abs(dy)>4)shDrag.moved=true;
  shDrag.y=dy;shDrag.t1=performance.now();
  sheet.style.transform=`translateY(${dy>0?dy:-rubber(-dy,60)}px)`;
});
function shEnd(){
  if(!shDrag)return;
  const dy=shDrag.y||0, dt=Math.max(1,(shDrag.t1||performance.now())-shDrag.t0), v=dy/dt, moved=shDrag.moved;
  shDrag=null;
  if(moved&&(dy>150||v>.45))closeSheet(dy);
  else{
    const from=sheet.style.transform;sheet.style.transform='';
    if(sheetAnim)sheetAnim.cancel();
    sheetAnim=sheet.animate([{transform:from||'translateY(0)'},{transform:'translateY(0)'}],
      {duration:540,easing:SPR_POP,fill:'both'});
  }
}
sheet.addEventListener('pointerup',shEnd);
sheet.addEventListener('pointercancel',shEnd);

/* ============================================================ tab bar */
const TABS=['home','cal'], TABTITLE={home:'ゴール',cal:'カレンダー'};
let curTab='home';
const lens=document.getElementById('lens'), tabbar=document.getElementById('tabbar'), navbar=document.getElementById('navbar');
const tabW=()=>navbar.classList.contains('mini')?56:84;
function lensX(x){lens.style.transform=`translateX(${x}px)`;lens.style.setProperty('--lx',(-x*.38)+'px')}
function lensTo(i){lensX(i*tabW())}
function setTab(name){
  curTab=name;
  document.querySelectorAll('.tab').forEach(x=>{
    const on=x.dataset.scr===name;
    if(on&&!x.classList.contains('active')){
      const ic=x.querySelector('svg');
      if(ic)ic.animate([{transform:'scale(1)'},{transform:'scale(1.2)'},{transform:'scale(1)'}],
        {duration:420,easing:'cubic-bezier(.32,1.6,.45,1)'});
    }
    x.classList.toggle('active',on);
  });
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-'+name).classList.add('active');
  document.getElementById('topTitle').textContent=TABTITLE[name];
  lensTo(TABS.indexOf(name));
  render();mainEl.scrollTo({top:0});syncEdge();
}
function goTab(name){
  if(sheetOpen)closeSheet();
  if(name!==curTab)setTab(name);else mainEl.scrollTo({top:0,behavior:'smooth'});
}
let drag=null;
tabbar.addEventListener('pointerdown',e=>{
  drag={x0:e.clientX,idx:TABS.indexOf(curTab),moved:false,tab:e.target.closest('.tab')};
  tabbar.setPointerCapture(e.pointerId);lens.style.scale='1.12 1.16';
});
tabbar.addEventListener('pointermove',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x0;
  if(Math.abs(dx)>12)drag.moved=true;
  if(!drag.moved)return;
  const W=tabW(), max=(TABS.length-1)*W;
  let x=drag.idx*W+dx;
  if(x<0)x=-rubber(-x,40);if(x>max)x=max+rubber(x-max,40);
  lens.style.transition='scale .35s var(--spring)';lensX(x);
});
function endDrag(e){
  if(!drag)return;
  lens.style.transition='';lens.style.scale='1 1';
  const st=drag;drag=null;const W=tabW();
  if(st.moved){
    const idx=Math.max(0,Math.min(TABS.length-1,Math.round((st.idx*W+(e.clientX-st.x0))/W)));
    if(TABS[idx]!==curTab)setTab(TABS[idx]);else lensTo(idx);
  }else{
    let name=st.tab&&st.tab.dataset.scr;
    if(!name){const rc=tabbar.getBoundingClientRect();
      name=TABS[Math.max(0,Math.min(TABS.length-1,Math.floor((e.clientX-rc.left-5)/W)))]}
    goTab(name);
  }
}
tabbar.addEventListener('pointerup',endDrag);
tabbar.addEventListener('pointercancel',()=>{lens.style.transition='';lens.style.scale='1 1';drag=null;lensTo(TABS.indexOf(curTab))});

/* refraction map (Chromium) */
(function(){
  try{
    if(!CSS.supports('backdrop-filter','url(#lensFilter)'))return;
    const W=168,H=84,c=document.createElement('canvas');c.width=W;c.height=H;
    const g=c.getContext('2d'),img=g.createImageData(W,H);
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){
      const nx=(x-W/2)/(W/2),ny=(y-H/2)/(H/2);
      const r=Math.min(1,Math.hypot(nx,ny)),k=Math.pow(r,3),i=(y*W+x)*4;
      img.data[i]=128-nx*k*127;img.data[i+1]=128-ny*k*127;img.data[i+2]=128;img.data[i+3]=255;
    }
    g.putImageData(img,0,0);
    document.getElementById('lensMap').setAttribute('href',c.toDataURL());
    document.documentElement.classList.add('refract');
  }catch(e){}
})();

/* ============================================================ render */
let expandedGoal=null, openMile=null, curCat='all';
function render(){renderChips();renderSidebar();renderHome();renderCal();renderInspector()}
const sortedGoals=()=>[...S.goals].sort((a,b)=>(a.deadline||'9999')<(b.deadline||'9999')?-1:1);
const goalTasks=g=>S.tasks.filter(t=>t.goalId===g.id);
const mileTasks=m=>S.tasks.filter(t=>t.mileId===m.id).sort((a,b)=>a.date<b.date?-1:1);
function dLabel(g){
  if(!g.deadline)return'期限なし';
  const d=dleft(g.deadline);
  if(d===0)return'<b>今日</b>が期限';
  if(d<0)return`<b>${-d}</b>日 超過`;
  return`あと<b>${d}</b>日`;
}
function setAmbient(){
  const h=curCat==='all'?222:(S.cats.find(c=>c.id===curCat)||{hue:222}).hue;
  document.documentElement.style.setProperty('--amb-h',h);
}

/* ---- category chips ---- */
function renderChips(){
  const box=document.getElementById('catChips');if(!box)return;
  const used=S.cats.filter(c=>S.goals.some(g=>g.cat===c.id));
  const un=S.goals.filter(g=>!g.cat||!S.cats.some(c=>c.id===g.cat)).length;
  let html=`<button class="chip${curCat==='all'?' on':''}" data-c="all">すべて<small>${S.goals.length}</small></button>`;
  html+=used.map(c=>`<button class="chip${curCat===c.id?' on':''}" data-c="${c.id}" style="--h:${c.hue}"><i></i>${esc(c.name)}<small>${S.goals.filter(g=>g.cat===c.id).length}</small></button>`).join('');
  if(un)html+=`<button class="chip${curCat==='none'?' on':''}" data-c="none">未分類<small>${un}</small></button>`;
  box.innerHTML=html;
  box.querySelectorAll('.chip').forEach(b=>onTap(b,()=>{
    curCat=b.dataset.c;setAmbient();renderChips();renderHome();
    b.animate([{transform:'scale(.9)'},{transform:'scale(1)'}],{duration:420,easing:SPR_POP});
  }));

}

/* ---- sidebar (desktop) ---- */
function renderSidebar(){
  const sb=document.getElementById('sbGoals');if(!sb)return;
  const groups=groupGoals(sortedGoals());
  sb.innerHTML=groups.map(gr=>{
    const rows=gr.list.map(g=>{
      const ms=g.miles||[], dn=ms.filter(m=>m.done).length;
      const dl=g.deadline?dleft(g.deadline):null;
      return `<button class="sb-goal${expandedGoal===g.id?' on':''}" data-gid="${g.id}">
        <div class="t"><b>${esc(g.title)}</b><small${dl!==null&&dl<0?' class="over"':''}>${dl===null?'':(dl<0?`+${-dl}日`:`${dl}日`)}</small></div>
        <div class="bar"><i style="width:${ms.length?dn/ms.length*100:0}%"></i></div></button>`;
    }).join('');
    return `<div class="sb-sec" style="--h:${gr.hue}">${gr.cat?'<i></i>':''}${esc(gr.name)}</div>${rows}`;
  }).join('');
  sb.querySelectorAll('.sb-goal').forEach(b=>b.onclick=()=>{
    expandedGoal=b.dataset.gid;
    if(curTab!=='home')setTab('home');else{renderHome();renderSidebar()}
    const el=document.querySelector(`.goal[data-gid="${b.dataset.gid}"]`);
    if(el)el.scrollIntoView({behavior:'smooth',block:'start'});
  });
  document.getElementById('sbCal').classList.toggle('on',curTab==='cal');
}

function groupGoals(list){
  const out=[];
  S.cats.forEach(c=>{
    const l=list.filter(g=>g.cat===c.id);
    if(l.length)out.push({cat:c,name:c.name,hue:c.hue,list:l});
  });
  const un=list.filter(g=>!g.cat||!S.cats.some(c=>c.id===g.cat));
  if(un.length)out.push({cat:null,name:'未分類',hue:220,list:un});
  return out;
}

/* ---- HOME : matryoshka ---- */
function renderHome(){
  document.getElementById('homeCap').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${WDJ[now.getDay()]}曜日`;
  const wrap=document.getElementById('goalBlocks');
  let gs=sortedGoals();
  if(curCat==='none')gs=gs.filter(g=>!g.cat||!S.cats.some(c=>c.id===g.cat));
  else if(curCat!=='all')gs=gs.filter(g=>g.cat===curCat);

  if(!S.goals.length){
    wrap.innerHTML='<div class="empty">マイクを押して<br>「電通に受かる、ってゴールを作って」<br><br>ChatGPTに「purposeのdata.jsonに入れて」でもOK。</div>';
    return;
  }
  if(!gs.length){wrap.innerHTML='<div class="empty">このカテゴリにはまだゴールがない。</div>';return}
  if(expandedGoal===null||!gs.some(g=>g.id===expandedGoal))expandedGoal=gs[0].id;

  const groups=curCat==='all'?groupGoals(gs):[{cat:null,name:'',hue:220,list:gs}];
  wrap.innerHTML=groups.map(gr=>{
    const head=curCat==='all'
      ?`<div class="catsec" style="--h:${gr.hue}">${gr.cat?'<i></i>':''}<b>${esc(gr.name)}</b><span>${gr.list.length}</span></div>`:'';
    return head+gr.list.map(goalCard).join('');
  }).join('');
  bindHome(wrap);
}

function goalCard(g){
  const ms=g.miles||[], doneN=ms.filter(m=>m.done).length, next=ms.find(m=>!m.done);
  const isOpen=expandedGoal===g.id;
  const h=hueOf(g), c=catOf(g);
  let route='';
  if(ms.length){
    const n=ms.length, pos=i=>n===1?50:(i/(n-1))*100;
    let lastDone=-1;for(let i=0;i<n;i++){if(ms[i].done)lastDone=i;else break}
    route=`<div class="g-route"><div class="g-track"></div>
      <div class="g-fill" style="width:${lastDone<0?0:pos(lastDone)}%"></div>
      ${ms.map((m,i)=>`<div class="mdot${m.done?' done':(m===next?' next':'')}" style="left:${pos(i)}%"><i></i></div>`).join('')}
    </div>
    <div class="g-sum"><em>${next?'いま：'+esc(next.title):'ぜんぶ開いた 🎉'}</em><span>${doneN}/${ms.length}</span></div>`;
  }else{
    route=`<div class="g-route"><div class="g-track"></div></div>
      <div class="g-sum"><em>中の目標がまだ無い</em></div>`;
  }

  const miles=ms.map((m,i)=>{
    const ts=mileTasks(m), dn=ts.filter(t=>t.done).length;
    const on=openMile===m.id||(openMile===null&&m===next);
    const inner=ts.length
      ?ts.map(t=>taskChip(t)).join('')
      :'<div class="m-none">タスクがまだ無い — マイクで足す</div>';
    return `<div class="mile${on?' on':''}" data-mid="${m.id}" data-gid="${g.id}">
      <div class="m-head${m.done?' done':''}">
        <div class="m-num">${m.done?CK(9):i+1}</div>
        <div class="m-title">${esc(m.title)}</div>
        ${ts.length?`<div class="m-cnt">${dn}/${ts.length}</div>`:''}
        ${CHEV}
      </div>
      <div class="m-nest"><div><div class="m-inner">${inner}</div></div></div>
    </div>`;
  }).join('');

  return `<article class="goal glass${isOpen?' open':''}" data-gid="${g.id}" style="--h:${h}">
    <div class="g-head">
      <div class="g-kick">${c?'<i></i>'+esc(c.name):'<i style="background:var(--gray2)"></i>未分類'}
        <em class="${g.deadline&&dleft(g.deadline)<0?'over':''}">${dLabel(g)}</em></div>
      <div class="g-title">${esc(g.title)}</div>
      ${route}
    </div>
    <div class="g-nest"><div>
      <div class="nest-in">
        <div class="nest-lbl">中の目標（マトリョーシカ）</div>
        ${ms.length?miles:'<div class="m-none">まだ無い — マイクで「〜を中の目標にして」</div>'}
      </div>
      <div class="g-foot">
        <button class="mic" data-act="mic">${MICSVG.replace('<svg','<svg width="14" height="14" style="vertical-align:-2px;margin-right:5px;display:inline-block"')}声で足す</button>
        <button class="plan${planCount(g)?'':' todo'}" data-act="plan">${planCount(g)?'フライトプラン':'プランを書く'}</button>
        <button data-act="open">ひらく</button>
      </div>
    </div></div>
  </article>`;
}

function taskChip(t){
  const over=t.date<TODAY&&!t.done;
  return `<div class="tk${t.done?' done':''}" data-tid="${t.id}">
    <button class="tk-del">削除</button>
    <div class="tk-slide">
      <div class="tk-c">${CK(10)}</div>
      <div class="tk-t">${esc(t.title)}</div>
      <div class="tk-d${over?' over':''}">${t.date.slice(5).replace('-','/')}</div>
    </div></div>`;
}

function bindHome(wrap){
  wrap.querySelectorAll('.goal').forEach(el=>{
    const gid=el.dataset.gid;
    onTap(el.querySelector('.g-head'),()=>{
      expandedGoal=expandedGoal===gid?null:gid;
      wrap.querySelectorAll('.goal').forEach(x=>x.classList.toggle('open',x.dataset.gid===expandedGoal));
      renderSidebar();
    });
    el.querySelectorAll('.mile').forEach(mel=>{
      onTap(mel.querySelector('.m-head'),()=>{
        const mid=mel.dataset.mid;
        openMile=openMile===mid?'__none__':mid;
        el.querySelectorAll('.mile').forEach(x=>x.classList.toggle('on',x.dataset.mid===openMile));
        if(isDesk()){selMile={gid,mid};renderInspector()}
      });
      onLongPress(mel.querySelector('.m-head'),()=>openMileSheet(gid,mel.dataset.mid),520);
    });
    el.querySelectorAll('.g-foot button').forEach(b=>onTap(b,()=>{
      const a=b.dataset.act;
      if(a==='mic')openVoice({goalId:gid});
      else if(a==='plan')openPlanSheet(gid);
      else openGoalSheet(gid);
    }));
    bindTasks(el);
  });
}

/* ---- inspector (desktop) ---- */
let selMile=null;
function inspectorMile(){
  if(selMile){
    const g=S.goals.find(x=>x.id===selMile.gid);
    const m=g&&(g.miles||[]).find(x=>x.id===selMile.mid);
    if(g&&m)return{g,m};
  }
  const g=S.goals.find(x=>x.id===expandedGoal)||sortedGoals()[0];
  if(!g)return null;
  const m=(g.miles||[]).find(x=>!x.done)||(g.miles||[])[0];
  return m?{g,m}:null;
}
function renderInspector(){
  const box=document.getElementById('inspector');
  if(!box||!isDesk())return;
  if(curTab==='cal'){
    const d=new Date(calSel+'T00:00:00');
    const dls=S.goals.filter(g=>g.deadline===calSel), ts=S.tasks.filter(t=>t.date===calSel);
    box.innerHTML=`<div class="sh-kicker">${calSel.replace(/-/g,'/')}</div>

/* ============================================================ swipe tasks */
let openRow=null;
function bindTasks(root){
  root.querySelectorAll('.tk').forEach(el=>{
    if(el.dataset.b)return;el.dataset.b=1;
    const t=S.tasks.find(x=>x.id===el.dataset.tid);if(!t)return;
    const slide=el.querySelector('.tk-slide'), delBtn=el.querySelector('.tk-del');
    let p=null;
    el.addEventListener('pointerdown',e=>{
      if(e.target===delBtn)return;
      p={x0:e.clientX,y0:e.clientY,mode:null,base:openRow===el?-88:0,t0:performance.now()};
      el.classList.add('pressed');
    });
    el.addEventListener('pointermove',e=>{
      if(!p)return;
      const dx=e.clientX-p.x0, dy=e.clientY-p.y0;
      if(!p.mode){
        if(Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){p.mode='x';el.setPointerCapture(e.pointerId);el.classList.remove('pressed')}
        else if(Math.abs(dy)>8){p=null;el.classList.remove('pressed');return}
      }
      if(p.mode==='x'){
        let x=p.base+dx;
        if(x>0)x=rubber(x,30);
        if(x<-110)x=-110-rubber(-x-110,40);
        slide.style.transform=`translateX(${x}px)`;p.x=x;p.t1=performance.now();
      }
    });
    el.addEventListener('pointerup',()=>{
      if(!p)return;
      el.classList.remove('pressed');
      const st=p;p=null;
      if(st.mode==='x'){
        const x=st.x??st.base, v=(x-st.base)/Math.max(1,(st.t1||performance.now())-st.t0);
        if(x<-96||v<-.5){doDelete(el,t);openRow=null;return}
        if(x<-44){
          if(openRow&&openRow!==el)openRow.querySelector('.tk-slide').style.transform='';
          openRow=el;
          slide.animate([{transform:`translateX(${x}px)`},{transform:'translateX(-88px)'}],{duration:460,easing:SPR_POP,fill:'both'});
          slide.style.transform='translateX(-88px)';
        }else{
          slide.animate([{transform:`translateX(${x}px)`},{transform:'translateX(0)'}],{duration:460,easing:SPR_POP,fill:'both'});
          slide.style.transform='';
          if(openRow===el)openRow=null;
        }
        return;
      }
      if(openRow){openRow.querySelector('.tk-slide').style.transform='';openRow=null;return}
      t.done=!t.done;t.u=Date.now();
      el.classList.toggle('done',t.done);
      if(t.done)el.querySelector('.tk-c').animate([{transform:'scale(1)'},{transform:'scale(1.3)'},{transform:'scale(1)'}],
        {duration:420,easing:'cubic-bezier(.32,1.6,.45,1)'});
      saveQuiet();refreshCounts(el);
    });
    el.addEventListener('pointercancel',()=>{p=null;el.classList.remove('pressed')});
    delBtn.addEventListener('click',()=>{doDelete(el,t);openRow=null});
  });
}
function refreshCounts(el){
  const mile=el.closest('.mile');if(!mile)return;
  const ts=S.tasks.filter(x=>x.mileId===mile.dataset.mid), dn=ts.filter(x=>x.done).length;
  const c=mile.querySelector('.m-cnt');if(c)c.textContent=`${dn}/${ts.length}`;
}
function doDelete(el,t){
  const slide=el.querySelector('.tk-slide'), h=el.offsetHeight;
  slide.animate([{transform:slide.style.transform||'translateX(0)'},{transform:'translateX(-105%)'}],
    {duration:260,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'});
  el.animate([{height:h+'px',opacity:1},{height:'0px',opacity:0}],
    {duration:340,delay:120,easing:'cubic-bezier(.22,.9,.28,1)',fill:'both'}).onfinish=()=>{
    S.del[t.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==t.id);persist();schedulePush();render();
  };
}

function startRec(){
  if(!SR)return;
  try{
    rec=new SR();rec.lang='ja-JP';rec.interimResults=true;rec.continuous=false;
    rec.onresult=e=>{
      let fin='',itm='';
      for(let i=e.resultIndex;i<e.results.length;i++){
        const r=e.results[i];
        if(r.isFinal)fin+=r[0].transcript;else itm+=r[0].transcript;
      }
      if(fin)vFinal+=fin;
      vText.innerHTML=esc(vFinal)+(itm?`<span class="im">${esc(itm)}</span>`:'');
    };
    rec.onerror=ev=>{vHint.textContent=ev.error==='not-allowed'?'マイクが許可されていない':'聞き取れなかった — もう一度';rec=null};
    rec.onend=()=>{rec=null;const v=vFinal.trim();if(vOpen&&v)stageConfirm(v);else if(vOpen)vHint.textContent='もう一度、丸を押して話す'};
    rec.start();

/* --- 日本語をゆるく解釈する --- */
const WD_MAP={'日':0,'月':1,'火':2,'水':3,'木':4,'金':5,'土':6};
function parseDate(s){
  let m;
  if(/明後日|あさって/.test(s))return{date:shiftDay(2),hit:/明後日|あさって/};
  if(/明日|あした|あす/.test(s))return{date:shiftDay(1),hit:/明日|あした|あす/};
  if(/今日|きょう/.test(s))return{date:TODAY,hit:/今日|きょう/};
  if((m=s.match(/(\d{1,2})\s*[\/月]\s*(\d{1,2})\s*日?/))){
    const y=now.getFullYear();
    let d=`${y}-${pad(+m[1])}-${pad(+m[2])}`;
    if(d<TODAY)d=`${y+1}-${pad(+m[1])}-${pad(+m[2])}`;
    return{date:d,hit:m[0]};
  }
  if((m=s.match(/(\d{1,2})\s*日後/)))return{date:shiftDay(+m[1]),hit:m[0]};
  if(/来週/.test(s))return{date:shiftDay(7),hit:/来週/};
  if(/今週末|週末/.test(s)){let n=6-now.getDay();if(n<=0)n+=7;return{date:shiftDay(n),hit:/今週末|週末/}}
  if((m=s.match(/(今度の|次の|来週の)?([日月火水木金土])曜/))){
    const tgt=WD_MAP[m[2]];let n=(tgt-now.getDay()+7)%7;if(n===0)n=7;
    if(m[1]==='来週の')n+=7;
    return{date:shiftDay(n),hit:m[0]};
  }
  return null;
}
function cleanTitle(s,dateHit){
  let t=s;
  if(dateHit)t=t.replace(dateHit,'');
  t=t.replace(/^[\s、,]*(までには|までに|まで|には|は|に|の|を)\s*/,'');
  t=t.replace(/^(purpose|パーパス)[にへ、,\s]*/i,'');
  t=t.replace(/(という|って)?(新しい)?(ゴール|目標|中の目標|マトリョーシカ|マイルストーン|タスク|やること)?\s*(を|に|は)?\s*(作って|つくって|追加して|足して|入れて|登録して|して|しといて|お願い)\s*[。、!！]?$/,'');
  t=t.replace(/^(ゴール|目標|中の目標|マトリョーシカ|タスク|やること)\s*[はで、:：]\s*/,'');
  t=t.replace(/[。、,\s]+$/,'').trim();
  return t||s.trim();
}
function parseSpoken(s,ctx){
  const d=parseDate(s);
  let kind='task';
  if(/(ゴール|目標)を?\s*(新しく|作|つく|追加|立て)/.test(s)||/^新しいゴール/.test(s))kind='goal';
  if(/(中の目標|マトリョーシカ|マイルストーン)/.test(s))kind='mile';
  if(/(タスク|やること|todo|トゥドゥ)/i.test(s))kind='task';
  const title=cleanTitle(s,d&&d.hit);
  // 行き先
  let goalId=ctx.goalId||expandedGoal||null, mileId=ctx.mileId||null;
  if(!mileId&&goalId&&kind==='task'){
    const g=S.goals.find(x=>x.id===goalId);
    const nx=g&&(g.miles||[]).find(m=>!m.done);
    if(nx)mileId=nx.id;
  }
  // 声の中にゴール名が出てきたらそちらを優先
  S.goals.forEach(g=>{const k=g.title.replace(/[のをにはがで]/g,'');
    if(k.length>2&&s.includes(k.slice(0,Math.min(5,k.length))))goalId=g.id});
  return{kind,title,date:(d&&d.date)||TODAY,goalId,mileId};
}

    body.querySelectorAll('#shMT .row').forEach(row=>onTap(row,()=>{

    }));

}

/* ============================================================ flight plan（ChatGPTが書く・アプリは読むと昇格だけ） */
function emptyPlan(){return{route:[],cargo:[],alt:[]}}
function planOf(g){if(!g.plan||typeof g.plan!=='object')g.plan=emptyPlan();
  ['route','cargo','alt'].forEach(k=>{if(!Array.isArray(g.plan[k]))g.plan[k]=[]});return g.plan}
function planCount(g){const p=planOf(g);return p.route.length+p.cargo.length+p.alt.length}

function renderCal(slideDir){
  document.getElementById('calTitle').textContent=`${calY}年${calM+1}月`;
  const grid=document.getElementById('calGrid');
  let html=WDJ.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  const start=new Date(calY,calM,1).getDay(), days=new Date(calY,calM+1,0).getDate();
  const prevDays=new Date(calY,calM,0).getDate(), cells=[];
  for(let i=start-1;i>=0;i--)cells.push({d:prevDays-i,dim:true,date:fmt(new Date(calY,calM-1,prevDays-i))});
  for(let d=1;d<=days;d++)cells.push({d,dim:false,date:fmt(new Date(calY,calM,d))});
  let nd=1;while(cells.length%7)cells.push({d:nd,dim:true,date:fmt(new Date(calY,calM+1,nd++))});
  const taskDates=new Set(S.tasks.map(t=>t.date));
  const openDates=new Set(S.tasks.filter(t=>!t.done).map(t=>t.date));
  const dlDates=new Set(S.goals.filter(g=>g.deadline).map(g=>g.deadline));
  html+=cells.map(c=>`<div class="cal-d${c.dim?' dim':''}${c.date===TODAY?' today':''}${c.date===calSel?' sel':''}" data-d="${c.date}">
    <span>${c.d}</span>${taskDates.has(c.date)?`<div class="dot${openDates.has(c.date)?' on':''}"></div>`:''}${dlDates.has(c.date)?'<div class="flag"></div>':''}
  </div>`).join('');
  grid.innerHTML=html;
  if(slideDir)grid.animate([{opacity:0,transform:`translateX(${slideDir*26}px)`},{opacity:1,transform:'none'}],
    {duration:420,easing:SPR_SOFT});
  grid.querySelectorAll('.cal-d').forEach(el=>onTap(el,()=>{
    calSel=el.dataset.d;renderCal();

      {duration:380,easing:'cubic-bezier(.32,1.5,.45,1)'});

  det.innerHTML=`<div class="sec-sub">${d.getMonth()+1}月${d.getDate()}日 ${WDJ[d.getDay()]}曜日</div>`
    +dls.map(g=>`<div class="cal-dl"><div class="f"></div><span>${esc(g.title)}</span><small>期限</small></div>`).join('')
    +(ts.length?ts.map(t=>taskChip(t)).join(''):(dls.length?'':'<div class="empty" style="padding:18px 0">予定はない</div>'));
  bindTasks(det);
  renderInspector();
}

/* ============================================================ merge */
function mergeState(a,b){
  const out=emptyState();
  out.del={...a.del,...b.del};
  for(const k of Object.keys(out.del))for(const src of[a.del,b.del])if(src[k]&&src[k]>out.del[k])out.del[k]=src[k];
  const pick=(la,lb)=>{
    const m=new Map();
    [...la,...lb].forEach(e=>{if(!e||!e.id)return;const ex=m.get(e.id);if(!ex||(e.u||0)>(ex.u||0))m.set(e.id,e)});
    return[...m.values()].filter(e=>!(out.del[e.id]&&out.del[e.id]>(e.u||0)));
  };
  out.goals=pick(a.goals||[],b.goals||[]);
  out.tasks=pick(a.tasks||[],b.tasks||[]);
  out.cats =pick(a.cats ||[],b.cats ||[]);
  return norm(out);
}

/* ============================================================ github sync */
const tok=()=>localStorage.getItem('purpose.token')||'';
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){
  const h={'Accept':'application/vnd.github+json',...(opt.headers||{})};
  if(tok())h['Authorization']='Bearer '+tok();
  const r=await fetch(`https://api.github.com/repos/${REPO}/${path}`,{...opt,headers:h});
  if(!r.ok&&r.status!==404)throw new Error('GitHub '+r.status);
  return r.status===404?null:r.json();
}
async function pull(){
  const j=await gh(`contents/${PATH}?ref=${BRANCH}&t=${Date.now()}`);
  if(!j)return false;
  sha=j.sha;
  let remote;try{remote=JSON.parse(b64d(j.content))}catch(e){return false}
  const before=JSON.stringify(S);
  S=mergeState(S,Object.assign(emptyState(),remote));persist();
  if(JSON.stringify(S)!==before)render();
  lastPull=Date.now();return true;
}
async function push(){
  const body={message:'update from Purpose app',content:b64e(JSON.stringify(S,null,2)),branch:BRANCH};
  if(sha)body.sha=sha;
  try{
    const j=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});
    if(j&&j.content){sha=j.content.sha;setStat('同期済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}))}
  }catch(e){
    try{await pull();body.sha=sha;body.content=b64e(JSON.stringify(S,null,2));
      const j2=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});
      if(j2&&j2.content){sha=j2.content.sha;setStat('同期済み（マージ）')}
    }catch(e2){setStat('同期エラー — 後で再試行')}
  }
}
function schedulePush(){if(!tok())return;clearTimeout(pushT);pushT=setTimeout(push,3500)}
function setStat(m){const el=document.getElementById('syncStat');if(el)el.textContent=m||''}
document.getElementById('btnSyncNow').onclick=async()=>{
  const v=document.getElementById('tokenInput').value.trim();
  if(v)localStorage.setItem('purpose.token',v);
  if(!tok()){toast('トークンを入れて');return}
  document.getElementById('tokenInput').value='';setStat('同期中…');
  try{await pull();await push();toast('同期した')}
  catch(e){setStat('接続できない — トークンを確認');toast('同期に失敗')}
};
