<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Purpose">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Purpose</title>
<style>
/* Purpose v17 — 白黒。ゴール → 中の目標 → タスク の入れ子だけ。書くのは Claude Code、私はこなす */
:root{color-scheme:light;
  --ink:#000;--ink2:#3c3c43;--gray:#8a8a8e;--gray3:#c7c7cc;--sep:#e5e5ea;--fill:#f2f2f7;--well:#fafafa;
  --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{background:#fff;color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-feature-settings:"palt";
  user-select:none;-webkit-user-select:none;overflow:hidden}
button{font-family:inherit;color:inherit;background:none;border:none;cursor:pointer}
#app{height:100dvh;display:flex;flex-direction:column;max-width:640px;margin:0 auto}
main{flex:1;min-height:0;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 22px) 20px calc(env(safe-area-inset-bottom) + 60px);
  -webkit-overflow-scrolling:touch;scrollbar-width:none;overscroll-behavior-y:contain}
main::-webkit-scrollbar{display:none}
.head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin:0 0 18px}
h1{font-size:28px;font-weight:700;letter-spacing:-.02em;line-height:1.2;margin:0}
.agent{display:flex;align-items:center;gap:9px;padding-top:6px;cursor:pointer;-webkit-user-select:none}
.agent span{font-size:13px;font-weight:600;color:var(--gray3);letter-spacing:-.01em;transition:color .25s}
.agent.on span{color:var(--ink)}
.sw{position:relative;width:51px;height:31px;border-radius:16px;background:var(--gray3);transition:background .25s;flex:none}
.sw::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 3px 8px rgba(0,0,0,.15),0 1px 1px rgba(0,0,0,.08);transition:transform .25s cubic-bezier(.32,1.3,.45,1)}
.agent.on .sw{background:var(--ink)}
.agent.on .sw::after{transform:translateX(20px)}
h1 small{display:block;font-size:12px;font-weight:500;color:var(--gray);letter-spacing:.02em;margin-top:5px;font-variant-numeric:tabular-nums}

/* 新しいゴール＝1タップで Claude Code */
#newBtn{display:flex;align-items:center;gap:12px;width:100%;padding:15px 16px;margin:0 0 22px;border-radius:14px;background:var(--ink);color:#fff;text-align:left;
  transition:transform .25s cubic-bezier(.32,1.5,.45,1)}
#newBtn:active{transform:scale(.98);transition:transform .07s}
#newBtn i{flex:none;width:26px;height:26px;border-radius:50%;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:20px;font-weight:300;font-style:normal}
#newBtn b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
#newBtn small{display:block;font-size:11.5px;opacity:.55;margin-top:1px}

/* 入れ子の行 */
.row{position:relative;overflow:hidden;touch-action:pan-y}
.sl{display:flex;align-items:center;gap:11px;min-height:50px;padding:10px 0;background:#fff;box-shadow:0 .5px 0 var(--sep);position:relative;will-change:transform}
.row.pressed .sl{background:var(--well);transition:background .06s}
.row.d1 .sl{padding-left:26px}
.row.d2 .sl{padding-left:52px}
.chk{flex:none;width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1.5px var(--gray3);display:grid;place-items:center;transition:.25s}
.chk svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.25s cubic-bezier(.32,1.5,.45,1)}
.row.done .chk{background:var(--ink);box-shadow:none}
.row.done .chk svg{opacity:1;transform:scale(1)}
.chk.goal{box-shadow:none;background:none}
.chk.goal i{width:10px;height:10px;border-radius:50%;background:var(--ink);display:block}
.chk.goal i.hollow{background:none;box-shadow:inset 0 0 0 1.5px var(--ink)}
.tt{flex:1;min-width:0}
.tt b{display:block;font-size:15.5px;font-weight:500;line-height:1.35;letter-spacing:-.01em;word-break:break-word}
.row.d0 .tt b{font-weight:600;font-size:16.5px}
.tt small{display:block;font-size:12px;color:var(--gray);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-variant-numeric:tabular-nums}
.tt small.over{color:var(--ink)}
.row.done .tt b{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--gray3)}
.go{flex:none;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;color:var(--ink);font-size:17px;transition:background .25s}
.go:active{background:var(--fill);transition:background .06s}
.chev{flex:none;width:11px;height:11px;color:var(--gray3);transition:transform .3s cubic-bezier(.32,1.5,.45,1)}
.row.open>.sl .chev{transform:rotate(90deg)}
.kids{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s cubic-bezier(.22,.9,.28,1)}
.row.open>.kids{grid-template-rows:1fr}
.kids>div{min-height:0;overflow:hidden}
.del{position:absolute;top:0;right:0;bottom:0;width:84px;background:var(--ink);color:#fff;font-size:14px;font-weight:600;display:grid;place-items:center;opacity:0}
.row.sw .del{opacity:1}
.none{font-size:13px;color:var(--gray3);padding:12px 0 12px 52px;box-shadow:0 .5px 0 var(--sep)}
.empty{color:var(--gray);font-size:15px;padding:44px 0;text-align:center;line-height:2}

/* シート */
#dim{position:fixed;inset:0;background:rgba(0,0,0,.2);z-index:14;opacity:0;pointer-events:none;transition:opacity .3s}
#dim.show{opacity:1;pointer-events:auto}
#sheet{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;z-index:15;background:#fff;border-radius:22px 22px 0 0;
  transform:translateY(105%);will-change:transform;box-shadow:0 -8px 40px rgba(0,0,0,.18);display:none}
.grab{padding:10px 0 4px;touch-action:none;cursor:grab}
.grab i{display:block;width:36px;height:5px;border-radius:3px;background:var(--gray3);margin:0 auto}
#sheetBody{max-height:80dvh;overflow-y:auto;padding:8px 22px calc(env(safe-area-inset-bottom) + 24px);scrollbar-width:none;overscroll-behavior-y:contain;-webkit-overflow-scrolling:touch}
#sheetBody::-webkit-scrollbar{display:none}
.kick{font-size:12px;color:var(--gray);margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ttl{font-size:22px;font-weight:700;margin-top:6px;line-height:1.35;letter-spacing:-.02em;word-break:break-word}
.sub{font-size:13px;color:var(--gray);margin-top:4px;font-variant-numeric:tabular-nums}
.sec{font-size:11px;font-weight:600;letter-spacing:.12em;color:var(--gray);margin:24px 0 8px}
.txt{font-size:15px;line-height:1.8;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.txt.dim{color:var(--gray3)}
.st{display:flex;align-items:center;gap:11px;padding:10px 0;box-shadow:0 .5px 0 var(--sep);font-size:15px;cursor:pointer}
.st .chk{width:20px;height:20px}
.st.done .chk{background:var(--ink);box-shadow:none}
.st.done .chk svg{opacity:1;transform:scale(1)}
.st.done span{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--gray3)}
.st span{flex:1}
.lg>div{position:relative;padding:5px 0 10px 16px;font-size:14px;line-height:1.6;color:var(--ink2);white-space:pre-wrap;word-break:break-word}
.lg>div::before{content:"";position:absolute;left:3px;top:12px;width:6px;height:6px;border-radius:50%;background:var(--gray3)}
.lg>div.ai::before{background:var(--ink)}
.lg small{display:block;font-size:11px;color:var(--gray);font-variant-numeric:tabular-nums}
.pl{padding:9px 0;box-shadow:0 .5px 0 var(--sep);font-size:14.5px;line-height:1.6}
.pl em{font-style:normal;color:var(--gray);font-size:12.5px;margin-left:6px}
.pl .h{color:var(--ink2);font-size:13.5px}
.btn{display:block;width:100%;padding:15px;border-radius:14px;font-size:15.5px;font-weight:600;letter-spacing:-.01em;margin-top:26px;background:var(--ink);color:#fff;
  transition:transform .25s cubic-bezier(.32,1.5,.45,1)}
.btn:active{transform:scale(.97);transition:transform .07s}
.btn.plain{background:var(--fill);color:var(--ink);margin-top:8px}
.btn.danger{background:none;color:var(--gray);font-weight:500;font-size:13.5px;margin-top:6px;padding:12px}
.btn.danger.arm{color:#000;font-weight:600}
.setwrap p{font-size:13px;color:var(--gray);line-height:1.8;margin:8px 0 10px}
.setwrap input{width:100%;border:none;background:var(--fill);border-radius:12px;font-family:ui-monospace,monospace;font-size:16px;padding:12px;outline:none;margin-bottom:8px;color:var(--ink);user-select:text;-webkit-user-select:text}
.stat{font-size:12px;color:var(--gray);margin-top:10px;line-height:1.7}
#toast{position:fixed;top:calc(env(safe-area-inset-top) + 14px);left:50%;transform:translateX(-50%) translateY(-90px);z-index:30;padding:11px 20px;font-size:13.5px;font-weight:600;
  border-radius:999px;background:var(--ink);color:#fff;transition:.4s cubic-bezier(.32,1.5,.45,1);white-space:nowrap;max-width:90vw;overflow:hidden;text-overflow:ellipsis}
#toast.show{transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
<main id="main">
  <div class="head"><h1 id="h1">Purpose<small id="cap"></small></h1><div class="agent" id="agent" role="switch"><span>Codex</span><div class="sw"></div></div></div>
  <button id="newBtn"><i>＋</i><div><b>新しいゴール</b><small id="newSub">Claude Code が開く。答えるだけ。</small></div></button>
  <div id="tree"></div>
</main>
</div>
<div id="dim"></div>
<div id="sheet"><div class="grab"><i></i></div><div id="sheetBody"></div></div>
<div id="setNode" class="setwrap" style="display:none">
  <div class="ttl">設定</div>
  <p>正データは GitHub の data.json。Claude Code が書き、ここは表示するだけ。アプリからのチェックを書き戻すにはトークンを一度だけ保存。</p>
  <input type="password" id="tokenInput" placeholder="GitHub token（Contents: Read/Write）" autocomplete="off">
  <p>作業場（リポジトリ）のパス。Claude Code を開く時に渡す。</p>
  <input type="text" id="repoInput" placeholder="~/Downloads/claude box/_作業ファイル/purpose" autocomplete="off">
  <button class="btn" id="btnSave">保存して同期</button>
  <div class="stat" id="syncStat"></div>
</div>
<div id="toast"></div>

<script>
/* ============================================================ state（v16 と同じ data.json） */
const KEY='purpose.v2';
const REPO='gjnzqqf8dq-coder/purpose', PATH='data.json', BRANCH='main';
const COLS=['cats','goals','tasks'];
const emptyState=()=>({cats:[],goals:[],tasks:[],del:{}});
let S=load(), sha=null, pushT=null, lastPull=0;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.goals)return norm(Object.assign(emptyState(),d))}catch(e){}return norm(emptyState())}
function norm(s){
  COLS.forEach(k=>{if(!Array.isArray(s[k]))s[k]=[]});
  if(!s.del||typeof s.del!=='object')s.del={};
  s.goals.forEach(g=>{if(!Array.isArray(g.miles))g.miles=[];if(typeof g.criteria!=='string')g.criteria='';
    if(!g.plan||typeof g.plan!=='object')g.plan={route:[],cargo:[],alt:[]};['route','cargo','alt'].forEach(k=>{if(!Array.isArray(g.plan[k]))g.plan[k]=[]})});
  s.tasks.forEach(t=>{if(!t.date)t.date=null;if(typeof t.criteria!=='string')t.criteria='';if(!Array.isArray(t.steps))t.steps=[];if(!Array.isArray(t.log))t.log=[]});
  return s;
}
function persist(){localStorage.setItem(KEY,JSON.stringify(S))}
function save(){persist();schedulePush();render()}
function saveQuiet(){persist();schedulePush()}
const repoPath=()=>localStorage.getItem('purpose.repo')||'~/Downloads/claude box/_作業ファイル/purpose';

/* ============================================================ util */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(), TODAY=fmt(now);
const WDJ=['日','月','火','水','木','金','土'];
const dleft=dl=>Math.round((new Date(dl+'T00:00:00')-new Date(TODAY+'T00:00:00'))/864e5);
const fmtT=ms=>{const d=new Date(ms);return`${d.getMonth()+1}/${d.getDate()} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const md=s=>s?s.slice(5).replace('-','/'):'';
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
const CK='<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg>';
const CHEV='<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg>';
let toastT;function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2400)}
async function copyText(s){try{await navigator.clipboard.writeText(s);return true}catch(e){const ta=document.createElement('textarea');ta.value=s;ta.style.position='fixed';ta.style.opacity=0;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();return ok}}
function onTap(el,fn){let p=null;
  el.addEventListener('pointerdown',e=>{p={x:e.clientX,y:e.clientY}});
  el.addEventListener('pointermove',e=>{if(p&&Math.hypot(e.clientX-p.x,e.clientY-p.y)>10)p=null});
  el.addEventListener('pointerup',e=>{if(p){p=null;fn(e)}});
  el.addEventListener('pointercancel',()=>{p=null})}
function onLongPress(el,fn,ms){let t=null;
  el.addEventListener('pointerdown',()=>{t=setTimeout(fn,ms||550)});
  ['pointerup','pointermove','pointercancel','pointerleave'].forEach(ev=>el.addEventListener(ev,()=>clearTimeout(t)))}
const goalOf=id=>S.goals.find(g=>g.id===id)||null;
const taskOf=id=>S.tasks.find(t=>t.id===id)||null;
const mileTasks=m=>S.tasks.filter(t=>t.mileId===m.id).sort((a,b)=>(a.done-b.done)||((a.date||'9999')<(b.date||'9999')?-1:1));
const goalDone=g=>(g.miles||[]).length>0&&g.miles.every(m=>m.done);
const sortedGoals=()=>[...S.goals].sort((a,b)=>(goalDone(a)-goalDone(b))||((a.deadline||'9999')<(b.deadline||'9999')?-1:1));

/* ============================================================ Claude Code へ（1タップ） */
const WS=()=>`作業場：${repoPath()}（正データ data.json）。まず ${isCodex()?'AGENTS.md':'CLAUDE.md'} を読み、その規律に従う。`;
function chain(kind,g,m,t){
  const ms=g.miles||[];
  const L=[`## ゴール「${g.title}」（id ${g.id}）`,`- 期限 ${g.deadline||'なし'}`,`- 完了の基準：${g.criteria||'（未定）'}`,g.note?`- メモ：${g.note}`:'',
    `- 中の目標：${ms.length?ms.map((x,i)=>`${i+1}.${x.done?'✓':'○'}${x.title}`).join(' ／ '):'なし'}`];
  const p=g.plan;
  if(p.route.length)L.push(`- 通る道：${p.route.map(r=>r.title+(r.when?'（'+r.when+'）':'')).join(' → ')}`);
  if(p.cargo.length)L.push(`- 要るもの：${p.cargo.map(c=>c.title+(c.due?'（'+c.due+'）':'')).join('／')}`);
  if(p.alt.length)L.push(`- 分かれ道：${p.alt.map(a=>`もし${a.cond}なら${a.risk}→${a.hedge}`).join('／')}`);
  const tl=x=>`  - ${x.done?'✓':'○'}${x.title}（${x.date||'未定'}）${x.criteria?' 基準:'+x.criteria:''}${x.steps.length?' 手順:'+x.steps.map(s=>(s.done?'✓':'○')+s.title).join('/'):''}${x.log.length?' 直近:'+x.log[x.log.length-1].text:''}`;
  if(kind==='goal'){L.push('- タスク：');ms.forEach(x=>{const ts=mileTasks(x);if(ts.length)L.push(`  ▸ ${x.title}`,...ts.map(tl))})}
  if(kind==='mile'){const ts=mileTasks(m);L.push(`\n## 中の目標「${m.title}」（id ${m.id}）${m.done?'（達成済）':''}`,'- タスク：',...(ts.length?ts.map(tl):['  （まだ無い）']))}
  if(kind==='task'){if(m)L.push(`\n## 中の目標「${m.title}」（id ${m.id}）`,'- 同じ中の目標のタスク：',...mileTasks(m).map(tl));
    L.push(`\n## タスク「${t.title}」（id ${t.id}）`,`- 期日 ${t.date||'未定'}／${t.done?'完了':'未完了'}`,`- 完了の基準：${t.criteria||'（未定 → まず私と決めて書く）'}`,
      `- ステップ：${t.steps.length?t.steps.map((s,i)=>`${i+1}.${s.done?'✓':'○'}${s.title}`).join(' ／ '):'なし（3〜5個に分ける）'}`,
      `- ログ（新しい順）：${t.log.length?'\n  '+t.log.slice(-8).reverse().map(l=>`[${fmtT(l.t)}${l.who==='ai'?' AI':''}] ${l.text}`).join('\n  '):'なし'}`)}
  const others=sortedGoals().filter(x=>x.id!==g.id);
  if(others.length)L.push(`\n## 他のゴール（参考）\n${others.map(x=>`- ${x.title}（${x.deadline||'期限なし'}）`).join('\n')}`);
  return L.filter(Boolean).join('\n');
}
function promptNew(){return `Purpose で新しいゴールを立てたい。
${WS()}
${S.goals.length?'\n## いまあるゴール\n'+sortedGoals().map(x=>`- ${x.title}（${x.deadline||'期限なし'}／${(x.miles||[]).filter(m=>m.done).length}/${(x.miles||[]).length}）`).join('\n')+'\n':''}
進め方
1. すぐに逆質問から始める（最初の質問：「いま一番達成したい状態は？ いつまでに、どうなっていたいか」）。CLAUDE.md の「壁打ちプロトコル」に従い、質問は一度に1つ。解像度が100%になるまで終わらない
   100% ＝ 目標の構造が分解され、定量的な達成条件が決まり、末端の「次にやること」が AI がそのまま実行できる粒度まで書けている状態
2. 100%になったら、ゴール → 中の目標（3〜5）→ 日付つきタスク（完了の基準・ステップつき）→ フライトプラン を data.json に入れ子で書く
3. git add data.json && git commit && git push で反映。私はアプリでこなすだけ`}
function promptFor(kind,g,m,t){
  if(kind==='goal')return `Purpose のゴール「${g.title}」を、私と一緒に進めてください。
${WS()}

${chain('goal',g)}

進め方
1. 上の文脈は全部読んだ前提で始める（前段階を聞き直さない）。足りない情報だけ data.json を読む
2. 完了の基準が曖昧なら、CLAUDE.md の「壁打ちプロトコル」で私と擦り合わせてから書く
3. 理想（完了の基準）と現在地の差分から次の一手を決め、末端が「AIがそのまま実行できる粒度」になるまで中の目標・タスクを足す（タスクは日付つき）
4. 実行できることは自分で実行する（調べる・下書く・作る・ファイルを開く）。めんどうな所は逆質問で私の判断だけを取る
5. 進めたら tasks[].log と steps の done を更新、完了の基準に届いたものは done:true。note に決めたことを足し、push。報告は3行`;
  if(kind==='mile')return `Purpose のゴール「${g.title}」の中の目標「${m.title}」を、私と一緒に進めてください。
${WS()}

${chain('mile',g,m)}

進め方
1. 上の文脈は全部読んだ前提で始める。足りない情報だけ data.json を読む
2. この中の目標の完了の基準を確認し、タスクが無ければ「AIがそのまま実行できる粒度」で2〜4個に分けて data.json に書く（日付つき・完了の基準つき）
3. 実行できるタスクは自分で実行し、私の判断が要る所だけ逆質問する（質問は1つずつ）
4. 進めたら tasks[].log と steps を更新、完了したタスクは done:true、全部終わったら miles[].done を true にして push。報告は3行`;
  return `Purpose のタスク「${t.title}」を、私と一緒にこなしてください。
${WS()}

${g?chain('task',g,m,t):`## タスク「${t.title}」（id ${t.id}／ゴール未設定）\n- 期日 ${t.date||'未定'}\n- 完了の基準：${t.criteria||'（未定）'}`}

進め方
1. 上の文脈は全部読んだ前提で始める（前段階を聞き直さない）。ゴールを見失わない
2. 完了の基準が空なら、私と決めてから data.json に書く。ステップが無ければ「そのまま実行できる粒度」で3〜5個に分ける
3. 自分で実行できることは実行する（調べる・下書く・作る・Notionやファイルを見る）。めんどうな所は「良い◯◯の条件は？」のように逆質問で私の判断だけを取る
4. 進めたら steps の done と log（who:"ai"）を更新。完了の基準に届いたら done:true にして push（アプリのチェックが付く）。報告は3行`;
}
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const isCodex=()=>localStorage.getItem('purpose.agent')==='codex';
const agentName=()=>isCodex()?'Codex':'Claude Code';
function syncAgent(){document.getElementById('agent').classList.toggle('on',isCodex());
  const s=document.getElementById('newSub');if(s)s.textContent=`${agentName()} が開く。答えるだけ。`}
document.getElementById('agent').onclick=()=>{localStorage.setItem('purpose.agent',isCodex()?'claude':'codex');syncAgent();toast(agentName()+' に切り替えた')};
function launch(p){
  copyText(p);
  if(isIOS){toast(`指示文をコピーした。Mac の ${agentName()} に貼る`);return}
  location.href=(isCodex()?'codex://new?prompt=':'claude://code/new?q=')+encodeURIComponent(p);
  toast(agentName()+' を開く');
}

/* ============================================================ render（入れ子） */
const open=new Set();
function render(){
  document.getElementById('cap').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${WDJ[now.getDay()]}曜日`;
  const tree=document.getElementById('tree');
  const gs=sortedGoals();
  tree.innerHTML=gs.map(g=>{
    const ms=g.miles||[], next=ms.find(x=>!x.done), gd=goalDone(g), dl=g.deadline?dleft(g.deadline):null;
    const sub=gd?'達成':(next?'いま：'+esc(next.title):(ms.length?'':'中の目標なし'))+(dl!==null?(next||!ms.length?'　':'')+(dl<0?`${-dl}日超過`:dl===0?'今日':`あと${dl}日`):'');
    const kids=ms.length?ms.map((m,i)=>{
      const ts=mileTasks(m), dn=ts.filter(x=>x.done).length;
      const tk=ts.length?ts.map(t=>taskRow(t,2)).join('')
        :'<div class="none">タスクなし — ✦ で分けてもらう</div>';
      return `<div class="row d1${m.done?' done':''}${open.has(m.id)?' open':''}" data-m="${m.id}" data-g="${g.id}"><div class="sl"><button class="chk" data-a="chk">${CK}</button><div class="tt"><b>${esc(m.title)}</b>${ts.length?`<small>${dn}/${ts.length}</small>`:''}</div><button class="go" data-a="ai">✦</button>${CHEV}</div><div class="kids"><div>${tk}</div></div></div>`;
    }).join(''):'<div class="none" style="padding-left:26px">中の目標なし — ✦ で分解してもらう</div>';
    const loose=S.tasks.filter(t=>t.goalId===g.id&&!(ms.some(x=>x.id===t.mileId))).sort((a,b)=>(a.done-b.done)||((a.date||'9999')<(b.date||'9999')?-1:1));
    const looseH=loose.map(t=>taskRow(t,1)).join('');
    return `<div class="row d0${gd?' done':''}${open.has(g.id)?' open':''}" data-g="${g.id}"><div class="sl"><div class="chk goal"><i class="${gd?'':'hollow'}"></i></div><div class="tt"><b>${esc(g.title)}</b><small class="${dl!==null&&dl<0&&!gd?'over':''}">${sub}</small></div><button class="go" data-a="ai">✦</button>${CHEV}</div><div class="kids"><div>${kids}${looseH}</div></div></div>`;
  }).join('');
  const orphan=S.tasks.filter(t=>!t.goalId||!goalOf(t.goalId)).sort((a,b)=>(a.done-b.done)||((a.date||'9999')<(b.date||'9999')?-1:1));
  if(!gs.length&&!orphan.length){tree.innerHTML='<div class="empty">まだ無い。上のボタンから。</div>';return}
  if(orphan.length)tree.innerHTML+=`<div class="row d0 open" data-g=""><div class="sl"><div class="chk goal"><i class="hollow" style="opacity:.35"></i></div><div class="tt"><b style="color:var(--gray)">ゴールなし</b><small>${orphan.length}</small></div></div><div class="kids"><div>${orphan.map(t=>taskRow(t,1)).join('')}</div></div></div>`;
  bind(tree);
}
function taskRow(t,d){const over=t.date&&t.date<TODAY&&!t.done;
  return `<div class="row d${d}${t.done?' done':''}" data-t="${t.id}"><button class="del">削除</button><div class="sl"><button class="chk" data-a="chk">${CK}</button><div class="tt"><b>${esc(t.title)}</b>${t.date||t.steps.length?`<small class="${over?'over':''}">${t.date?md(t.date):''}${t.steps.length?(t.date?'　':'')+t.steps.filter(s=>s.done).length+'/'+t.steps.length:''}</small>`:''}</div><button class="go" data-a="ai">✦</button></div></div>`}
function bind(root){
  root.querySelectorAll('.row').forEach(el=>{
    if(el.dataset.b)return;el.dataset.b=1;
    const sl=el.querySelector(':scope>.sl'), gid=el.dataset.g;
    const t=el.dataset.t?taskOf(el.dataset.t):null;
    const g=goalOf(gid)||(t?goalOf(t.goalId):null);
    const m=el.dataset.m&&g?g.miles.find(x=>x.id===el.dataset.m):null;
    const kind=t?'task':m?'mile':'goal';
    const mOfT=t&&g?g.miles.find(x=>x.id===t.mileId):null;
    const ai=sl.querySelector('[data-a="ai"]');
    if(ai)ai.onclick=e=>{e.stopPropagation();launch(kind==='task'?promptFor('task',g,mOfT,t):kind==='mile'?promptFor('mile',g,m):promptFor('goal',g))};
    const chk=sl.querySelector('[data-a="chk"]');
    if(chk)chk.onclick=e=>{e.stopPropagation();
      if(t){t.done=!t.done;t.u=Date.now();el.classList.toggle('done',t.done)}
      else{m.done=!m.done;g.u=Date.now();el.classList.toggle('done',m.done)}
      saveQuiet();setTimeout(render,320)};
    /* タップ：ゴール／中の目標は開閉、タスクは詳細。長押し：詳細（削除はここ） */
    let p=null;
    sl.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;p={x0:e.clientX,y0:e.clientY,mode:null,t0:performance.now()};el.classList.add('pressed')});
    sl.addEventListener('pointermove',e=>{if(!p)return;const dx=e.clientX-p.x0,dy=e.clientY-p.y0;
      if(!p.mode){if(t&&Math.abs(dx)>8&&Math.abs(dx)>Math.abs(dy)){p.mode='x';el.classList.add('sw');try{sl.setPointerCapture(e.pointerId)}catch(_){}el.classList.remove('pressed')}
        else if(Math.abs(dx)>8||Math.abs(dy)>8){p=null;el.classList.remove('pressed');return}}
      if(p.mode==='x'){let x=Math.min(0,dx);if(x<-108)x=-108-(-(x+108))*.3;sl.style.transform=`translateX(${x}px)`;p.x=x}});
    sl.addEventListener('pointerup',()=>{if(!p)return;el.classList.remove('pressed');const st=p;p=null;
      if(st.mode==='x'){if((st.x||0)<-70){del(el,t)}else{sl.style.transform='';setTimeout(()=>el.classList.remove('sw'),300)}return}
      if(t){openTask(t.id);return}
      if(!g)return;
      const id=m?m.id:g.id;open.has(id)?open.delete(id):open.add(id);el.classList.toggle('open')});
    sl.addEventListener('pointercancel',()=>{p=null;el.classList.remove('pressed')});
    onLongPress(sl,()=>{if(t)openTask(t.id);else if(m)openMile(g,m);else if(g)openGoal(g)});
    const d=el.querySelector(':scope>.del');if(d)d.onclick=()=>del(el,t);
  });
}
function del(el,t){
  el.animate([{height:el.offsetHeight+'px',opacity:1},{height:'0px',opacity:0}],{duration:280,easing:'cubic-bezier(.22,.9,.28,1)',fill:'both'}).onfinish=()=>{
    S.del[t.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==t.id);save()};
}

/* ============================================================ sheet */
const sheet=document.getElementById('sheet'), sheetBody=document.getElementById('sheetBody'), dim=document.getElementById('dim');
let sheetOpen=false, anim=null;
function openSheet(build){sheetBody.scrollTop=0;sheetBody.replaceChildren();build(sheetBody);sheet.style.display='block';sheet.style.transform='';dim.classList.add('show');
  if(anim)anim.cancel();anim=sheet.animate([{transform:'translateY(105%)'},{transform:'translateY(0)'}],{duration:380,easing:'cubic-bezier(.22,.9,.28,1)',fill:'both'});sheetOpen=true}
function closeSheet(fromY){if(!sheetOpen)return;if(anim)anim.cancel();dim.classList.remove('show');
  anim=sheet.animate([{transform:`translateY(${fromY||0}px)`},{transform:'translateY(105%)'}],{duration:260,easing:'cubic-bezier(.4,0,.7,1)',fill:'both'});
  anim.onfinish=()=>{sheet.style.display='none';const n=document.getElementById('setNode');if(n.parentElement===sheetBody){n.style.display='none';document.body.appendChild(n)}};sheetOpen=false}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeSheet()});
onTap(dim,()=>closeSheet());
let sd=null;
sheet.addEventListener('pointerdown',e=>{if(!e.target.closest('.grab'))return;sd={y0:e.clientY,y:0,moved:false};if(anim)anim.cancel();try{sheet.setPointerCapture(e.pointerId)}catch(_){}});
sheet.addEventListener('pointermove',e=>{if(!sd)return;const dy=e.clientY-sd.y0;if(Math.abs(dy)>4)sd.moved=true;sd.y=dy;sheet.style.transform=`translateY(${Math.max(0,dy)}px)`});
const sEnd=()=>{if(!sd)return;const dy=sd.y,mv=sd.moved;sd=null;if(mv&&dy>120)closeSheet(dy);else{sheet.style.transform='';if(anim)anim.cancel();anim=sheet.animate([{transform:`translateY(${dy}px)`},{transform:'translateY(0)'}],{duration:320,easing:'cubic-bezier(.32,1.5,.45,1)',fill:'both'})}};
sheet.addEventListener('pointerup',sEnd);sheet.addEventListener('pointercancel',sEnd);
const armDel=(btn,label,fn)=>{btn.onclick=()=>{if(!btn.classList.contains('arm')){btn.classList.add('arm');btn.textContent='本当に削除する';setTimeout(()=>{btn.classList.remove('arm');btn.textContent=label},2600);return}fn()}};

function openTask(tid){const t=taskOf(tid);if(!t)return;const g=goalOf(t.goalId),m=g&&g.miles.find(x=>x.id===t.mileId);
  openSheet(body=>{
    body.innerHTML=`<div class="kick">${g?esc(g.title):''}${m?' › '+esc(m.title):''}</div><div class="ttl">${esc(t.title)}</div><div class="sub">${t.date?t.date.replace(/-/g,'/'):'期日なし'}${t.done?'　完了':''}</div>
      <div class="sec">完了の基準</div><div class="txt${t.criteria?'':' dim'}">${t.criteria?esc(t.criteria):'まだ無い — ✦ で決めてもらう'}</div>
      <div class="sec">ステップ</div>${t.steps.length?t.steps.map(s=>`<div class="st${s.done?' done':''}" data-s="${s.id}"><div class="chk">${CK}</div><span>${esc(s.title)}</span></div>`).join(''):'<div class="txt dim">まだ無い</div>'}
      ${t.log.length?`<div class="sec">ログ</div><div class="lg">${t.log.slice().reverse().map(l=>`<div class="${l.who==='ai'?'ai':''}"><small>${fmtT(l.t)}${l.who==='ai'?' · Claude':''}</small>${esc(l.text)}</div>`).join('')}</div>`:''}
      <button class="btn" id="bAI">✦ ${agentName()} で進める</button>
      <button class="btn plain" id="bDone">${t.done?'未完了に戻す':'完了にする'}</button>
      <button class="btn danger" id="bDel">削除</button>`;
    body.querySelectorAll('.st').forEach(r=>onTap(r,()=>{const s=t.steps.find(x=>x.id===r.dataset.s);s.done=!s.done;r.classList.toggle('done',s.done);t.u=Date.now();saveQuiet();render()}));
    body.querySelector('#bAI').onclick=()=>{launch(promptFor('task',g,m,t));closeSheet()};
    body.querySelector('#bDone').onclick=()=>{t.done=!t.done;t.u=Date.now();closeSheet();save()};
    armDel(body.querySelector('#bDel'),'削除',()=>{S.del[t.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==t.id);closeSheet();save()});
  })}
function openMile(g,m){openSheet(body=>{const ts=mileTasks(m);
    body.innerHTML=`<div class="kick">${esc(g.title)}</div><div class="ttl">${esc(m.title)}</div><div class="sub">${m.done?'達成':ts.length?`${ts.filter(x=>x.done).length}/${ts.length} 完了`:'タスクなし'}</div>
      <button class="btn" id="bAI">✦ ${agentName()} で進める</button>
      <button class="btn plain" id="bDone">${m.done?'未達成に戻す':'達成にする'}</button>
      <button class="btn danger" id="bDel">中の目標を削除</button>`;
    body.querySelector('#bAI').onclick=()=>{launch(promptFor('mile',g,m));closeSheet()};
    body.querySelector('#bDone').onclick=()=>{m.done=!m.done;g.u=Date.now();closeSheet();save()};
    armDel(body.querySelector('#bDel'),'中の目標を削除',()=>{g.miles=g.miles.filter(x=>x.id!==m.id);g.u=Date.now();S.tasks.forEach(t=>{if(t.mileId===m.id){t.mileId=null;t.u=Date.now()}});closeSheet();save()});
  })}
function openGoal(g){openSheet(body=>{const p=g.plan;
    body.innerHTML=`<div class="kick">ゴール</div><div class="ttl">${esc(g.title)}</div><div class="sub">${g.deadline?g.deadline.replace(/-/g,'/')+'　'+(dleft(g.deadline)<0?`${-dleft(g.deadline)}日超過`:`あと${dleft(g.deadline)}日`):'期限なし'}</div>
      <div class="sec">完了の基準</div><div class="txt${g.criteria?'':' dim'}">${g.criteria?esc(g.criteria):'まだ無い — ✦ で決めてもらう'}</div>
      ${g.note?`<div class="sec">メモ</div><div class="txt">${esc(g.note)}</div>`:''}
      ${p.route.length?`<div class="sec">通る道</div>${p.route.map((r,i)=>`<div class="pl">${i+1}. ${esc(r.title)}${r.when?`<em>${esc(r.when)}</em>`:''}</div>`).join('')}`:''}
      ${p.cargo.length?`<div class="sec">要る人・モノ・お金</div>${p.cargo.map(c=>`<div class="pl">${esc(c.title)}${c.due?`<em>${md(c.due)}</em>`:''}</div>`).join('')}`:''}
      ${p.alt.length?`<div class="sec">分かれ道</div>${p.alt.map(a=>`<div class="pl">もし${esc(a.cond)}なら → ${esc(a.risk)}<div class="h">一手：${esc(a.hedge)}</div></div>`).join('')}`:''}
      <button class="btn" id="bAI">✦ ${agentName()} で進める</button>
      <button class="btn danger" id="bDel">ゴールを削除</button>`;
    body.querySelector('#bAI').onclick=()=>{launch(promptFor('goal',g));closeSheet()};
    armDel(body.querySelector('#bDel'),'ゴールを削除',()=>{S.del[g.id]=Date.now();S.goals=S.goals.filter(x=>x.id!==g.id);S.tasks.forEach(t=>{if(t.goalId===g.id){t.goalId=null;t.mileId=null;t.u=Date.now()}});closeSheet();save()});
  })}
document.getElementById('newBtn').onclick=()=>launch(promptNew());
onLongPress(document.getElementById('h1'),()=>openSheet(body=>{const n=document.getElementById('setNode');n.style.display='block';document.getElementById('repoInput').value=localStorage.getItem('purpose.repo')||'';body.appendChild(n)}));

/* ============================================================ sync（GitHub data.json） */
function mergeState(a,b){const out=emptyState();out.del={...a.del,...b.del};
  for(const k of Object.keys(out.del))for(const src of[a.del,b.del])if(src[k]&&src[k]>out.del[k])out.del[k]=src[k];
  const pick=(la,lb)=>{const m=new Map();[...la,...lb].forEach(e=>{if(!e||!e.id)return;const ex=m.get(e.id);if(!ex||(e.u||0)>(ex.u||0))m.set(e.id,e)});return[...m.values()].filter(e=>!(out.del[e.id]&&out.del[e.id]>(e.u||0)))};
  COLS.forEach(k=>{out[k]=pick(a[k]||[],b[k]||[])});return norm(out)}
const tok=()=>localStorage.getItem('purpose.token')||'';
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){const h={'Accept':'application/vnd.github+json',...(opt.headers||{})};if(tok())h['Authorization']='Bearer '+tok();
  const r=await fetch(`https://api.github.com/repos/${REPO}/${path}`,{...opt,headers:h});if(!r.ok&&r.status!==404)throw new Error('GitHub '+r.status);return r.status===404?null:r.json()}
async function pull(){const j=await gh(`contents/${PATH}?ref=${BRANCH}&t=${Date.now()}`);if(!j)return false;sha=j.sha;
  let remote;try{remote=JSON.parse(b64d(j.content))}catch(e){return false}
  const before=JSON.stringify(S);S=mergeState(S,Object.assign(emptyState(),remote));persist();if(JSON.stringify(S)!==before)render();lastPull=Date.now();return true}
async function push(){const body={message:'update from Purpose app',content:b64e(JSON.stringify(S,null,2)),branch:BRANCH};if(sha)body.sha=sha;
  try{const j=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});if(j&&j.content){sha=j.content.sha;setStat('同期済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}))}}
  catch(e){try{await pull();body.sha=sha;body.content=b64e(JSON.stringify(S,null,2));const j2=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});if(j2&&j2.content){sha=j2.content.sha;setStat('同期済み（マージ）')}}catch(e2){setStat('同期エラー — 後で再試行')}}}
function schedulePush(){if(!tok())return;clearTimeout(pushT);pushT=setTimeout(push,3500)}
function setStat(m){const el=document.getElementById('syncStat');if(el)el.textContent=m||''}
document.getElementById('btnSave').onclick=async()=>{const v=document.getElementById('tokenInput').value.trim();if(v)localStorage.setItem('purpose.token',v);
  const rp=document.getElementById('repoInput').value.trim();if(rp)localStorage.setItem('purpose.repo',rp);
  if(!tok()){toast(rp?'パスを保存した':'トークンを入れて');return}
  document.getElementById('tokenInput').value='';setStat('同期中…');try{await pull();await push();toast('同期した')}catch(e){setStat('接続できない — トークンを確認');toast('同期に失敗')}};

/* ============================================================ boot */
syncAgent();render();
pull().then(ok=>{if(tok())setStat(ok?'同期済み（読み書き）':'リモート未作成')}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&Date.now()-lastPull>60000)pull().catch(()=>{})});
setInterval(()=>{if(document.visibilityState==='visible'&&Date.now()-lastPull>90000)pull().catch(()=>{})},30000);
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
window.__tap=sel=>{const el=document.querySelector(sel);if(!el)return'no:'+sel;const r=el.getBoundingClientRect(),x=r.left+r.width/2,y=r.top+r.height/2;
  ['pointerdown','pointerup'].forEach(t=>el.dispatchEvent(new PointerEvent(t,{bubbles:true,clientX:x,clientY:y,pointerId:1})));el.dispatchEvent(new MouseEvent('click',{bubbles:true,clientX:x,clientY:y}));return'ok'};
</script>
