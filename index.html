<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ffffff">
<meta name="apple-mobile-web-app-title" content="Purpose">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-512.png">
<title>Purpose</title>
<style>
  :root{
    --bg:#ffffff;
    --ink:#000000;
    --gray:#8e8e93;          /* iOS systemGray */
    --gray2:#c7c7cc;
    --sep:rgba(60,60,67,.18);
    --fill:#f2f2f7;          /* iOS systemGroupedBackground */
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Display","SF Pro Text","Hiragino Sans","Noto Sans JP",sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;touch-action:manipulation}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:var(--font);overflow:hidden;-webkit-font-smoothing:antialiased;font-feature-settings:"palt"}

  #app{position:relative;height:100dvh;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
  main{flex:1;overflow-y:auto;padding:calc(env(safe-area-inset-top) + 24px) 20px 130px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  main::-webkit-scrollbar{display:none}
  .screen{display:none}
  .screen.active{display:block;animation:fade .25s ease}
  @keyframes fade{from{opacity:0}to{opacity:1}}

  /* ============ iOS type scale ============ */
  .caption{font-size:13px;color:var(--gray);font-weight:400;letter-spacing:.01em}
  .large-title{font-size:34px;font-weight:700;letter-spacing:.01em;line-height:1.2;margin:2px 0 4px}
  .navrow{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:22px}
  .navbtn{border:none;background:none;font-family:inherit;font-size:17px;color:var(--ink);cursor:pointer;padding:6px 0 6px 16px;font-weight:400}
  .navbtn.bold{font-weight:600}

  .sec-h{display:flex;align-items:center;justify-content:space-between;margin:26px 0 2px}
  .sec-h h2{font-size:22px;font-weight:600;letter-spacing:.01em}
  .sec-h .more{border:none;background:none;font-family:inherit;font-size:15px;color:var(--gray);cursor:pointer;display:flex;align-items:center;gap:2px;padding:4px 0}
  .sec-h .more svg{width:12px;height:12px}
  .sec-sub{font-size:13px;color:var(--gray);margin:14px 0 0;font-weight:400}

  /* ============ goal rows (alarm-style) ============ */
  .g-row{display:flex;align-items:center;gap:14px;padding:14px 0 15px;border-bottom:.5px solid var(--sep);cursor:pointer}
  .g-num{font-size:46px;font-weight:200;letter-spacing:-.01em;line-height:1.05;font-variant-numeric:tabular-nums;white-space:nowrap}
  .g-num small{font-size:22px;font-weight:300;color:var(--ink)}
  .g-num.over{color:#b00}
  .g-info{flex:1;min-width:0;padding-top:2px}
  .g-name{font-size:15px;font-weight:400;line-height:1.45;word-break:break-word}
  .g-date{font-size:13px;color:var(--gray);margin-top:1px;font-variant-numeric:tabular-nums}
  .g-prog{flex:none;width:44px;text-align:right;font-size:13px;color:var(--gray);font-variant-numeric:tabular-nums}

  /* ============ task rows ============ */
  .t-row{display:flex;align-items:center;gap:14px;padding:13px 0;border-bottom:.5px solid var(--sep);cursor:pointer}
  .t-check{flex:none;width:22px;height:22px;border-radius:50%;border:1.5px solid var(--gray2);display:grid;place-items:center;transition:.2s}
  .t-check svg{width:11px;height:11px;opacity:0;transform:scale(.4);transition:.2s}
  .t-row.done .t-check{background:var(--ink);border-color:var(--ink)}
  .t-row.done .t-check svg{opacity:1;transform:scale(1)}
  .t-main{flex:1;min-width:0}
  .t-name{font-size:17px;font-weight:400;line-height:1.4;word-break:break-word}
  .t-row.done .t-name{color:var(--gray);text-decoration:line-through;text-decoration-color:var(--gray2)}
  .t-sub{font-size:13px;color:var(--gray);margin-top:2px}
  .empty{color:var(--gray);font-size:15px;padding:28px 0;text-align:center}

  /* ============ calendar ============ */
  .cal-head{display:flex;align-items:center;justify-content:space-between;margin:8px 0 14px}
  .cal-title{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
  .cal-nav{display:flex;gap:4px}
  .cal-nav button{width:38px;height:38px;border:none;background:none;color:var(--ink);cursor:pointer;font-size:20px;border-radius:50%}
  .cal-nav button:active{background:var(--fill)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);row-gap:4px;text-align:center}
  .cal-wd{font-size:12px;color:var(--gray);font-weight:500;padding:6px 0 10px}
  .cal-d{position:relative;height:48px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;padding-top:5px;cursor:pointer;border-radius:12px}
  .cal-d span{width:34px;height:34px;display:grid;place-items:center;font-size:19px;font-weight:300;border-radius:50%;font-variant-numeric:tabular-nums}
  .cal-d.dim span{color:var(--gray2)}
  .cal-d.today span{font-weight:600}
  .cal-d.sel span{background:var(--ink);color:#fff;font-weight:500}
  .cal-d .dot{width:4.5px;height:4.5px;border-radius:50%;background:var(--gray2);margin-top:1px}
  .cal-d .dot.on{background:var(--ink)}
  .cal-d .flag{position:absolute;top:2px;right:6px;width:5px;height:5px;border-radius:50%;background:#b00}
  .cal-detail{margin-top:18px;border-top:.5px solid var(--sep)}
  .cal-dl{padding:13px 0;border-bottom:.5px solid var(--sep);display:flex;align-items:center;gap:12px}
  .cal-dl .f{flex:none;width:6px;height:6px;border-radius:50%;background:#b00}
  .cal-dl span{font-size:15px}
  .cal-dl small{color:var(--gray);font-size:13px;margin-left:auto;flex:none}

  /* ============ goal detail / form ============ */
  .g-detail{display:none;padding:4px 0 16px;border-bottom:.5px solid var(--sep)}
  .g-row.open + .g-detail{display:block}
  .g-note{font-size:15px;color:var(--gray);line-height:1.8;white-space:pre-wrap;word-break:break-word;padding:6px 0 12px}
  .mini-t{display:flex;align-items:center;gap:12px;padding:9px 0;font-size:15px}
  .mini-t .c{flex:none;width:17px;height:17px;border-radius:50%;border:1.5px solid var(--gray2);display:grid;place-items:center}
  .mini-t.done .c{background:var(--ink);border-color:var(--ink)}
  .mini-t.done span{color:var(--gray);text-decoration:line-through}
  .mini-t i{font-style:normal;font-size:13px;color:var(--gray);margin-left:auto;font-variant-numeric:tabular-nums;flex:none}
  .chips{display:flex;gap:8px;margin-top:12px}
  .chip{padding:9px 16px;border-radius:999px;border:none;background:var(--fill);font-size:14px;font-weight:500;font-family:inherit;color:var(--ink);cursor:pointer}
  .chip.danger{color:#b00}
  .gform{padding:16px 0 22px;border-bottom:.5px solid var(--sep);display:none}
  .gform.show{display:block}
  .gform input,.gform textarea{width:100%;border:none;background:var(--fill);border-radius:12px;font-family:inherit;font-size:17px;padding:13px 14px;outline:none;color:var(--ink);margin-bottom:10px}
  .gform textarea{font-size:16px;line-height:1.7;resize:none;min-height:64px}
  .gform .row{display:flex;gap:8px;margin-top:4px}
  .btn{flex:1;padding:14px;border-radius:999px;border:none;font-size:15px;font-weight:600;font-family:inherit;cursor:pointer}
  .btn.primary{background:var(--ink);color:#fff}
  .btn.plain{background:var(--fill);color:var(--ink)}

  /* ============ settings (hidden) ============ */
  .settings-toggle{border:none;background:none;color:var(--gray2);font-size:12px;font-family:inherit;cursor:pointer;display:block;margin:40px auto 0;letter-spacing:.08em}
  .settings{display:none;margin-top:18px;padding:18px;background:var(--fill);border-radius:16px}
  .settings.show{display:block}
  .settings p{font-size:13px;color:var(--gray);line-height:1.8;margin-bottom:10px}
  .settings input,.settings textarea{width:100%;border:none;background:#fff;border-radius:10px;font-family:ui-monospace,monospace;font-size:16px;padding:12px;outline:none;margin-bottom:8px;color:var(--ink)}
  .settings textarea{min-height:80px;resize:vertical}
  .settings .btn{width:100%;margin-bottom:8px;padding:12px;font-size:14px}
  .stat{font-size:12px;color:var(--gray);margin-top:6px;line-height:1.7}

  /* ============ liquid glass tab bar ============ */
  nav{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom) + 14px);z-index:7;display:flex;justify-content:center;pointer-events:none}
  .tabbar{pointer-events:auto;display:flex;gap:0;padding:5px;border-radius:999px;position:relative;
    background:rgba(255,255,255,.55);
    backdrop-filter:blur(28px) saturate(180%);-webkit-backdrop-filter:blur(28px) saturate(180%);
    box-shadow:0 10px 34px rgba(0,0,0,.13), inset 0 0 0 .5px rgba(0,0,0,.06), inset 0 1.5px 1px rgba(255,255,255,.9)}
  .tab{width:86px;padding:9px 0 8px;border-radius:999px;border:none;background:none;color:var(--gray);
    font-size:10px;font-weight:500;font-family:inherit;letter-spacing:.02em;cursor:pointer;transition:.25s;
    display:flex;flex-direction:column;align-items:center;gap:3px}
  .tab svg{width:23px;height:23px}
  .tab.active{color:var(--ink);background:rgba(255,255,255,.9);
    box-shadow:0 3px 12px rgba(0,0,0,.10), inset 0 0 0 .5px rgba(0,0,0,.05), inset 0 1px 0 rgba(255,255,255,1)}

  /* ============ toast ============ */
  #toast{position:fixed;top:calc(env(safe-area-inset-top) + 16px);left:50%;transform:translateX(-50%) translateY(-80px);z-index:20;padding:12px 22px;font-size:14px;font-weight:500;transition:.4s cubic-bezier(.22,1,.36,1);white-space:nowrap;color:var(--ink);border-radius:999px;
    background:rgba(255,255,255,.65);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
    box-shadow:0 8px 28px rgba(0,0,0,.16), inset 0 0 0 .5px rgba(0,0,0,.06)}
  #toast.show{transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
<div id="app">
<main id="main">

  <!-- ============ TODAY ============ -->
  <section class="screen active" id="scr-today">
    <div class="navrow">
      <div>
        <div class="caption" id="todayCap"></div>
        <h1 class="large-title">今日</h1>
      </div>
    </div>

    <div class="sec-h"><h2>ゴール</h2>
      <button class="more" id="toGoals">すべて<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button>
    </div>
    <div id="todayGoals"></div>

    <div class="sec-h"><h2>タスク</h2><span class="caption" id="taskCount"></span></div>
    <div id="todayTasks"></div>
  </section>

  <!-- ============ CALENDAR ============ -->
  <section class="screen" id="scr-cal">
    <div class="navrow">
      <div>
        <div class="caption">スケジュール</div>
        <h1 class="large-title">カレンダー</h1>
      </div>
    </div>
    <div class="cal-head">
      <div class="cal-title" id="calTitle"></div>
      <div class="cal-nav"><button id="calPrev">‹</button><button id="calNext">›</button></div>
    </div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="cal-detail" id="calDetail"></div>
  </section>

  <!-- ============ GOALS ============ -->
  <section class="screen" id="scr-goals">
    <div class="navrow">
      <div>
        <div class="caption">Goals</div>
        <h1 class="large-title">ゴール</h1>
      </div>
      <button class="navbtn bold" id="btnAddGoal">＋</button>
    </div>
    <div class="gform" id="gform">
      <input type="text" id="gfTitle" placeholder="ゴール（例：電通に受かる）">
      <input type="date" id="gfDate">
      <textarea id="gfNote" placeholder="メモ（任意）"></textarea>
      <div class="row">
        <button class="btn plain" id="gfCancel">やめる</button>
        <button class="btn primary" id="gfSave">保存</button>
      </div>
    </div>
    <div id="goalList"></div>

    <button class="settings-toggle" id="setToggle">設定</button>
    <div class="settings" id="settings">
      <p>ChatGPTには「GitHubの <b>purpose/data.json</b> を編集して」と言えば全端末に自動反映。このアプリからの変更を書き戻すにはトークンを一度だけ保存。</p>
      <input type="password" id="tokenInput" placeholder="GitHub token（Contents: Read/Write）">
      <button class="btn primary" id="btnSyncNow">保存して同期</button>
      <button class="btn plain" id="btnExport">壁打ちプロンプトをコピー</button>
      <textarea id="pasteArea" placeholder="ChatGPTのJSONを貼って取り込み"></textarea>
      <button class="btn plain" id="btnImport">取り込む</button>
      <button class="btn plain" id="btnBackup">バックアップ書き出し</button>
      <div class="stat" id="syncStat"></div>
    </div>
  </section>

</main>

<nav><div class="tabbar">
  <button class="tab active" data-scr="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><path d="M12 7.6v4.4l3.1 1.9"/></svg>今日</button>
  <button class="tab" data-scr="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15.5" rx="3.5"/><path d="M3.5 9.5h17M8 2.8v3.4M16 2.8v3.4"/></svg>カレンダー</button>
  <button class="tab" data-scr="goals"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><circle cx="12" cy="12" r="8.6"/><circle cx="12" cy="12" r="4.6"/><circle cx="12" cy="12" r="1.1" fill="currentColor"/></svg>ゴール</button>
</div></nav>

<div id="toast"></div>
</div>

<script>
/* ================= state ================= */
const KEY='purpose.v2';
const REPO='gjnzqqf8dq-coder/purpose', PATH='data.json', BRANCH='main';
const emptyState=()=>({goals:[],tasks:[],del:{}});
let S=load(), sha=null, pushT=null, lastPull=0;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY));if(d&&d.goals)return Object.assign(emptyState(),d)}catch(e){}return emptyState()}
function persist(){localStorage.setItem(KEY,JSON.stringify(S))}
function save(){persist();schedulePush();render()}
const uid=p=>(p||'x')+Date.now().toString(36)+Math.floor(Math.random()*1e4).toString(36);

/* ================= dates ================= */
const pad=n=>String(n).padStart(2,'0');
const fmt=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const now=new Date(), TODAY=fmt(now);
const WDJ=['日','月','火','水','木','金','土'];
function dleft(dl){const a=new Date(TODAY+'T00:00:00'),b=new Date(dl+'T00:00:00');return Math.round((b-a)/864e5)}
let calY=now.getFullYear(), calM=now.getMonth(), calSel=TODAY;

/* ================= util ================= */
let toastT;
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('show'),2200)}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}

/* ================= tabs ================= */
function goTab(name){
  document.querySelectorAll('.tab').forEach(x=>x.classList.toggle('active',x.dataset.scr===name));
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById('scr-'+name).classList.add('active');
  render();document.getElementById('main').scrollTo({top:0});
}
document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>goTab(b.dataset.scr));
document.getElementById('toGoals').onclick=()=>goTab('goals');

/* ================= render ================= */
let openGoal=null;
function render(){renderToday();renderCal();renderGoals()}

function goalRow(g,compact){
  const dl=g.deadline?dleft(g.deadline):null;
  const linked=S.tasks.filter(t=>t.goalId===g.id), done=linked.filter(t=>t.done).length;
  const num=dl===null?'<small>—</small>':(dl<0?`<small>+</small>${-dl}`:`<small>D-</small>${dl}`);
  return `<div class="g-row${openGoal===g.id&&!compact?' open':''}" data-gid="${g.id}">
    <div class="g-num${dl!==null&&dl<0?' over':''}">${num}</div>
    <div class="g-info"><div class="g-name">${esc(g.title)}</div>
      <div class="g-date">${g.deadline?g.deadline.replace(/-/g,'/'):'期限なし'}</div></div>
    <div class="g-prog">${linked.length?`${done}/${linked.length}`:''}</div>
  </div>`;
}
function sortedGoals(){return [...S.goals].sort((a,b)=>(a.deadline||'9999')<(b.deadline||'9999')?-1:1)}

function renderToday(){
  document.getElementById('todayCap').textContent=`${now.getMonth()+1}月${now.getDate()}日 ${WDJ[now.getDay()]}曜日`;
  const gs=sortedGoals();
  const short=gs.filter(g=>g.deadline&&dleft(g.deadline)<=90);
  const long=gs.filter(g=>!g.deadline||dleft(g.deadline)>90);
  let html='';
  if(short.length)html+=`<div class="sec-sub">短期</div>`+short.map(g=>goalRow(g,true)).join('');
  if(long.length)html+=`<div class="sec-sub">長期</div>`+long.map(g=>goalRow(g,true)).join('');
  if(!gs.length)html='<div class="empty">ゴールはまだない</div>';
  const wrap=document.getElementById('todayGoals');wrap.innerHTML=html;
  wrap.querySelectorAll('.g-row').forEach(r=>r.onclick=()=>{openGoal=r.dataset.gid;goTab('goals')});
  // tasks
  const ts=S.tasks.filter(t=>t.date===TODAY);
  const list=document.getElementById('todayTasks');
  list.innerHTML=ts.length?ts.map(t=>taskRow(t)).join(''):'<div class="empty">今日のタスクはない</div>';
  bindTasks(list);
  const done=ts.filter(t=>t.done).length;
  document.getElementById('taskCount').textContent=ts.length?`${done} / ${ts.length}`:'';
}
function taskRow(t){
  const g=S.goals.find(x=>x.id===t.goalId);
  return `<div class="t-row${t.done?' done':''}" data-tid="${t.id}">
    <div class="t-check"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg></div>
    <div class="t-main"><div class="t-name">${esc(t.title)}</div>${g?`<div class="t-sub">${esc(g.title)}</div>`:''}</div>
  </div>`;
}
function bindTasks(root){
  root.querySelectorAll('.t-row').forEach(el=>{
    const t=S.tasks.find(x=>x.id===el.dataset.tid);if(!t)return;
    let press;
    el.addEventListener('pointerdown',()=>{press=setTimeout(()=>{press=null;if(confirm('このタスクを削除する？')){S.del[t.id]=Date.now();S.tasks=S.tasks.filter(x=>x.id!==t.id);save()}},550)});
    el.addEventListener('pointerup',()=>{if(press){clearTimeout(press);t.done=!t.done;t.u=Date.now();save()}});
    el.addEventListener('pointerleave',()=>clearTimeout(press));
  });
}

/* ================= calendar ================= */
document.getElementById('calPrev').onclick=()=>{calM--;if(calM<0){calM=11;calY--}renderCal()};
document.getElementById('calNext').onclick=()=>{calM++;if(calM>11){calM=0;calY++}renderCal()};
function renderCal(){
  document.getElementById('calTitle').textContent=`${calY}年${calM+1}月`;
  const grid=document.getElementById('calGrid');
  let html=WDJ.map(w=>`<div class="cal-wd">${w}</div>`).join('');
  const first=new Date(calY,calM,1), start=first.getDay(), days=new Date(calY,calM+1,0).getDate();
  const prevDays=new Date(calY,calM,0).getDate();
  const cells=[];
  for(let i=start-1;i>=0;i--)cells.push({d:prevDays-i,dim:true,date:fmt(new Date(calY,calM-1,prevDays-i))});
  for(let d=1;d<=days;d++)cells.push({d,dim:false,date:fmt(new Date(calY,calM,d))});
  while(cells.length%7)cells.push({d:cells.length%7,dim:true,date:fmt(new Date(calY,calM+1,cells.length%7))});
  const taskDates=new Set(S.tasks.map(t=>t.date));
  const openDates=new Set(S.tasks.filter(t=>!t.done).map(t=>t.date));
  const dlDates=new Set(S.goals.filter(g=>g.deadline).map(g=>g.deadline));
  html+=cells.map(c=>`<div class="cal-d${c.dim?' dim':''}${c.date===TODAY?' today':''}${c.date===calSel?' sel':''}" data-d="${c.date}">
    <span>${c.d}</span>${taskDates.has(c.date)?`<div class="dot${openDates.has(c.date)?' on':''}"></div>`:''}${dlDates.has(c.date)?'<div class="flag"></div>':''}
  </div>`).join('');
  grid.innerHTML=html;
  grid.querySelectorAll('.cal-d').forEach(el=>el.onclick=()=>{calSel=el.dataset.d;renderCal()});
  // detail
  const det=document.getElementById('calDetail');
  const d=new Date(calSel+'T00:00:00');
  const dls=S.goals.filter(g=>g.deadline===calSel);
  const ts=S.tasks.filter(t=>t.date===calSel);
  det.innerHTML=`<div class="sec-sub">${d.getMonth()+1}月${d.getDate()}日 ${WDJ[d.getDay()]}曜日</div>`
    +dls.map(g=>`<div class="cal-dl"><div class="f"></div><span>${esc(g.title)}</span><small>期限</small></div>`).join('')
    +(ts.length?ts.map(t=>taskRow(t)).join(''):(dls.length?'':'<div class="empty">予定はない</div>'));
  bindTasks(det);
}

/* ================= goals screen ================= */
function renderGoals(){
  const list=document.getElementById('goalList');
  const gs=sortedGoals();
  list.innerHTML=gs.length?gs.map(g=>goalRow(g)+goalDetail(g)).join(''):'<div class="empty">＋ からゴールを追加</div>';
  list.querySelectorAll('.g-row').forEach(r=>r.onclick=()=>{openGoal=openGoal===r.dataset.gid?null:r.dataset.gid;renderGoals()});
  gs.forEach(g=>{
    const det=list.querySelector(`.g-detail[data-gid="${g.id}"]`);if(!det)return;
    det.querySelectorAll('.mini-t').forEach(row=>row.onclick=()=>{
      const t=S.tasks.find(x=>x.id===row.dataset.tid);if(t){t.done=!t.done;t.u=Date.now();save()}
    });
    det.querySelector('[data-act=task]').onclick=()=>{
      const title=prompt('タスク名（今日に入る）');
      if(title&&title.trim()){S.tasks.push({id:uid('t'),title:title.trim(),date:TODAY,done:false,goalId:g.id,u:Date.now()});save();toast('今日に追加した')}
    };
    det.querySelector('[data-act=edit]').onclick=()=>{
      const f=document.getElementById('gform');f.classList.add('show');f.dataset.edit=g.id;
      document.getElementById('gfTitle').value=g.title;document.getElementById('gfDate').value=g.deadline||'';document.getElementById('gfNote').value=g.note||'';
      document.getElementById('main').scrollTo({top:0,behavior:'smooth'});
    };
    det.querySelector('[data-act=del]').onclick=()=>{
      if(confirm(`「${g.title}」を削除する？`)){S.del[g.id]=Date.now();S.goals=S.goals.filter(x=>x.id!==g.id);S.tasks.forEach(t=>{if(t.goalId===g.id){t.goalId=null;t.u=Date.now()}});save()}
    };
  });
}
function goalDetail(g){
  const linked=S.tasks.filter(t=>t.goalId===g.id).sort((a,b)=>a.date<b.date?-1:1);
  return `<div class="g-detail" data-gid="${g.id}">
    ${g.note?`<div class="g-note">${esc(g.note)}</div>`:''}
    ${linked.map(t=>`<div class="mini-t${t.done?' done':''}" data-tid="${t.id}"><div class="c">${t.done?'<svg viewBox="0 0 24 24" width="9" height="9" fill="none" stroke="#fff" stroke-width="3.4" stroke-linecap="round"><path d="M4 12.5l5 5L20 6.5"/></svg>':''}</div><span>${esc(t.title)}</span><i>${t.date.slice(5).replace('-','/')}</i></div>`).join('')}
    <div class="chips">
      <button class="chip" data-act="task">タスク追加</button>
      <button class="chip" data-act="edit">編集</button>
      <button class="chip danger" data-act="del">削除</button>
    </div>
  </div>`;
}
document.getElementById('btnAddGoal').onclick=()=>{
  const f=document.getElementById('gform');f.dataset.edit='';
  ['gfTitle','gfNote'].forEach(i=>document.getElementById(i).value='');document.getElementById('gfDate').value='';
  f.classList.toggle('show');if(f.classList.contains('show'))document.getElementById('gfTitle').focus();
};
document.getElementById('gfCancel').onclick=()=>document.getElementById('gform').classList.remove('show');
document.getElementById('gfSave').onclick=()=>{
  const f=document.getElementById('gform');
  const title=document.getElementById('gfTitle').value.trim();
  if(!title){toast('ゴール名を入れて');return}
  const deadline=document.getElementById('gfDate').value||null;
  const note=document.getElementById('gfNote').value.trim();
  if(f.dataset.edit){const g=S.goals.find(x=>x.id===f.dataset.edit);if(g)Object.assign(g,{title,deadline,note,u:Date.now()})}
  else S.goals.push({id:uid('g'),title,deadline,note,u:Date.now()});
  f.classList.remove('show');save();
};
document.getElementById('setToggle').onclick=()=>document.getElementById('settings').classList.toggle('show');

/* ================= merge ================= */
function mergeState(a,b){
  const out=emptyState();
  out.del={...a.del,...b.del};
  for(const k of Object.keys(out.del))for(const src of[a.del,b.del])if(src[k]&&src[k]>out.del[k])out.del[k]=src[k];
  const pick=(la,lb)=>{
    const m=new Map();
    [...la,...lb].forEach(e=>{if(!e||!e.id)return;const ex=m.get(e.id);if(!ex||(e.u||0)>(ex.u||0))m.set(e.id,e)});
    return[...m.values()].filter(e=>!(out.del[e.id]&&out.del[e.id]>(e.u||0)));
  };
  out.goals=pick(a.goals||[],b.goals||[]);
  out.tasks=pick(a.tasks||[],b.tasks||[]);
  return out;
}

/* ================= github sync ================= */
const tok=()=>localStorage.getItem('purpose.token')||'';
const b64e=s=>btoa(String.fromCharCode(...new TextEncoder().encode(s)));
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\n/g,'')),c=>c.charCodeAt(0)));
async function gh(path,opt={}){
  const h={'Accept':'application/vnd.github+json',...(opt.headers||{})};
  if(tok())h['Authorization']='Bearer '+tok();
  const r=await fetch(`https://api.github.com/repos/${REPO}/${path}`,{...opt,headers:h});
  if(!r.ok&&r.status!==404)throw new Error('GitHub '+r.status);
  return r.status===404?null:r.json();
}
async function pull(){
  const j=await gh(`contents/${PATH}?ref=${BRANCH}&t=${Date.now()}`);
  if(!j)return false;
  sha=j.sha;
  let remote;try{remote=JSON.parse(b64d(j.content))}catch(e){return false}
  S=mergeState(S,Object.assign(emptyState(),remote));persist();render();
  lastPull=Date.now();
  return true;
}
async function push(){
  const body={message:'update from Purpose app',content:b64e(JSON.stringify(S,null,2)),branch:BRANCH};
  if(sha)body.sha=sha;
  try{
    const j=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});
    if(j&&j.content){sha=j.content.sha;setStat('同期済み '+new Date().toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'}))}
  }catch(e){
    try{await pull();body.sha=sha;body.content=b64e(JSON.stringify(S,null,2));
      const j2=await gh(`contents/${PATH}`,{method:'PUT',body:JSON.stringify(body)});
      if(j2&&j2.content){sha=j2.content.sha;setStat('同期済み（マージ）')}
    }catch(e2){setStat('同期エラー — 後で再試行')}
  }
}
function schedulePush(){if(!tok())return;clearTimeout(pushT);pushT=setTimeout(push,3500)}
function setStat(m){document.getElementById('syncStat').textContent=m||''}
document.getElementById('btnSyncNow').onclick=async()=>{
  const v=document.getElementById('tokenInput').value.trim();
  if(v)localStorage.setItem('purpose.token',v);
  if(!tok()){toast('トークンを入れて');return}
  document.getElementById('tokenInput').value='';
  setStat('同期中…');
  try{await pull();await push();toast('同期した')}
  catch(e){setStat('接続できない — トークンを確認');toast('同期に失敗')}
};

/* ================= export / import / backup ================= */
document.getElementById('btnExport').onclick=async()=>{
  const p=`あなたは目標達成のコーチです。私は「Purpose」というアプリで複数のゴール（期限つき）と日々のタスクを管理しています。

現在の全データ（PURPOSE_JSON）：
\`\`\`json
${JSON.stringify(S,null,2)}
\`\`\`

スキーマ：
- goals: {id, title, deadline:"YYYY-MM-DD"|null, note, u:更新epoch_ms}
- tasks: {id, title, date:"YYYY-MM-DD", done, goalId|null, u}
- 新規idは"g_xxx"/"t_xxx"等ユニークに。uは必ず現在時刻のepoch msに。既存を消さない。

やってほしいこと：
1. 現在地を読んで壁打ち（質問は一度に2つまで）。ゴール分解＝期限から逆算して日付つきタスクへ。
2. まとまったら、変更・追加分だけを {"goals":[...],"tasks":[...]} のjsonコードブロックで出力。

今日は${TODAY}。では現在地の要約と最初の質問から。`;
  try{await navigator.clipboard.writeText(p);toast('コピーした。ChatGPTへ')}
  catch(e){document.getElementById('pasteArea').value=p;toast('下の欄からコピーして')}
};
document.getElementById('btnImport').onclick=()=>{
  let raw=document.getElementById('pasteArea').value.trim();
  if(!raw){toast('先に貼り付けて');return}
  const m=raw.match(/```(?:json)?\s*([\s\S]*?)```/);if(m)raw=m[1];
  let j;try{j=JSON.parse(raw)}catch(e){toast('JSONとして読めなかった');return}
  if(Array.isArray(j))j={tasks:j};
  const inc=emptyState();
  inc.goals=(j.goals||[]).map(g=>({id:g.id||uid('g'),title:String(g.title||''),deadline:g.deadline||null,note:g.note||'',u:g.u||Date.now()})).filter(g=>g.title);
  inc.tasks=(j.tasks||[]).map(t=>({id:t.id||uid('t'),title:String(t.title||''),date:t.date||TODAY,done:!!t.done,goalId:t.goalId||null,u:t.u||Date.now()})).filter(t=>t.title);
  const before=JSON.stringify(S);
  S=mergeState(S,inc);
  if(JSON.stringify(S)===before){toast('変更なし');return}
  document.getElementById('pasteArea').value='';save();toast('取り込んだ');
};
document.getElementById('btnBackup').onclick=()=>{
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,2)],{type:'application/json'}));
  a.download=`purpose_backup_${TODAY}.json`;a.click();
};

/* ================= boot ================= */
render();
pull().then(ok=>{if(tok())setStat(ok?'同期済み（読み書き）':'リモート未作成')}).catch(()=>{});
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&Date.now()-lastPull>60000)pull().catch(()=>{});
});
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
